<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>忍風伝</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#07060c;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;background:#000;display:block}
  #touch{position:fixed;inset:0;pointer-events:none;display:none;font-family:"DotGothic16",monospace}
  #touch .b{position:absolute;pointer-events:auto;width:64px;height:64px;border-radius:50%;
    background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.35);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:20px}
  #touch .b.on{background:rgba(220,60,70,.45)}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="480" height="272"></canvas></div>
<div id="touch">
  <div class="b" data-k="left"  style="left:16px;bottom:28px">◀</div>
  <div class="b" data-k="right" style="left:96px;bottom:28px">▶</div>
  <div class="b" data-k="throw" style="right:176px;bottom:28px">投</div>
  <div class="b" data-k="slash" style="right:96px;bottom:60px">斬</div>
  <div class="b" data-k="jump"  style="right:16px;bottom:28px">跳</div>
</div>

<script>
/*!
 * wafue.js — 尺八・竜笛の物理モデル音源（デジタル導波管 / STK Flute 系）
 * 依存なし・単一ファイル。ブラウザ（Web Audio）と Node（オフライン描画）の両方で動く。
 *
 *   const wf = Wafue.create({ instrument: "shakuhachi" });   // or "ryuteki"
 *   button.onclick = () => { wf.unlock(); wf.play("title"); };
 *
 * API は SKILL.md、モデルの中身は references/model.md を参照。
 */
(function (root) {
  "use strict";

  // ------------------------------------------------------------------ instruments
  // tuneK / tuneC は Node で実測した音程補正（len = tuneK*sr/f - tuneC）。
  // pole やジェット比を変えたら scripts/calibrate.js で測り直すこと。
  const INSTRUMENTS = {
    shakuhachi: {
      label: "尺八", reg: ["乙", "甲"], flipName: "裏返り",
      notes: [
        { id: "ro", k: "ロ", f: 293.66 }, { id: "tsu", k: "ツ", f: 349.23 },
        { id: "re", k: "レ", f: 392.0 }, { id: "chi", k: "チ", f: 440.0 },
        { id: "ri", k: "リ", f: 523.25 },
      ],
      tuneK: 1.0136 / 0.6667, tuneC: 2, pole: 0.70,
      breathBase: 0.88, breathRange: 0.22, octBoost: 0.06,
      tame: 1, vibScale: 1, noiseScale: 1, enbai: false,
      defaults: { breath: 0.45, noise: 0.35, mura: 0.4, yuri: 0.35, reverb: 0.4 },
    },
    ryuteki: {
      label: "竜笛", reg: ["和", "責"], flipName: "ヒシギ",
      notes: [
        { id: "roku", k: "六", f: 659.26 }, { id: "chu", k: "中", f: 739.99 },
        { id: "shaku", k: "夕", f: 783.99 }, { id: "jo", k: "丄", f: 880.0 },
        { id: "go", k: "五", f: 987.77 }, { id: "kan", k: "干", f: 1108.73 },
        { id: "shi", k: "次", f: 1174.66 },
      ],
      tuneK: 1.5126, tuneC: 0.84, pole: 0.55,
      breathBase: 0.93, breathRange: 0.17, octBoost: 0.05,
      tame: 0.25, vibScale: 0.35, noiseScale: 0.85, enbai: true,
      defaults: { breath: 0.45, noise: 0.35, mura: 0.4, yuri: 0.35, reverb: 0.45 },
    },
  };

  // ------------------------------------------------------------------ voice (DSP)
  const N = 8192;
  const BASE_JET = 0.32, FLIP_JET = 0.1, UNFLIP_JET = 0.45; // flip = 3 倍音モードへの跳躍
  const FLOOR = 0.86; // 発振閾値のすぐ上。リリース中はここまで息を下げて鳴らし続ける

  class Voice {
    constructor(sr, instrument) {
      this.sr = sr; this.n = 0; this.queue = [];
      this.bore = new Float32Array(N); this.jet = new Float32Array(N);
      this.bw = 0; this.jw = 0; this.lp = 0; this.dcx = 0; this.dcy = 0;
      this.env = 0; this.on = false; this.breath = 0; this.amp = 0; this.airAmp = 0;
      this.held = 0; this.relT = 10; this.vibPhase = 0; this.vibRamp = 0;
      this.mur = 0; this.dip = 0; this.scoop = 0;
      this.jetRatio = BASE_JET; this.unflipT = 0; this.userFlip = false; this.autoUnflipT = 0; this.accentT = 0;
      this.flipMix = 0; this.flipLp = 0; this.nb1 = 0; this.nb2 = 0;
      this.hz = 293.66; this.oct = 0;
      this.bendFrom = 0; this.bendTo = 0; this.bendStart = 0; this.bendDur = 0; this.bendCurve = "out"; this.bendCur = 0;
      this.fallDark = 0;
      this.setInstrument(instrument);
      this.hz = this.I.notes[0].f;
      this._control();
      this.curLen = this.targetLen; this.lpPole = this.lpPoleT;
    }
    setInstrument(name) {
      const I = INSTRUMENTS[name]; if (!I) throw new Error("unknown instrument: " + name);
      this.I = I; this.name = name;
      this.params = Object.assign({}, I.defaults);
    }
    set(p) { for (const k in p) if (k in this.params) this.params[k] = p[k]; }
    lenFor(f) { return this.I.tuneK * this.sr / f - this.I.tuneC; }

    // ---- scheduling (sample-accurate) ----
    at(sample, fn) {
      const q = this.queue; let i = q.length;
      while (i > 0 && q[i - 1].at > sample) i--;
      q.splice(i, 0, { at: sample, fn });
    }
    clear() { this.queue.length = 0; }

    // ---- performance actions ----
    noteOn(hz, o) {
      o = o || {};
      const legato = this.on;
      this.hz = hz; this.oct = o.oct ? 1 : 0;
      this.bendNow(o.bend || 0);
      this.fallDark = 0;
      if (this.I.enbai && o.enbai !== false && !o.accent) this.scoop = legato ? -0.55 : -0.9;
      if (o.accent) this.accent();
      else if (legato) { this.dip = 0.12; this.mur = Math.max(this.mur, this.params.mura * 0.15); }
      else this.mur = this.params.mura;
      this.on = true;
    }
    noteOff() { this.on = false; }
    bendNow(semi) { this.bendFrom = this.bendTo = this.bendCur = semi; this.bendDur = 0; }
    glideTo(semi, ms, curve) {
      this.bendFrom = this.bendCur; this.bendTo = semi; this.bendStart = this.n;
      this.bendDur = Math.max(1, ms * this.sr / 1000); this.bendCurve = curve || "out";
    }
    fall(semi, ms) { this.noteOff(); this.fallDark = Math.min(0.2, -semi * 0.04); this.glideTo(this.bendCur + semi, ms, "in"); }
    accent() {
      this.accentT = 0.03; this.dip = -0.16;
      this.mur = Math.max(this.mur, 0.25 + this.params.mura * 0.6);
      this._flip(true); this.flipMix = 0.2;
      this.autoUnflipT = 0.09 + Math.random() * 0.05;
    }
    flip(on) { this.userFlip = on; if (on || this.autoUnflipT <= 0) this._flip(on); }
    _flip(on) {
      if (on) { this.jetRatio = FLIP_JET; this.mur = Math.max(this.mur, 0.12); this.dip = Math.max(this.dip, 0.08); }
      else if (this.jetRatio !== BASE_JET) { this.jetRatio = BASE_JET; this.unflipT = 0.09; this.dip = Math.max(this.dip, 0.06); }
    }
    silent() { return !this.on && this.amp < 1e-4 && this.airAmp < 1e-4 && !this.queue.length; }

    // ---- control-rate update (every 64 samples) ----
    _control() {
      if (this.bendDur > 0) {
        const p = Math.min(1, (this.n - this.bendStart) / this.bendDur);
        const s = this.bendCurve === "in" ? p * p : this.bendCurve === "linear" ? p : 1 - (1 - p) * (1 - p);
        this.bendCur = this.bendFrom + (this.bendTo - this.bendFrom) * s;
        if (p >= 1) this.bendDur = 0;
      }
      const I = this.I, P = this.params, meri = Math.min(2, Math.max(0, -this.bendCur));
      const f = this.hz * (this.oct ? 2 : 1) * Math.pow(2, this.bendCur / 12);
      this.targetLen = this.lenFor(f);
      this.lpPoleT = Math.min(0.92, I.pole + meri * 0.07 + (this.on ? 0 : this.fallDark));
      this.breathMax = I.breathBase + P.breath * I.breathRange + (this.oct ? I.octBoost : 0) - meri * 0.02;
      this.noiseAmt = P.noise * I.noiseScale;
      this.vibDepth = P.yuri * I.vibScale;
    }

    rd(buf, w, d) { let p = w - d; while (p < 0) p += N; const i = p | 0, fr = p - i; const a = buf[i % N]; return a + (buf[(i + 1) % N] - a) * fr; }

    process(out, off, len) {
      const sr = this.sr;
      const atk = 1 - Math.exp(-1 / (0.06 * sr)), atkHard = 1 - Math.exp(-1 / (0.008 * sr));
      const ampAtk = 1 - Math.exp(-1 / (0.03 * sr)), ampRel = Math.exp(-1 / (0.28 * sr)), airRel = Math.exp(-1 / (0.38 * sr));
      const brSmooth = 1 - Math.exp(-1 / (0.05 * sr)), glide = 1 - Math.exp(-1 / (0.018 * sr)), pole = 1 - Math.exp(-1 / (0.05 * sr));
      const vibInc = 2 * Math.PI * 5.1 / sr, q = this.queue;
      for (let i = off; i < off + len; i++) {
        while (q.length && q[0].at <= this.n) q.shift().fn();
        if ((this.n & 63) === 0) this._control();
        this.n++;
        const on = this.on;
        if (on) { this.held += 1 / sr; this.relT = 0; } else { this.held = 0; this.relT += 1 / sr; }
        // ユリ：伸ばして 0.4 秒ほどしてからかかり始める
        const vr = this.held > 0.4 ? Math.min(1, (this.held - 0.4) / 0.8) : 0;
        this.vibRamp += (vr - this.vibRamp) * 0.0005;
        this.vibPhase += vibInc * (1 + 0.08 * Math.sin(this.vibPhase * 0.13));
        const vib = Math.sin(this.vibPhase) * this.vibDepth * this.vibRamp;

        if (on) {
          this.env += (1 - this.env) * (this.accentT > 0 ? atkHard : atk);
          if (this.accentT > 0) this.accentT -= 1 / sr;
          if (this.autoUnflipT > 0) { this.autoUnflipT -= 1 / sr; if (this.autoUnflipT <= 0 && !this.userFlip) this._flip(false); }
          this.breath = this.env * this.breathMax * (1 + vib * 0.05) * (1 - this.dip);
          this.amp += (1 - this.amp) * (this.accentT > 0 ? atkHard : ampAtk); this.airAmp += (1 - this.airAmp) * ampAtk;
        } else {
          // 吹き終わり：息を発振閾値の少し上まで下げて鳴らし続けながら音量を抜く（急に切れない）
          this.env *= 0.99995;
          const tgt = this.relT < 1.0 ? FLOOR + (Math.max(this.breathMax, FLOOR) - FLOOR) * Math.exp(-this.relT / 0.15) : 0;
          this.breath += (tgt - this.breath) * brSmooth;
          this.amp *= ampRel; this.airAmp *= airRel;
        }
        this.curLen += (this.targetLen - this.curLen) * glide;
        this.lpPole += (this.lpPoleT - this.lpPole) * pole;
        const sag = on ? 0 : 1 - this.amp;           // 息が尽きるにつれ少し下がって暗くなる
        this.scoop *= 0.99985;                      // 塩梅：下からすくい上げ
        const boreLen = this.curLen * (1 - vib * 0.004 + sag * 0.009 - this.scoop * 0.0578);
        if (this.unflipT > 0) this.unflipT -= 1 / sr;
        const jetLen = boreLen * (this.unflipT > 0 ? UNFLIP_JET : this.jetRatio);
        const lpPole = Math.min(0.92, this.lpPole + sag * 0.12);

        this.mur *= 0.99985; this.dip *= 0.9993;
        const turb = (Math.random() * 2 - 1) * (0.02 + this.noiseAmt * 0.045 + this.mur * 0.22);

        // --- waveguide: 息圧 → ジェット遅延 → 三次の非線形 → 管 → 損失 → 反射 ---
        const boreOut = this.rd(this.bore, this.bw, boreLen);
        this.lp = (1 - lpPole) * boreOut + lpPole * this.lp;
        let t = -this.lp;
        const y = t - this.dcx + 0.995 * this.dcy; this.dcx = t; this.dcy = y; t = y;
        const pd = this.breath * (1 + turb) - 0.5 * t;
        this.jet[this.jw] = pd; const jo = this.rd(this.jet, this.jw, jetLen); this.jw = (this.jw + 1) % N;
        let jt = jo * (jo * jo - 1); if (jt > 1) jt = 1; else if (jt < -1) jt = -1;
        this.bore[this.bw] = jt + 0.5 * t; this.bw = (this.bw + 1) % N;

        // --- 息の層（帯域を絞ったノイズ） ---
        const w2 = Math.random() * 2 - 1;
        this.nb1 += 0.35 * (w2 - this.nb1); this.nb2 += 0.04 * (this.nb1 - this.nb2);
        const air = (this.nb1 - this.nb2) * this.airAmp * (0.02 + this.noiseAmt * 0.11 + this.mur * 0.25);

        // --- 裏返り音は高く耳に刺さるので、音量と高域を抑える（竜笛のヒシギは抑えめ） ---
        const fm = this.jetRatio < 0.2 ? ((this.autoUnflipT > 0 && !this.userFlip) ? 0.2 : this.I.tame) : 0;
        this.flipMix += (fm - this.flipMix) * (fm > this.flipMix ? 0.0008 : 0.0015);
        let tone = boreOut * 0.22 * this.amp;
        this.flipLp += 0.22 * (tone - this.flipLp);
        tone = tone + (this.flipLp * 0.42 - tone) * this.flipMix;
        out[i] = tone + air;
      }
    }
  }

  // ------------------------------------------------------------------ post: EQ + reverb + limiter
  class Post {
    constructor(sr) {
      const s = sr / 44100;
      const mk = ls => ls.map(l => ({ b: new Float32Array(Math.round(l * s)), i: 0, f: 0 }));
      this.cL = mk([1116, 1188, 1277, 1356]); this.cR = mk([1139, 1211, 1300, 1379]);
      this.aL = mk([556, 441]); this.aR = mk([579, 464]);
      this.hp = 0; this.hpx = 0; this.lp = 0; this.wet = 0.4;
      this.hpA = Math.exp(-2 * Math.PI * 120 / sr); this.lpA = 1 - Math.exp(-2 * Math.PI * 5200 / sr);
    }
    comb(c, x) { const o = c.b[c.i]; c.f = o * 0.8 + c.f * 0.2; c.b[c.i] = x + c.f * 0.84; c.i = (c.i + 1) % c.b.length; return o; }
    ap(a, x) { const o = a.b[a.i]; a.b[a.i] = x + o * 0.5; a.i = (a.i + 1) % a.b.length; return o - x; }
    run(mono, L, R, off, len, volume) {
      const wet = this.wet, dry = 1 - wet * 0.35;
      for (let i = off; i < off + len; i++) {
        let x = mono[i];
        const h = this.hpA * (this.hp + x - this.hpx); this.hpx = x; this.hp = h; x = h;
        this.lp += this.lpA * (x - this.lp); x = this.lp;
        const inp = x * 0.03;
        let l = 0, r = 0;
        for (let k = 0; k < 4; k++) { l += this.comb(this.cL[k], inp); r += this.comb(this.cR[k], inp); }
        for (let k = 0; k < 2; k++) { l = this.ap(this.aL[k], l); r = this.ap(this.aR[k], r); }
        L[i] = Math.tanh((x * dry + l * wet * 1.6) * volume * 1.4);
        R[i] = Math.tanh((x * dry + r * wet * 1.6) * volume * 1.4);
      }
    }
  }

  // ------------------------------------------------------------------ phrases
  // ステップ:
  //  { note:"ro"|"ロ"|音のindex|Hz(>50), oct:0|1 (甲/責), dur:ms, accent:bool (裏返りから入る強い吹き込み),
  //    bend:開始時の曲げ(半音, 負=メリ), to:曲げの終点, glide:ms,
  //    flip:bool (このステップ中ずっと裏返す/ヒシギ), fall:半音(負), fallMs:ms,
  //    gap:ms (息を切って休む), yuri:0..1 (この音だけ揺りを上書き), enbai:false (竜笛の塩梅を切る) }
  //  { rest: ms }
  // gap も fall もない連続ステップはレガート（息を切らずに指だけ替える）になる。
  const PHRASES = {
    shakuhachi: {
      title: [
        { note: "chi", oct: 1, dur: 650, accent: true },
        { note: "re", oct: 1, dur: 110 }, { note: "tsu", oct: 1, dur: 110 },
        { note: "ro", oct: 1, dur: 1700, yuri: 0.75, fall: -5, fallMs: 900, gap: 1500 },
        { note: "ro", dur: 2500, bend: -1.8, to: 0, glide: 750, yuri: 0.75, fall: -1.2, fallMs: 1100, gap: 1300 },
        { note: "ro", oct: 1, dur: 270, accent: true, yuri: 0, fall: -4, fallMs: 550, gap: 1500 },
      ],
      confirm: [{ note: "ro", oct: 1, dur: 160, accent: true, fall: -3, fallMs: 420, gap: 900 }],
      cancel: [{ note: "ro", dur: 260, bend: -1.4, fall: -1.5, fallMs: 400, gap: 900 }],
      start: [
        { note: "ro", dur: 700, bend: -1.6, to: 0, glide: 500 },
        { note: "ro", oct: 1, dur: 900, accent: true, fall: -2, fallMs: 700, gap: 1200 },
      ],
      victory: [
        { note: "tsu", dur: 140 }, { note: "re", dur: 140 }, { note: "chi", dur: 140 }, { note: "ri", dur: 160 },
        { note: "ro", oct: 1, dur: 1600, accent: true, yuri: 0.7, fall: -1, fallMs: 900, gap: 1300 },
      ],
      defeat: [
        { note: "chi", oct: 1, dur: 600, fall: -6, fallMs: 1200, gap: 700 },
        { note: "ro", dur: 2200, bend: -0.6, to: -2, glide: 1800, yuri: 0.5, fall: -2, fallMs: 1200, gap: 1500 },
      ],
      danger: [
        { note: "ri", oct: 1, dur: 120, accent: true, gap: 90 },
        { note: "ri", oct: 1, dur: 120, accent: true, gap: 90 },
        { note: "chi", oct: 1, dur: 700, flip: true, fall: -3, fallMs: 600, gap: 900 },
      ],
      meditation: [
        { note: "ro", dur: 2600, bend: -1.6, to: 0, glide: 900, gap: 500 },
        { note: "tsu", dur: 1400 }, { note: "re", dur: 2200, gap: 450 },
        { note: "tsu", dur: 1800, bend: -1, gap: 350 },
        { note: "ro", dur: 2600, fall: -1, fallMs: 1200, gap: 1500 },
      ],
    },
    ryuteki: {
      hishigi: [{ note: "roku", dur: 1300, accent: true, flip: true }, { note: "roku", dur: 1500, gap: 1200 }],
      title: [
        { note: "roku", dur: 1300, accent: true, flip: true }, { note: "roku", dur: 1500, gap: 350 },
        { note: "jo", dur: 1300 }, { note: "go", dur: 2300, gap: 300 },
        { note: "jo", dur: 800 }, { note: "go", dur: 800 },
        { note: "roku", oct: 1, dur: 2400, fall: -0.8, fallMs: 900, gap: 1500 },
      ],
      gagaku: [
        { note: "jo", dur: 1300 }, { note: "go", dur: 2300, gap: 300 },
        { note: "jo", dur: 800 }, { note: "go", dur: 800 }, { note: "roku", oct: 1, dur: 2400, gap: 400 },
        { note: "shi", dur: 900 }, { note: "go", dur: 1300 }, { note: "jo", dur: 1500, gap: 350 },
        { note: "shaku", dur: 700 }, { note: "roku", dur: 3400, fall: -0.8, fallMs: 900, gap: 1500 },
      ],
      confirm: [{ note: "roku", oct: 1, dur: 200, accent: true, fall: -1.5, fallMs: 400, gap: 900 }],
      cancel: [{ note: "go", dur: 300, fall: -1, fallMs: 400, gap: 900 }],
    },
  };

  // ------------------------------------------------------------------ helpers
  function resolveHz(I, note) {
    if (typeof note === "number") return note > 50 ? note : I.notes[note].f;
    const n = I.notes.find(x => x.id === note || x.k === note);
    if (!n) throw new Error("unknown note for " + I.label + ": " + note + " (use " + I.notes.map(x => x.id).join("/") + ")");
    return n.f;
  }
  function getPhrase(instrument, phrase) {
    if (Array.isArray(phrase)) return phrase;
    const p = PHRASES[instrument] && PHRASES[instrument][phrase];
    if (!p) throw new Error("unknown phrase: " + instrument + "/" + phrase);
    return p;
  }
  // フレーズをサンプル時刻のイベント列にする。戻り値は「鳴り終わり」のサンプル時刻。
  function schedulePhrase(v, steps, t0) {
    const sr = v.sr, ms = x => Math.round(x * sr / 1000), baseYuri = v.params.yuri;
    let t = t0, tail = 0;
    steps.forEach((s, idx) => {
      if (s.rest != null) { v.at(t, () => v.noteOff()); t += ms(s.rest); return; }
      const hz = resolveHz(v.I, s.note), dur = s.dur || 500;
      v.at(t, () => {
        v.set({ yuri: s.yuri != null ? s.yuri : baseYuri });
        v.noteOn(hz, { oct: s.oct, accent: s.accent, bend: s.bend || 0, enbai: s.enbai });
        if (s.to != null && s.to !== (s.bend || 0)) v.glideTo(s.to, s.glide || dur * 0.4, "out");
        if (s.flip) v.flip(true);
      });
      t += ms(dur);
      const last = idx === steps.length - 1;
      v.at(t, () => {
        if (s.flip) v.flip(false);
        if (s.fall) v.fall(s.fall, s.fallMs || 600);
        else if (s.gap || last) v.noteOff();
      });
      if (s.gap) t += ms(s.gap);
      if (last) tail = s.gap ? 0 : ms(1200);
    });
    v.at(t, () => v.set({ yuri: baseYuri }));
    return t + tail;
  }

  // ------------------------------------------------------------------ offline render

function genLevel(si) {
  const st = STAGES[si], rnd = mulberry32(4242 + si * 1013), Wd = st.len;

  let x = 0, h = 14;

  const coinRow = (x0, n, y) => { for (let i = 0; i < n; i++) its.push({ k: 'coin', x: (x0 + i) * TS + 8, y: y }); };
  flat(14);
  props.push({ t: st.props[0], x: 6 * TS, y: h * TS });
  const endX = st.boss ? Wd - 48 : Wd - 18;
  let lastGap = false;
  while (x < endX) {
    let r = rnd(); const x0 = x;
    if (lastGap && r < 0.17) r = 0.9;
    lastGap = r < 0.17;
    if (r < 0.17) { // 谷
      const gl = 2 + Math.floor(rnd() * Math.min(3, 1 + si * 0.7));
      if (gl >= 3 && rnd() < 0.6) { const py = h - 3; for (let i = 1; i < gl - 1; i++) gr[py][x + i] = 2; }
      for (let i = 0; i < gl + 1; i++) its.push({ k: 'coin', x: (x0 + i) * TS + 4, y: h * TS - 40 - Math.sin(i / gl * Math.PI) * 20 });
      x += gl;
      if (rnd() < 0.25 + si * 0.08) ents.push([st.flyer, (x0 + gl / 2) * TS, (h - 5) * TS]);
      if (rnd() < 0.4) h = clamp(h + pick([-1, 1, 2, 1]), 10, 14);
      if (gl >= 4) h = Math.max(h, 13);
    } else if (r < 0.33) { // 段差
      h = clamp(h + pick([-2, -1, 1, 2, -2]), 10, 14); flat(4 + Math.floor(rnd() * 5));
      if (rnd() < 0.3) props.push({ t: pick(st.props), x: (x0 + 2) * TS, y: h * TS });
    } else if (r < 0.5) { // 足場
      const n = 10 + Math.floor(rnd() * 6), sx = x; flat(n);
      const py = h - 4, pw = 3 + Math.floor(rnd() * 3), ppx = sx + 2 + Math.floor(rnd() * Math.max(1, n - pw - 4));

const PH_HISHIGI = [

// ボス戦は息を強く・ノイズ多め・音量大きめで、竜笛を荒々しく鳴らす
function bossFlute(on) {
  if (!wfR) return;
  wfR.set(on ? { volume: 0.6, breath: 0.5, noise: 0.42, mura: 0.5, reverb: 0.32 } : { volume: 0.42, breath: 0.45, noise: 0.35, mura: 0.4, reverb: 0.38 });

const arenaL = e => camMin + 16 + e.w / 2, arenaR = e => LV.w * TS - 16 - e.w / 2;
const GROUND_Y = 14 * TS;
function bossShot(k, x, y, vx, vy, o) { projs.push(Object.assign({ k, x, y, vx, vy, own: 'e', life: 180, r: 0 }, o || {})); }

function updBoss(e, dx, adx) {
  const d = BOSSDEF[e.bt];
  if (e.st === 'sleep') {
    if (P.x > LV.arenaX + 30 && state === 'play') {
      e.st = 'intro'; e.tm = 150; e.active = true;
      const gx = Math.floor(LV.arenaX / TS) - 2;

    }

  }
  if (e.st === 'dying') {
    e.vx = 0; e.tm = (e.tm || 0) + 1; e.hidden = false; e.tlen = 0;
    if (d.fly) e.y = Math.min(e.y + 1.5, GROUND_Y);

      if (STAGES[stageIdx].final) state = 'ending';

  }

    if (--e.tm <= 0) { e.st = 'idle'; e.tm = 40; bgmStart('boss'); }

  e.x = clamp(e.x, lo, hi); e.atEdge = e.x <= lo + 0.5 || e.x >= hi - 0.5;

}

function updProjs() {

      p.r += 0.6;
      if (solidAt(Math.floor(p.x / TS), Math.floor(p.y / TS))) { p.dead = true; sparks(p.x, p.y, 4, '#ddd'); sfx('clank'); continue; }
      for (const e of enemies) if (e.active && !e.dead && overlap(rectC(p.x, p.y, 6, 6), boxOf(e))) { if (damageEnemy(e, 1, Math.sign(p.vx))) { p.dead = true; break; } }
    } else {
      if (p.k === 'arrow') p.vy += 0.035;
      if (p.k === 'fan') p.r += 0.3;
      if (p.k === 'rock' || p.k === 'pebble') { p.vy = Math.min(p.vy + 0.15, 7); p.r += 0.1; }
      if (p.k === 'bubble') p.vy = Math.min(p.vy + 0.1, 4);
      if (p.k === 'wave' || p.k === 'tornado') {
        if (solidAt(Math.floor((p.x + Math.sign(p.vx) * 6) / TS), Math.floor((p.y - 4) / TS)) || !solidAt(Math.floor(p.x / TS), Math.floor((p.y + 2) / TS))) p.dead = true;
        if (p.k === 'wave' && frame % 3 === 0) addP({ x: p.x, y: p.y - 2, vx: -p.vx * 0.2, vy: -1 - Math.random(), g: 0.08, life: 18, c: '#ffb040', s: 2 });
        if (p.k === 'tornado' && frame % 2 === 0) addP({ x: p.x + (Math.random() - 0.5) * 14, y: p.y - Math.random() * 34, vx: (Math.random() - 0.5) * 2, vy: -0.5, life: 14, c: '#e8f0e0', s: 1 });
        const ht = p.k === 'tornado' ? 34 : 14;
        if (!p.dead && overlap(boxOf(P), [p.x - 7, p.y - ht, p.x + 7, p.y])) hurtPlayer(1, p.x - p.vx);
      } else {
        if (solidAt(Math.floor(p.x / TS), Math.floor(p.y / TS))) {

function update() {
  frame++;
  if (pressed.mute) { muted = !muted; if (master) master.gain.value = muted ? 0 : 0.9; }
  switch (state) {
    case 'boot':
      if (pressed.any && imgPending <= 0) { audioInit(); state = 'title'; timer = 0; titleMusic(); }
      break;
    case 'title':
      timer++;
      if (timer > 20 && pressed.any) { sfx('confirm'); stopJingle(); startGame(); }
      break;
    case 'intro':
      timer++; if (timer > 170 || (timer > 40 && pressed.start)) { state = 'play'; bgmStart('stage'); }
      break;
    case 'play': case 'clear': case 'ending':
      if (pressed.pause && state === 'play') { paused = !paused; sfx('pause'); if (wfR) wfR.stop(); }
      if (paused) break;
      timer++;
      if (hintT > 0) hintT--;
      ambient();
      updatePlayer();
      for (const e of enemies) updEnemy(e);
      enemies = enemies.filter(e => !e.dead || e.k === 'boss');
      updProjs(); updItems(); updParts();
      if (state === 'play' && LV.goalX && P.x > LV.goalX && !P.dead) {
        state = 'clear'; timer = 0; P.auto = true; bgmStop(); jingle('victory'); score += P.hp * 200;
        for (let i = 0; i < 20; i++) addP({ x: LV.goalX + (Math.random() - 0.5) * 40, y: 14 * TS - 50 - Math.random() * 20, vx: (Math.random() - 0.5) * 2, vy: -Math.random() * 2, g: 0.05, life: 60, c: '#ffe070', s: 2 });
      }

      if (state === 'ending' && timer > 120 && (pressed.start || pressed.jump)) { state = 'title'; timer = 0; camX = 0; parts = []; stopJingle(); bgmStop(); titleMusic(); }
      // カメラ
      {
        const tx = P.x - W * 0.42 + P.face * 24;
        camX += (tx - camX) * 0.1;
        camX = clamp(camX, camMin, LV.w * TS - W);
        if (shake > 0) shake *= 0.85, shake < 0.3 && (shake = 0);

      timer++;
      if (timer > 90 && (pressed.start || pressed.jump)) { lives = 3; score = 0; stopJingle(); startStage(); }
      break;

}

  else { ell(x - f * 16, y - 7, 12, 7, OUT); ell(x - f * 16, y - 7, 11, 6, C('#4e5e28')); }
  // 胴体
  ell(x, y - 17 * sy, 27 * sx, 17 * sy, OUT); ell(x, y - 17 * sy, 26 * sx, 16 * sy, C('#6a7a3a'));
  ell(x + f * 8, y - 9 * sy, 16 * sx, 8 * sy, C('#d8cc9a'));
  for (let i = 0; i < 10; i++) { const hx = (hash(i, 3) - 0.5) * 36 * sx, hy = -12 - hash(i, 5) * 18; if (hx * f < 6) R(x + hx, y + hy * sy, 2, 2, C('#3e4e1e')); }
  ell(x - f * 6, y - 26 * sy, 14 * sx, 4 * sy, C('#7c8c46'));
  // 前脚
  pline(x + f * 16, y - 10, x + f * 20, y, 5, OUT); pline(x + f * 16, y - 10, x + f * 20, y, 3, C('#4e5e28')); R(x + f * 20 - 3, y - 2, 6, 2, C('#3e4e1e'));
  // 目
  const ex = x + f * 12, ey = y - 30 * sy;
  pcirc(ex, ey, 6, OUT); pcirc(ex, ey, 5, C('#6a7a3a')); pcirc(ex + f, ey - 1, 3.5, fl ? '#fff' : '#f0c020'); R(ex + f, ey - 3, 1, 5, '#111');
  // 口
  pline(x + f * 26 * sx, y - 15 * sy, x + f * 6, y - 13 * sy, 1, '#2a1a10');
  // 舌
  if (e.tlen > 0) {
    const mx = x + f * 24, my = y - 14;
    pline(mx, my, mx + f * e.tlen, my, 5, OUT); pline(mx, my, mx + f * e.tlen, my, 3, '#e05a7a');
    pcirc(mx + f * e.tlen, my, 4, OUT); pcirc(mx + f * e.tlen, my, 3, '#f07a9a');
  }
  if (e.st === 'spit' && e.tm > 26) R(x + f * 22, y - 18, 4, 3, '#a05ad0');
}
function drawEnemy(e) {
  const x = e.x - camX;
  if (x < -60 || x > W + 60) return;
  const fl = e.flash > 0 && (e.flash >> 1) % 2 === 0;
  if (e.k === 'onibi') {
    const sx = Math.round(x), sy = Math.round(e.y - 6), f = Math.sin(e.t * 0.3);
    glow(sx, sy, 18, 'rgba(90,180,255,0.35)');
    pcirc(sx, sy, 6, OUT); pcirc(sx, sy, 5, fl ? '#fff' : '#3a8ad8'); pcirc(sx, sy + 1, 3.5, '#9ad8ff');
    for (let i = -1; i <= 1; i++) pline(sx + i * 3, sy - 3, sx + i * 3 + f * 2, sy - 9 - (i === 0 ? 3 : 0), 2, '#8ad0ff');
    R(sx - 2 + e.face, sy, 1, 2, '#0a1a3a'); R(sx + 1 + e.face, sy, 1, 2, '#0a1a3a');
    return;
  }
  if (e.k === 'crow') {
    const sx = Math.round(x), sy = Math.round(e.y - 4), wf = Math.sin(e.t * 0.35) * 5;
    pline(sx - 5, sy, sx + 5, sy, 4, OUT); pline(sx - 4, sy, sx + 4, sy, 3, fl ? '#fff' : '#1a1a24');
    pline(sx - 1, sy, sx - 7, sy - wf, 2, '#14141c'); pline(sx + 1, sy, sx + 7, sy - wf, 2, '#14141c');
    R(sx + e.face * 5, sy - 1, 2, 1, '#e0b030'); R(sx + e.face * 3, sy - 2, 1, 1, '#ff4040');
    return;
  }
  const look = LOOK[e.k], s = 1;
  if (e.k === 'ronin' && e.st === 'wind' && (e.tm >> 2) % 2 === 0) glow(x + e.face * 6, e.y - 12, 10, 'rgba(255,255,255,0.5)');
  if (e.k === 'boss') {
    if (e.st === 'gone' || e.hidden) return;
    const d = BOSSDEF[e.bt];
    if (e.st !== 'sleep') glow(x, e.y - e.h / 2, 50, 'rgba(255,40,40,' + (0.12 + 0.06 * Math.sin(frame * 0.1)) + ')');
    if (e.bt === 'gama') { drawGama(e, fl); return; }
    if (e.bt === 'tengu') drawWings(x, e.y - 21 * d.s, e.face, e.t, d.s, e.st === 'sleep' ? 0.05 : e.st === 'dive' ? 0.1 : 0.28);
    drawFigure(e.x, e.y, e.face, bossPose(e), LOOK[e.bt === 'shogun' ? 'boss' : e.bt], d.s, fl);
    return;
  }
  drawFigure(e.x, e.y, e.face, enemyPose(e), look, s, fl);
}
function drawPlayer() {
  const p = P;
  if (p.inv > 0 && !p.dead && (p.inv >> 2) % 2 === 0 && state === 'play') return;
  let pose;
  if (p.dead) pose = Object.assign({}, POSE_HURT, { rot: p.rot });
  else if (p.hurtT > 0) pose = Object.assign({}, POSE_HURT);
  else if (p.atk > 0) pose = poseSlash(1 - p.atk / 16, !p.onGround);
  else if (!p.onGround) pose = Object.assign({}, p.spin ? Object.assign({}, POSE_JUMP, { tF: 1.6, sF: -0.8, tB: 1.2, sB: -1.2, aF: 1.2, fF: 2.2, aB: 1.0, fB: 2 }) : (p.vy < 0 ? POSE_JUMP : POSE_FALL), { rot: p.rot });
  else if (Math.abs(p.vx) > 0.2) pose = poseRun(p.anim, Math.min(1, Math.abs(p.vx) / 2.3));
  else pose = poseIdle(frame);
  if (p.throwT > 0 && p.atk <= 0) Object.assign(pose, { aF: 1.6, fF: 1.6, aB: -0.6, fB: 0 });
  glow(Math.round(p.x - camX), Math.round(p.y - 13), 24, 'rgba(255,236,210,0.16)');
  drawScarf(p);
  drawFigure(p.x, p.y, p.face, pose, LOOK.ninja, 1, false);
}
function heart(x, y, on) {
  const c = on ? '#e0303c' : '#3a2a30', hl = on ? '#ff9aa0' : '#4a3a40';
  R(x + 1, y, 3, 1, OUT); R(x + 5, y, 3, 1, OUT); R(x, y + 1, 9, 4, OUT); R(x + 1, y + 5, 7, 1, OUT); R(x + 2, y + 6, 5, 1, OUT); R(x + 3, y + 7, 3, 1, OUT);
  R(x + 1, y + 1, 3, 4, c); R(x + 5, y + 1, 3, 4, c); R(x + 4, y + 2, 1, 3, c); R(x + 2, y + 5, 5, 1, c); R(x + 3, y + 6, 3, 1, c); R(x + 2, y + 2, 1, 1, hl);
}
function drawHUD() {
  g.fillStyle = 'rgba(0,0,0,0.35)'; g.fillRect(0, 0, W, 22);
  for (let i = 0; i < 5; i++) heart(6 + i * 11, 7, i < P.hp);
  // 残機
  R(66, 6, 10, 10, OUT); R(67, 7, 8, 8, '#2b3256'); R(69, 10, 5, 2, '#efbd92'); R(72, 10, 1, 1, '#fff');
  txt('×' + Math.max(0, lives), 79, 4, 12, '#fff');
  txt('得点 ' + String(score).padStart(6, '0'), W - 6, 4, 12, '#ffe8a0', 'right');
  txt(STAGES[stageIdx].num + '　' + STAGES[stageIdx].name, W / 2, 4, 12, '#f0e6d0', 'center');
  if (hintT > 0) {
    g.globalAlpha = Math.min(1, hintT / 60);
    g.fillStyle = 'rgba(0,0,0,0.55)'; g.fillRect(70, 30, W - 140, 20);
    txt('←→ 移動　Z 跳躍(二段)　X 斬撃　C 手裏剣', W / 2, 33, 12, '#fff', 'center');
    g.globalAlpha = 1;
  }
  if (boss && boss.st === 'intro') {
    const a = Math.min(1, (150 - boss.tm) / 30) * Math.min(1, boss.tm / 20);
    g.globalAlpha = a; g.fillStyle = 'rgba(60,0,0,0.6)'; g.fillRect(0, 96, W, 64);
    txt('― 推参 ―', W / 2, 102, 12, '#ffb0a0', 'center');
    txt(BOSSDEF[boss.bt].name, W / 2, 120, 24, '#ffffff', 'center', '#8a1a20');
    g.globalAlpha = 1;
  }
  if (boss && boss.active && boss.st !== 'sleep' && boss.st !== 'gone') {
    const bw = 200, bx = (W - bw) / 2, by = H - 16;
    txt(BOSSDEF[boss.bt].name, W / 2, by - 15, 12, '#ffd0c0', 'center');
    R(bx - 2, by - 2, bw + 4, 8, OUT); R(bx, by, bw, 4, '#3a1010'); R(bx, by, Math.round(bw * Math.max(0, boss.hp) / boss.maxhp), 4, '#e03a2a'); R(bx, by, Math.round(bw * Math.max(0, boss.hp) / boss.maxhp), 1, '#ff9a80');
  }
}
function vignette() {
  const gr = g.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 0.95);
  gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,0.45)');
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
}
function drawWorld() {
  const st = STAGES[stageIdx];
  const sx = shake ? Math.round((Math.random() - 0.5) * shake) : 0, sy = shake ? Math.round((Math.random() - 0.5) * shake) : 0;
  g.save(); g.translate(sx, sy);
  drawBg(st.bg, 0.2);
  drawMidLayer(st);
  for (const pr of LV.props) drawProp(pr);
  drawTiles();
  for (const it of items) drawItem(it);
  for (const e of enemies) drawEnemy(e);
  drawPlayer();
  for (const p of projs) drawProj(p);
  drawParts();
  drawFg(st);
  g.restore();
  vignette();
}
function stamp(x, y, s) { // 落款風の赤い印
  R(x, y, 26, 26, '#b81e24'); R(x + 2, y + 2, 22, 22, '#d23a32');
  txt(s, x + 13, y + 4, 16, '#f6e8d8', 'center', false);
}
function drawTitle() {
  const im = IMG.bg_title;
  if (im) g.drawImage(im, Math.round((W - im.width) / 2), 0); else { g.fillStyle = '#101028'; g.fillRect(0, 0, W, H); }
  const gr = g.createLinearGradient(0, 120, 0, H); gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,10,0.8)'); g.fillStyle = gr; g.fillRect(0, 0, W, H);
  // 花びら
  if (Math.random() < 0.15) addP({ x: camX + W + 10, y: Math.random() * H * 0.7, vx: -0.6 - Math.random() * 0.6, vy: 0.3 + Math.random() * 0.3, life: 700, k: 'leaf', c: Math.random() < 0.5 ? '#f4b4cc' : '#fbd6e3' });
  updParts(); drawParts();
  const t = timer;
  txt('忍', 330, 30, 64, '#f6efe0', 'center', '#8a1a20');
  txt('風伝', 395, 46, 40, '#f6efe0', 'center', '#8a1a20');
  txt('S H I N O B I   F U D E N', 370, 104, 10, '#d8c8a8', 'center');
  stamp(430, 126, '影');
  // 歩く忍者（コード描画のキャラを見せる）
  const wx = ((t * 0.9) % (W + 80)) - 40;
  const saveCam = camX; camX = 0;
  const fake = { face: 1, scarf: titleScarf };
  updScarf(fake, wx - 2, H - 34 - 21);
  drawScarf(fake);
  drawFigure(wx, H - 34, 1, poseRun(t * 0.13, 0.45), LOOK.ninja, 1, false);
  camX = saveCam;
  R(0, H - 34, W, 1, 'rgba(255,255,255,0.15)');
  if ((t >> 5) % 2 === 0) txt('Enter / タップ で 出陣', W / 2, H - 26, 14, '#ffffff', 'center');
  txt('M:音 消/出　P:一時停止', W - 6, H - 12, 10, '#a0a0b0', 'right');
}
const titleScarf = Array.from({ length: 8 }, () => ({ x: 0, y: 200, px: 0, py: 200 }));
function drawIntro() {
  const st = STAGES[stageIdx];
  g.fillStyle = '#05040a'; g.fillRect(0, 0, W, H);
  const a = Math.min(1, timer / 40) * (timer > 140 ? Math.max(0, 1 - (timer - 140) / 30) : 1);
  g.globalAlpha = a * 0.5; const im = IMG[st.bg]; if (im) g.drawImage(im, Math.round((W - im.width) / 2), 0); g.globalAlpha = 1;
  g.fillStyle = 'rgba(0,0,0,0.5)'; g.fillRect(0, 86, W, 96);
  g.globalAlpha = a;
  txt(st.num, W / 2, 96, 16, '#d8b070', 'center');
  txt(st.name, W / 2, 116, 36, '#ffffff', 'center', '#8a1a20');
  txt(st.sub, W / 2, 160, 12, '#c0b8a8', 'center');
  g.globalAlpha = 1;
}
function drawOverlayMsg(big, small, col) {
  g.fillStyle = 'rgba(0,0,0,0.55)'; g.fillRect(0, 90, W, 90);
  txt(big, W / 2, 100, 36, col || '#fff', 'center', '#000');
  if (small) txt(small, W / 2, 150, 12, '#e0d8c8', 'center');
}
function render() {
  g.setTransform(1, 0, 0, 1, 0, 0);
  if (state === 'boot') {
    g.fillStyle = '#05040a'; g.fillRect(0, 0, W, H);
    txt('忍風伝', W / 2, 92, 32, '#f6efe0', 'center', '#8a1a20');
    txt(imgPending > 0 ? '読み込み中…' : 'クリック / キー で はじめる', W / 2, 150, 14, '#ffffff', 'center');
    txt('（音が出ます）', W / 2, 172, 10, '#a0a0b0', 'center');
    return;
  }
  if (state === 'title') { drawTitle(); return; }
  if (state === 'intro') { drawIntro(); return; }
  drawWorld(); drawHUD();
  if (paused) drawOverlayMsg('一時停止', 'P / Esc で再開');
  if (state === 'clear' && timer > 30) drawOverlayMsg('見事！', STAGES[stageIdx].name + ' 突破　残り体力ボーナス +' + P.hp * 200, '#ffe8a0');
  if (state === 'gameover') { g.fillStyle = 'rgba(40,0,0,' + Math.min(0.6, timer / 100) + ')'; g.fillRect(0, 0, W, H); if (timer > 40) drawOverlayMsg('無念……', timer > 90 ? 'Enter で この幕から やり直す' : '', '#ff8080'); }
  if (state === 'ending') {
    const a = Math.min(1, timer / 90);
    g.fillStyle = 'rgba(0,0,0,' + a * 0.6 + ')'; g.fillRect(0, 0, W, H);
    g.globalAlpha = a;
    txt('天下泰平', W / 2, 70, 40, '#ffe8a0', 'center', '#8a1a20');
    txt('五つの強敵を討ち、天下に静けさが戻った。', W / 2, 130, 12, '#fff', 'center');
    txt('最終得点　' + score, W / 2, 156, 16, '#fff', 'center');
    if (timer > 120 && (timer >> 5) % 2 === 0) txt('Enter で タイトルへ', W / 2, 200, 12, '#d0d0e0', 'center');
    g.globalAlpha = 1;
  }
}

// =====================================================================
//  MAIN LOOP（固定 60fps ステップ）
// =====================================================================
let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  const step = 1000 / 60;
  while (acc >= step) { update(); acc -= step; }
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
