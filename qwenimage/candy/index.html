<script>
/* fm-synth skill: fm-worklet.js */
// 4-operator FM synthesizer (YM2612-style algorithms) running in an AudioWorklet.
// Messages:
//   {type:'note', t, patch, freq, vel, dur, pan, sweep}  t = AudioContext time (sec)
//   {type:'patches', patches:{name:patch}}
//   {type:'stop'}   release all voices
// Patch: {alg:0-7, fb:0-7, vol, lfo:{rate,depth}, ops:[{mul,dt,lvl,ar,dr,sl,rr}, x4]}
//   lvl: carrier = amplitude, modulator = modulation index (radians / PI)
//   ar/dr/rr in seconds, sl 0..1

// Wrapped in a function so the page can load it via <script> and hand its source
// to audioWorklet.addModule() as a Blob URL (works from file:// too).
function fmWorkletMain() {
  const TWO_PI = Math.PI * 2;

  // Carriers per algorithm (op indices)
  const CARRIERS = [[3], [3], [3], [3], [1, 3], [1, 2, 3], [1, 2, 3], [0, 1, 2, 3]];

  class Op {
    constructor() { this.phase = 0; this.env = 0; this.stage = 4; this.out = 0; }
  }

  class Voice {
    constructor() {
      this.ops = [new Op(), new Op(), new Op(), new Op()];
      this.active = false; this.patch = null; this.fb1 = 0; this.fb2 = 0;
      this.freq = 440; this.age = 0; this.offAt = 0; this.released = false;
    }
  }

  class FMProcessor extends AudioWorkletProcessor {
    constructor(options) {
      super();
      const n = (options.processorOptions && options.processorOptions.voices) || 12;
      this.voices = []; for (let i = 0; i < n; i++) this.voices.push(new Voice());
      this.patches = {};
      this.queue = [];
      this.frame = 0;
      this.lfoPhase = 0;
      this.port.onmessage = (e) => {
        const m = e.data;
        if (m.type === 'patches') Object.assign(this.patches, m.patches);
        else if (m.type === 'note') this.insertEvent(m);
        else if (m.type === 'stop') { this.queue.length = 0; for (const v of this.voices) this.release(v); }
        else if (m.type === 'hush') { this.queue.length = 0; for (const v of this.voices) v.active = false; }
      };
    }

    insertEvent(m) {
      m.f = Math.max(0, Math.round(m.t * sampleRate));
      const q = this.queue; let i = q.length;
      while (i > 0 && q[i - 1].f > m.f) i--;
      q.splice(i, 0, m);
    }

    allocVoice() {
      let best = null, bestScore = -1;
      for (const v of this.voices) {
        if (!v.active) return v;
        const score = (v.released ? 1e9 : 0) + v.age;
        if (score > bestScore) { bestScore = score; best = v; }
      }
      return best;
    }

    start(m) {
      const p = this.patches[m.patch]; if (!p) return;
      const v = this.allocVoice();
      v.active = true; v.released = false; v.patch = p; v.age = 0;
      v.freq = m.freq; v.vel = m.vel == null ? 1 : m.vel;
      v.offAt = this.frame + Math.max(1, Math.round((m.dur || 0.1) * sampleRate));
      v.pan = m.pan || 0;
      v.gl = v.pan <= 0 ? 1 : 1 - v.pan; v.gr = v.pan >= 0 ? 1 : 1 + v.pan;
      // pitch sweep: exponential glide to freq*sweep over dur
      v.sweepMul = m.sweep ? Math.pow(m.sweep, 1 / Math.max(1, v.offAt - this.frame)) : 1;
      v.fb1 = v.fb2 = 0;
      for (let i = 0; i < 4; i++) {
        const o = v.ops[i], op = p.ops[i];
        o.stage = 0; o.phase = p.resetPhase === false ? o.phase : 0;
        o.ar = Math.max(1, op.ar * sampleRate); o.dr = Math.max(1, op.dr * sampleRate);
        o.rr = Math.max(1, op.rr * sampleRate);
        o.decayK = Math.exp(Math.log(0.001) / o.dr);
        o.relK = Math.exp(Math.log(0.0005) / o.rr);
        o.out = 0;
      }
    }

    release(v) {
      if (!v.active || v.released) return;
      v.released = true;
      for (const o of v.ops) o.stage = 3;
    }

    process(inputs, outputs) {
      const out = outputs[0]; const L = out[0]; const R = out[1] || out[0];
      const len = L.length;
      const voices = this.voices;
      this.frame = currentFrame; // sync with AudioContext.currentTime
      for (let s = 0; s < len; s++) {
        // events
        while (this.queue.length && this.queue[0].f <= this.frame) this.start(this.queue.shift());
        this.lfoPhase += TWO_PI * 5.5 / sampleRate;
        if (this.lfoPhase > TWO_PI) this.lfoPhase -= TWO_PI;
        const lfo = Math.sin(this.lfoPhase);
        let sl = 0, sr = 0;
        for (let vi = 0; vi < voices.length; vi++) {
          const v = voices[vi];
          if (!v.active) continue;
          if (!v.released && this.frame >= v.offAt) this.release(v);
          v.age++;
          const p = v.patch; const ops = v.ops; const pops = p.ops;
          v.freq *= v.sweepMul;
          const vib = p.vib ? 1 + lfo * p.vib * Math.min(1, v.age / (sampleRate * 0.25)) : 1;
          const baseInc = TWO_PI * v.freq * vib / sampleRate;
          let alive = false;
          // envelopes & phases
          for (let i = 0; i < 4; i++) {
            const o = ops[i], po = pops[i];
            switch (o.stage) {
              case 0: o.env += 1 / o.ar; if (o.env >= 1) { o.env = 1; o.stage = 1; } break;
              case 1: o.env = po.sl + (o.env - po.sl) * o.decayK; if (o.env - po.sl < 0.0005) { o.env = po.sl; o.stage = 2; } break;
              case 2: break;
              case 3: o.env *= o.relK; if (o.env < 0.0003) { o.env = 0; o.stage = 4; } break;
            }
            if (o.stage !== 4) alive = true;
            o.phase += baseInc * po.mul * (1 + (po.dt || 0));
            if (o.phase > 1e6) o.phase -= TWO_PI * Math.floor(o.phase / TWO_PI);
          }
          if (!alive) { v.active = false; continue; }
          const e0 = ops[0].env * pops[0].lvl * Math.PI, e1 = ops[1].env * pops[1].lvl * Math.PI,
                e2 = ops[2].env * pops[2].lvl * Math.PI, e3 = ops[3].env * pops[3].lvl;
          // op1 with self feedback
          const fbAmt = p.fb ? Math.pow(2, p.fb - 8) * Math.PI * 2 : 0;
          const o1 = Math.sin(ops[0].phase + (v.fb1 + v.fb2) * 0.5 * fbAmt);
          v.fb2 = v.fb1; v.fb1 = o1;
          const m1 = o1 * e0;
          let o2, o3, o4, outv;
          const c1 = pops[1].lvl * ops[1].env, c2 = pops[2].lvl * ops[2].env;
          switch (p.alg) {
            case 0: o2 = Math.sin(ops[1].phase + m1) * e1; o3 = Math.sin(ops[2].phase + o2) * e2; outv = Math.sin(ops[3].phase + o3) * e3; break;
            case 1: o2 = Math.sin(ops[1].phase) * e1; o3 = Math.sin(ops[2].phase + m1 + o2) * e2; outv = Math.sin(ops[3].phase + o3) * e3; break;
            case 2: o2 = Math.sin(ops[1].phase) * e1; o3 = Math.sin(ops[2].phase + o2) * e2; outv = Math.sin(ops[3].phase + m1 + o3) * e3; break;
            case 3: o2 = Math.sin(ops[1].phase + m1) * e1; o3 = Math.sin(ops[2].phase) * e2; outv = Math.sin(ops[3].phase + o2 + o3) * e3; break;
            case 4: o2 = Math.sin(ops[1].phase + m1) * c1; o3 = Math.sin(ops[2].phase) * e2; outv = o2 + Math.sin(ops[3].phase + o3) * e3; break;
            case 5: o2 = Math.sin(ops[1].phase + m1) * c1; o3 = Math.sin(ops[2].phase + m1) * c2; outv = o2 + o3 + Math.sin(ops[3].phase + m1) * e3; break;
            case 6: o2 = Math.sin(ops[1].phase + m1) * c1; o3 = Math.sin(ops[2].phase) * c2; outv = o2 + o3 + Math.sin(ops[3].phase) * e3; break;
            default: o2 = Math.sin(ops[1].phase) * c1; o3 = Math.sin(ops[2].phase) * c2; outv = o1 * pops[0].lvl * ops[0].env + o2 + o3 + Math.sin(ops[3].phase) * e3; break;
          }
          const a = outv * v.vel * (p.vol || 0.3);
          sl += a * v.gl; sr += a * v.gr;
        }
        // soft clip
        L[s] = sl / (1 + Math.abs(sl)); R[s] = sr / (1 + Math.abs(sr));
        this.frame++;
      }
      return true;
    }
  }

  registerProcessor('fm-synth', FMProcessor);
}
if (typeof registerProcessor === 'function') fmWorkletMain();

</script>
<script>

(function () {

  const OFF = op(1, 0, 0.01, 0.01, 0, 0.01);

      op(5.41, 2, 0.001, 0.2, 0.5, 0.1), op(1, 1, 0.001, 0.035, 0, 0.02)] },
    ohat: { alg: 0, fb: 8, vol: 0.14, ops: [
      op(1, 1, 0.001, 0.2, 0.5, 0.1), op(3.17, 2, 0.001, 0.2, 0.5, 0.1),
      op(5.41, 2, 0.001, 0.2, 0.5, 0.1), op(1, 1, 0.001, 0.25, 0, 0.1)] },
    tom: { alg: 7, fb: 5, vol: 0.6, ops: [
      op(1, 0.1, 0.001, 0.02, 0, 0.01), OFF, OFF, op(1, 1, 0.001, 0.3, 0, 0.08)] },
    // --- SFX building blocks ---
    zap: { alg: 4, fb: 3, vol: 0.18, ops: [
      op(2, 0.6, 0.001, 0.06, 0, 0.02), op(1, 0.8, 0.001, 0.08, 0, 0.02),
      op(3, 0.4, 0.001, 0.05, 0, 0.02), op(1, 0.4, 0.001, 0.07, 0, 0.02)] },
    blip: { alg: 4, fb: 0, vol: 0.12, ops: [
      op(1.5, 1.2, 0.001, 0.1, 0, 0.03), op(1, 0.8, 0.001, 0.12, 0, 0.03), OFF, OFF] },
    boom: { alg: 0, fb: 9, vol: 0.85, ops: [
      op(1, 1.5, 0.001, 0.7, 0, 0.3), op(0.5, 1.5, 0.001, 0.7, 0, 0.3),
      op(1, 1.2, 0.001, 0.6, 0, 0.3), op(1, 1, 0.001, 0.6, 0, 0.3)] },
    bigboom: { alg: 0, fb: 9, vol: 1.0, ops: [
      op(1, 2, 0.001, 1.6, 0, 0.6), op(0.5, 2, 0.001, 1.5, 0, 0.6),
      op(1, 1.5, 0.001, 1.4, 0, 0.6), op(1, 1, 0.005, 1.8, 0, 0.8)] },
    clank: { alg: 2, fb: 4, vol: 0.3, ops: [
      op(1, 0.8, 0.001, 0.1, 0, 0.05), op(4.7, 1.4, 0.001, 0.12, 0, 0.05),
      op(2.3, 1.2, 0.001, 0.1, 0, 0.05), op(1, 0.9, 0.001, 0.12, 0, 0.05)] },
    whistle: { alg: 4, fb: 8, vol: 0.18, vib: 0.012, ops: [
      op(1, 0.08, 0.05, 0.5, 0.8, 0.2), op(1, 0.6, 0.06, 0.8, 0.9, 0.25),
      op(2, 0.1, 0.06, 0.5, 0.5, 0.2), op(1.5, 0.35, 0.06, 0.8, 0.9, 0.25)] },
    siren: { alg: 4, fb: 6, vol: 0.2, ops: [
      op(1, 1.1, 0.01, 0.3, 0.9, 0.05), op(1, 0.8, 0.01, 0.3, 0.9, 0.05),
      op(2, 0.5, 0.01, 0.3, 0.9, 0.05), op(1, 0.5, 0.01, 0.3, 0.9, 0.05, 0.01)] },
    noise: { alg: 7, fb: 9, vol: 0.3, ops: [op(1, 0.6, 0.02, 0.5, 0, 0.2), OFF, OFF, OFF] },
  };

  // ---- pitch / notation helpers --------------------------------------------
  const NOTE_IDX = { c: 0, d: 2, e: 4, f: 5, g: 7, a: 9, b: 11 };
  function noteToMidi(n) {
    if (typeof n === 'number') return n;
    const m = /^([a-gA-G])([#b]?)(-?\d)$/.exec(n);
    if (!m) throw new Error('bad note ' + n);
    let v = NOTE_IDX[m[1].toLowerCase()] + (Number(m[3]) * 12 + 12);
    if (m[2] === '#') v++; else if (m[2] === 'b') v--;
    return v;
  }
  const mtof = (m) => 440 * Math.pow(2, (noteToMidi(m) - 69) / 12);

  // "D5 - - . A4 -": one token per step; '-' extends the previous note, '.' is a rest
  function parseLine(str, stepOffset = 0) {
    const ev = []; let cur = null; let step = stepOffset;
    for (const tok of str.trim().split(/\s+/)) {
      if (tok === '-') { if (cur) cur.len++; }
      else if (tok === '.') cur = null;
      else { cur = { step, len: 1, midi: noteToMidi(tok) }; ev.push(cur); }
      step++;
    }
    return { ev, steps: step - stepOffset };
  }
  // Array of bar strings -> events. Warns when a bar has the wrong number of steps.
  function parseBars(bars, stepsPerBar = 16, stepOffset = 0) {
    const ev = []; let step = stepOffset;
    bars.forEach((b, i) => {
      const r = parseLine(b, step);
      if (stepsPerBar && r.steps !== stepsPerBar) console.warn(`FM.parseBars: bar ${i + 1} has ${r.steps} steps (expected ${stepsPerBar}): ${b}`);
      ev.push(...r.ev); step += r.steps;
    });
    return ev;
  }

  // Chord symbols: C, Cm, C7, Cm7, Cmaj7, Cdim, Caug, Csus4, Cadd9, with # / b roots
  const QUALITY = { '': [0, 4, 7], m: [0, 3, 7], '7': [0, 4, 7, 10], m7: [0, 3, 7, 10], maj7: [0, 4, 7, 11],
    dim: [0, 3, 6], aug: [0, 4, 8], sus4: [0, 5, 7], sus2: [0, 2, 7], add9: [0, 4, 7, 14], m7b5: [0, 3, 6, 10] };
  function chord(sym, low = 60, high = 72) {
    const m = /^([A-G])([#b]?)(.*)$/.exec(sym);
    if (!m || !QUALITY[m[3]]) throw new Error('bad chord ' + sym);
    let root = NOTE_IDX[m[1].toLowerCase()] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0);
    root = ((root % 12) + 12) % 12;
    // close voicing folded into [low, high)
    return QUALITY[m[3]].map((iv) => { let n = 48 + root + iv; while (n < low) n += 12; while (n >= high + 12) n -= 12; return n; }).sort((a, b) => a - b);
  }
  const chordRoot = (sym, octave = 2) => noteToMidi(sym.match(/^[A-G][#b]?/)[0] + octave);

  // Bass + chord accompaniment from a list of chord symbols, one per `unit` steps.
  // opts: { unit=16, bassStep=2, bassOct=true, bassOctave=2, chordSteps=[4,12], chordLen=2, low=60, high=72 }
  function accomp(chords, opts = {}) {
    const o = { unit: 16, bassStep: 2, bassOct: true, bassOctave: 2, chordSteps: [4, 12], chordLen: 2, low: 60, high: 72, ...opts };
    const bass = [], pads = [];
    chords.forEach((sym, i) => {
      const base = i * o.unit; const r = chordRoot(sym, o.bassOctave); const ch = chord(sym, o.low, o.high);
      for (let s = 0; s < o.unit; s += o.bassStep) {
        const oct = o.bassOct && (s / o.bassStep) % 2 === 1 ? 12 : 0;
        bass.push({ step: base + s, len: Math.max(1, o.bassStep - 1), midi: r + oct });
      }
      for (const s of o.chordSteps) if (s < o.unit) ch.forEach((m) => pads.push({ step: base + s, len: o.chordLen, midi: m }));
    });
    return { bass, chords: pads };
  }
  // Arpeggio over chord symbols: pattern indexes chord tones (index >= tones wraps up an octave)
  function arpeggio(chords, { unit = 16, pattern = [0, 1, 2, 3, 2, 1], octave = 12, low = 60, high = 72, stepOffset = 0 } = {}) {
    const ev = [];
    chords.forEach((sym, i) => {
      const ch = chord(sym, low, high);
      for (let s = 0; s < unit; s++) {
        const k = pattern[s % pattern.length];
        ev.push({ step: stepOffset + i * unit + s, len: 1, midi: ch[k % ch.length] + 12 * Math.floor(k / ch.length) + octave });
      }
    });
    return ev;
  }

  // Drum pattern string per bar: "k . h . s . h ." (k kick, s snare, h hat, o open hat, t tom; combine like "kh")
  const DRUM_MAP = { k: ['kick', 150, 0.15, 0.2], s: ['snare', 220, 0.12, 0], h: ['hat', 7000, 0.04, 0],
    o: ['ohat', 7000, 0.25, 0], t: ['tom', 180, 0.3, 0.5] };
  function parseDrums(bar, nBars = 1, stepOffset = 0) {
    const ev = []; const toks = bar.trim().split(/\s+/);
    for (let b = 0; b < nBars; b++) toks.forEach((t, i) => { for (const c of t) if (DRUM_MAP[c]) ev.push({ step: stepOffset + b * toks.length + i, drum: c }); });
    return ev;
  }

  // ---- SFX presets: [patch, Hz|'A4', delay(s), dur(s), vel, sweep, panSign] --------
  const SFX = {
    shot: [['zap', 1900, 0, 0.07, 0.6, 0.35]],
    laser: [['zap', 2400, 0, 0.18, 0.6, 0.15]],
    eshot: [['blip', 700, 0, 0.12, 0.6, 1.8]],
    hit: [['clank', 1000, 0, 0.05, 0.4, 0]],
    explosion: [['boom', 200, 0, 0.5, 1, 0.25]],
    bigexplosion: [['bigboom', 120, 0, 1.4, 1, 0.2], ['boom', 300, 0.15, 0.6, 0.8, 0.2, -1], ['boom', 180, 0.35, 0.6, 0.8, 0.2]],
    damage: [['clank', 500, 0, 0.25, 1, 0.4], ['boom', 160, 0, 0.5, 0.9, 0.3]],
    powerup: [0, 4, 7, 12, 16].map((n, i) => ['bell', mtof(76 + n), i * 0.05, 0.25, 0.8, 0]),
    coin: [['bell', 'B5', 0, 0.06, 0.8, 0], ['bell', 'E6', 0.06, 0.35, 0.8, 0]],
    jump: [['blip', 300, 0, 0.18, 0.7, 2.5]],
    extend: [0, 7, 12, 19, 24].map((n, i) => ['bell', mtof(72 + n), i * 0.08, 0.4, 0.9, 0]),
    select: [['bell', 'C6', 0, 0.15, 0.7, 0]],
    cancel: [['blip', 500, 0, 0.12, 0.6, 0.5]],
    warning: [0, 1, 2, 3, 4, 5].map((i) => ['siren', i % 2 ? 660 : 880, i * 0.35, 0.33, 0.8, i % 2 ? 1.33 : 0.75]),
    whistle: [['whistle', 'A5', 0, 0.5, 1, 0], ['whistle', 'C#6', 0, 0.5, 0.8, 0], ['whistle', 'A5', 0.6, 0.9, 1, 0], ['whistle', 'C#6', 0.6, 0.9, 0.8, 0]],
    steam: [['noise', 2000, 0, 0.9, 1, 0.3]],
    bomb: [['noise', 2000, 0, 0.9, 1, 0.3], ['bigboom', 90, 0, 1.2, 0.8, 0.3]],
  };

  // ---- engine ---------------------------------------------------------------
  const FM = {
    op, OFF, PATCHES, SFX, DRUM_MAP,
    noteToMidi, mtof, parseLine, parseBars, chord, chordRoot, accomp, arpeggio, parseDrums,
    ctx: null, music: null, sfx: null, ready: false, musicVol: 0.8, sfxVol: 0.9, muted: false,
    song: null, mute: {}, timer: null, onSongEnd: null,

    // Call from a user gesture (keydown / pointerdown). Safe to call repeatedly.
    async init({ musicVoices = 16, sfxVoices = 12, echo = 0.22, echoTime = 0.31 } = {}) {
      if (this.ctx) { if (this.ctx.state !== 'running') await this.ctx.resume(); return; }
      if (typeof fmWorkletMain !== 'function') throw new Error('load fm-worklet.js before fm-audio.js');
      const ctx = this.ctx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
      // Blob URL so this works from file:// too
      const url = URL.createObjectURL(new Blob([fmWorkletMain.toString() + '\nfmWorkletMain();'], { type: 'application/javascript' }));

      this.music = mk(musicVoices); this.sfx = mk(sfxVoices);
      this.addPatches(PATCHES);
      const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -10; comp.ratio.value = 4; comp.connect(ctx.destination);
      this.musicGain = ctx.createGain(); this.musicGain.gain.value = this.musicVol;
      this.sfxGain = ctx.createGain(); this.sfxGain.gain.value = this.sfxVol;
      this.music.connect(this.musicGain); this.musicGain.connect(comp);
      this.sfx.connect(this.sfxGain); this.sfxGain.connect(comp);
      if (echo > 0) {
        const d = ctx.createDelay(2); d.delayTime.value = echoTime;
        const fb = ctx.createGain(); fb.gain.value = 0.28; const wet = ctx.createGain(); wet.gain.value = echo;

      }

    },

    addPatches(patches) {
      Object.assign(PATCHES, patches);

    },

    // Low-level note. target: 'music' | 'sfx'. freq: Hz (number) or note name ('A4').
    note(target, patch, freq, { t, dur = 0.2, vel = 1, pan = 0, sweep = 0 } = {}) {
      if (!this.ready) return;
      const node = target === 'music' ? this.music : this.sfx;
      const f = typeof freq === 'number' ? freq : mtof(freq); // number = Hz, string = note name
      node.port.postMessage({ type: 'note', patch, freq: f, t: t == null ? this.ctx.currentTime + 0.005 : t, dur, vel, pan, sweep });
    },

    // Play an SFX preset (or an inline array of steps). x/width give stereo position.
    play_sfx(name, { x, width = 960, vel = 1 } = {}) {
      if (!this.ready) return;
      const steps = typeof name === 'string' ? SFX[name] : name;
      if (!steps) { console.warn('FM: unknown sfx ' + name); return; }
      const pan = x == null ? 0 : Math.max(-0.8, Math.min(0.8, (x / width) * 1.6 - 0.8));
      const t0 = this.ctx.currentTime + 0.005;

        this.note('sfx', patch, f, { t: t0 + delay, dur, vel: v * vel, pan: pan * panSign, sweep });
    },
    defineSfx(name, steps) { SFX[name] = steps; },

    // ---- sequencer ----
    // song: { bpm, steps, stepsPerBeat=4, once=false, tracks:[{ name, patch, ev, vel=1, pan=0 }] }
    play(song, { mute = {} } = {}) {
      if (!this.ready) return;
      this.stop(true);
      this.song = song; this.mute = mute;
      this.stepDur = 60 / song.bpm / (song.stepsPerBeat || 4);
      if (this.echoDelay) this.echoDelay.delayTime.value = Math.min(2, this.stepDur * 3);
      for (const tr of song.tracks) { tr.byStep = {}; for (const e of tr.ev) (tr.byStep[e.step] ||= []).push(e); }
      this.songStart = this.ctx.currentTime + 0.08; this.nextStep = 0;
      this.timer = setInterval(() => this._schedule(), 25);
      this._schedule();
    },
    stop(hard = false) {
      if (this.timer) clearInterval(this.timer);
      this.timer = null; this.song = null;
      if (this.music) this.music.port.postMessage({ type: hard ? 'hush' : 'stop' });
    },
    setMute(mute) { this.mute = mute; },
    _schedule() {
      const s = this.song; if (!s) return;
      const ahead = this.ctx.currentTime + 0.15;
      while (this.songStart + this.nextStep * this.stepDur < ahead) {
        const abs = this.nextStep;
        if (s.once && abs >= s.steps) { clearInterval(this.timer); this.timer = null; this.song = null; if (this.onSongEnd) this.onSongEnd(s); return; }
        const step = abs % s.steps; const t = this.songStart + abs * this.stepDur;
        for (const tr of s.tracks) {
          if (this.mute[tr.name]) continue;
          const evs = tr.byStep[step]; if (!evs) continue;
          for (const e of evs) {
            if (e.drum) {
              const [p, f, d, sw] = DRUM_MAP[e.drum];
              this.note('music', p, f, { t, dur: d, vel: (tr.vel ?? 1) * (e.vel ?? 1), pan: e.drum === 'h' ? 0.25 : 0, sweep: sw });
            } else {
              this.note('music', e.patch || tr.patch, mtof(e.midi), { t, dur: e.len * this.stepDur * 0.92, vel: (tr.vel ?? 1) * (e.vel ?? 1), pan: tr.pan || 0 });
            }
          }
        }
        this.nextStep++;
      }
    },

    // ---- mixer ----
    setVolume({ music, sfx } = {}) {
      if (music != null) this.musicVol = music; if (sfx != null) this.sfxVol = sfx;
      if (this.ready && !this.muted) { this.musicGain.gain.value = this.musicVol; this.sfxGain.gain.value = this.sfxVol; }
    },
    toggleMute() {
      this.muted = !this.muted; if (!this.ready) return this.muted;
      this.musicGain.gain.value = this.muted ? 0 : this.musicVol; this.sfxGain.gain.value = this.muted ? 0 : this.sfxVol;
      return this.muted;
    },
    // Release everything and close the AudioContext (e.g. when leaving the page / after tests)
    async shutdown() {
      this.stop(true); if (this.sfx) this.sfx.port.postMessage({ type: 'hush' });
      if (this.ctx) await this.ctx.close();
      this.ctx = null; this.ready = false;
    },

    // Measure output level for headless verification (cannot listen -> check numbers)
    async measure(target = 'music', ms = 1000) {
      const an = this.ctx.createAnalyser(); an.fftSize = 2048;
      (target === 'music' ? this.musicGain : this.sfxGain).connect(an);
      const buf = new Float32Array(2048); let peak = 0, sum = 0, n = 0, nonFinite = 0;
      for (let i = 0; i < ms / 50; i++) {
        await new Promise((r) => setTimeout(r, 50)); an.getFloatTimeDomainData(buf);
        for (const v of buf) { if (!Number.isFinite(v)) nonFinite++; else { peak = Math.max(peak, Math.abs(v)); sum += v * v; n++; } }
      }
      an.disconnect();
      return { peak: +peak.toFixed(3), rms: +Math.sqrt(sum / Math.max(1, n)).toFixed(3), nonFinite };
    },
  };

  window.FM = FM;
})();

</script>

function glowify(im,r){ // white soft outline baked once
 const P=r*2,w=im.width+P*2,h=im.height+P*2;
 const sil=document.createElement('canvas');sil.width=im.width;sil.height=im.height;const sc=sil.getContext('2d');
 sc.drawImage(im,0,0);sc.globalCompositeOperation='source-in';sc.fillStyle='#fff';sc.fillRect(0,0,im.width,im.height);
 const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');
 [[r*1.8,0.10],[r*1.4,0.16],[r,0.35],[r*0.6,1]].forEach(([rad,a])=>{g.globalAlpha=a;for(let i=0;i<16;i++){const t=i/16*TAU;g.drawImage(sil,P+Math.cos(t)*rad,P+Math.sin(t)*rad);}});
 g.globalAlpha=1;g.drawImage(im,P,P);c.__pad=P;c.__ih=im.height;return c;}
ALL.forEach(([n,src])=>{const im=new Image();im.onload=()=>{try{IM[n]=GLOW[n]?glowify(im,GLOW[n]):im;}catch(e){IM[n]=im;}loaded++;};im.onerror=()=>{loaded++;};im.src=src;});

// 弾はまっすぐ等速で飛ぶので、未来の位置は正確に計算できる。
// 子どもが弾を放つその瞬間に（予告はしない）、「画面にある弾」＋「いま撃つ弾」のすべてに対して、
// 主人公が「反応するまでの REACT 秒は今の入力のまま → その後9とおりの単純な操作
// （←・なし・→ × 上昇・下降・高さ維持）のどれかを続ける」場合を、実際のゲームと同じ物理で
// 弾がすべて消えるまで計算し、当たらずに済む操作が need 個以上残る方向にしか撃たない。

 // 今の速度のまま進んだ場合に、弾とちょうど出会う点（迎撃点）を計算
 const rx=bc.x-k.ax,ry=bc.y-k.ay,vx=boy.vx,vy=boy.vy*0.5,qa=vx*vx+vy*vy-sp*sp,qb=2*(rx*vx+ry*vy),qc=rx*rx+ry*ry;

 const c=[],r=Math.random();
 if(r<0.35)c.push({ang:aim(ix,iy),need:3});                // ねらいうち：よけ方が4つ以上残るときだけ

    if(boy.bal&&planShot(k,bc,dx,prog)){shots.push({x:k.ax,y:k.ay,vx:Math.cos(k.ang)*k.sp,vy:Math.sin(k.ang)*k.sp,t:0,c:(Math.random()*6)|0});SFX.shoot();k.cool=rnd(2.0,3.2)-prog*0.7;}
    else k.cool=rnd(0.4,0.9);}}
  else{k.cool-=dt;if(k.cool<=0&&boy.bal&&shotGap<=0){k.wind=WIND;shotGap=0.45;}}}
 for(const s of shots){s.t+=dt;s.x+=s.vx*dt;s.y+=s.vy*dt;
  if(boy.bal&&boy.inv<=0&&Math.hypot(s.x-bc.x,s.y-bc.y)<34){s.dead=true;boy.bal=false;boy.fall=true;boy.hat=0;boy.vy=-120;lives--;SFX.pop();burst(bc.x,bc.y,14,'conf',HAT);floatText('パン！',bc.x,bc.y-30,'#ff5f5f');}}
 shots=shots.filter(s=>!s.dead&&s.t<4&&s.y>-20&&s.y<H);
 for(const c of cand2){if(!c.got&&Math.hypot(c.x-boy.x,c.y-(boy.y-60))<60||!c.got&&boy.bal&&Math.hypot(c.x-bc.x,c.y-bc.y)<50){c.got=true;score++;score2++;SFX.candy(c.x-camX);burst(c.x,c.y,6,'star');floatText('+1',c.x,c.y-20,'#ffd84a');}}
 // goal
 if(boy.x>GOAL.x+10&&boy.x<GOAL.x+GOAL.w-10&&boy.y<=GOAL.roof+14&&!boy.fall){boy.y=GOAL.roof;if(score2<SALT){SFX.salt();go('salty');}else{SFX.win();go('end');}}
}
function drawP2(){
 drawBG(camX,T);
 ctx.save();ctx.translate(-camX,0);
 houses2.forEach(h=>{if(h.x+h.w>camX-200&&h.x<camX+W+200)houseS(h.x,GY,h.w,h.h,h.c,h.s,h.flat);});
 for(let x=300;x<WORLD;x+=330)if(x>camX-60&&x<camX+W+60)lolliTree(x,GY,0.8+(x%3)*0.15,x/330|0);
 // goal house
 if(!(GOAL.spr&&spr('goal',GOAL.x+GOAL.w/2,GY+6,GOAL.spr)))house(GOAL.x,GY,GOAL.w,GOAL.h,'#e2c4ff','#ff5fa8',99,true);
 for(let i=0;i<6;i++)star(GOAL.x+20+i*(GOAL.w-40)/5,GOAL.roof-40+Math.sin(T*3+i)*6,7,CANDYCOL[i],2,T);
 drawGirl(GOAL.x+GOAL.w/2+40,GOAL.roof-30,T,'wave');
 if(boy.x>GOAL.x-700){ctx.globalAlpha=0.6+0.4*Math.sin(T*4);heart(GOAL.x+GOAL.w/2+40,GOAL.roof-120,14,'#ff5fa8');ctx.globalAlpha=1;}
 ctx.restore();
 ctx.save();ctx.translate(-camX,0);
 for(const c of cand2)if(!c.got)drawCandy(c.x,c.y+Math.sin(T*3+c.x)*5,Math.sin(T*2+c.x)*0.4,c.type,c.c);
 for(const k of kids2)drawKid(k.x,k.y,k.t,k.c,'shoot',boy.x>k.x?1:-1,k.wind>0?1-k.wind/0.9:0);
 for(const s of shots){circ(s.x,s.y,8,CANDYCOL[s.c],3);circ(s.x-2,s.y-2,2.5,'#fff',0);}

 ctx.restore();
 drawGround(camX);
 ctx.save();ctx.translate(-camX,0);
 drawBoy(boy.x,boy.y,T,{f:boy.f,hat:boy.bal?1:(boy.fall?0:boy.hat),ground:!boy.bal,walk:(!boy.bal&&!boy.fall)?Math.min(1,Math.abs(boy.vx)/150):0,hurt:boy.inv>0&&boy.bal,rot:boy.fall?Math.sin(T*18)*0.35:undefined});
 drawParts();drawFloat();
 ctx.restore();
 // HUD
 rr(16,14,150,52,26,'#fff',4);drawCandy(46,40,0.3,0,0,1);text(`${score2}`,110,41,28,OL,'center',0);
 for(let i=0;i<4;i++)heart(196+i*34,46,13,i<lives?'#ff5fa8':'#ddd',3);
 const px=W-400,pw=260;rr(px,24,pw,18,9,'#fff',4);rr(px+3,28,(pw-6)*clamp(boy.x/GOAL.x,0,1),10,5,'#ffd84a',0);
 heart(px+pw+18,40,12,'#ff5fa8',3);
 if(T<3.5){ctx.globalAlpha=Math.min(1,3.5-T);text('スペース(▲)で ふわっと うかぶ！ たまに あたらないでね',W/2,100,24,'#ffd84a');ctx.globalAlpha=1;}
 if(!boy.bal&&!boy.fall&&boy.wait>0)text('ぼうしを ふくらませてる…',W/2,H/2-60,26,'#fff');
}

// ---------- scenes ----------
function drawTitle(){
 if(IM.title5_1){ctx.save();const z=1+0.03*Math.sin(T*0.3);ctx.translate(W/2,H/2);ctx.scale(z,z);ctx.translate(-W/2,-H/2);cover('title5_1');ctx.restore();
  const g=ctx.createLinearGradient(0,350,0,H);g.addColorStop(0,'#2a1f3d00');g.addColorStop(1,'#2a1f3dbb');ctx.fillStyle=g;ctx.fillRect(0,350,W,H-350);
  ctx.save();ctx.translate(570,412);ctx.rotate(Math.sin(T*1.5)*0.015);text('ふしぎな キャンディの そら',0,0,44,'#ffd84a','center',11);ctx.restore();
  text('〜 ぼうしの ふうせんで あいにいこう 〜',570,451,18,'#fff','center',6);
  if(Math.sin(T*5)>-0.3)text('スペース か タップで スタート',570,484,22,'#fff','center',7);
  text('← → いどう　スペース ジャンプ / うかぶ　M おと',570,517,15,'#fff','center',5);return;}
 drawBG(T*30,T);
 town.forEach(h=>houseS(h.x,GY,h.w,h.h,h.c,h.s));
 drawGround(T*30);
 const gx=W/2+Math.sin(T*0.8)*300,gd=Math.cos(T*0.8)>0?1:-1;
 drawGirl(gx,190+Math.sin(T*2)*20,T,'fly',gd);
 drawBoy(200,GY,T,{f:1,armUp:true});drawKid(760,GY,T,1,'run',-1);drawKid(830,GY,T+1,2,'run',-1);
 ctx.save();ctx.translate(W/2,92);ctx.rotate(Math.sin(T*1.5)*0.02);
 text('ふしぎな キャンディの そら',0,0,58,'#ffd84a','center',12);ctx.restore();
 text('〜 ぼうしの ふうせんで あいにいこう 〜',W/2,150,22,'#fff','center',6);
 if(Math.sin(T*5)>-0.3)text('スペース か タップで スタート',W/2,330,28,'#fff','center',8);
 text('← → いどう　スペース ジャンプ / うかぶ　M おと',W/2,515,16,'#fff','center',5);
}
function drawStory2(){
 drawBG(0,T);town.forEach(h=>houseS(h.x,GY,h.w,h.h,h.c,h.s));drawGround(0);
 const gx=girl.x+T*260;drawGirl(gx,girl.y-T*40,T,'fly',1);
 const hat=clamp((T-2.2)/1.4,0,1);if(T>2.2&&T<2.3&&!S2s){S2s=true;SFX.inflate();}
 drawBoy(W/2-40,GY,T,{f:1,hat,ground:true});
 if(T>1.2)page([`キャンディを ${score}こ あつめたよ！`,'おんなのこは とおくの やねで ひとやすみ。','ぼうしを ふくらませて あいにいこう！','とちゅうの キャンディも わすれずにね。'],W/2,185,640);
}
let S2s=false;
function drawEnd(){
 if(IM.ending3_2){ctx.save();const z=1.02+0.04*Math.min(1,T/6);ctx.translate(W/2,H/2);ctx.scale(z,z);ctx.translate(-W/2,-H/2);cover('ending3_2');ctx.restore();
  const g=ctx.createLinearGradient(0,380,0,H);g.addColorStop(0,'#2a1f3d00');g.addColorStop(1,'#2a1f3dcc');ctx.fillStyle=g;ctx.fillRect(0,380,W,H-380);
  if(T>0.6&&Math.random()<0.15)burst(rnd(150,810),rnd(200,420),1,'heart','#ff5fa8');
  if(T>0.6&&Math.random()<0.3)burst(rnd(100,860),-10,1,'conf');
  updParts(1/60);drawParts();
  if(T>0.8){ctx.save();ctx.translate(W/2,436);const s=Math.min(1,(T-0.8)*3);ctx.scale(s,s);text('キャンディを もらえたよ！',0,0,46,'#ffd84a','center',10);ctx.restore();
   text(`あつめた キャンディ：${score}こ`,W/2,480,20,'#fff','center',6);}
  if(T>2.5&&Math.sin(T*5)>-0.3)text('スペース / タップで もういちど',W/2,515,18,'#fff','center',5);return;}
 drawBG(0,T,true);
 // rooftop close-up
 rr(160,370,640,260,10,'#e2c4ff',5);rr(140,352,680,26,10,'#ff5fa8',5);
 for(let i=0;i<5;i++){rr(200+i*120,420,60,70,10,'#fff3a8',4);}
ctx.save();ctx.translate(480,352);ctx.scale(1.3,1.3);ctx.translate(-480,-312);
 drawGirl(540,290,T,'sit');
 drawBoy(410,312,T,{f:1,armUp:T>2.4});
 // giant lollipop handover
 const k=clamp((T-1)/1.4,0,1),lx=566-k*134,ly=250-k*50-Math.sin(k*Math.PI)*60;
 drawCandy(lx,ly,Math.sin(T*2)*0.1,1,0,2.0);ctx.restore();
 if(T>2.4&&Math.random()<0.15)burst(rnd(150,810),rnd(160,300),1,'heart','#ff5fa8');
 if(T>2.4&&Math.random()<0.3)burst(rnd(100,860),-10,1,'conf');
 updParts(1/60);drawParts();
 if(T>2.6){ctx.save();ctx.translate(W/2,90);const s=Math.min(1,(T-2.6)*3);ctx.scale(s,s);text('キャンディを もらえたよ！',0,0,52,'#ffd84a','center',11);ctx.restore();
  text(`あつめた キャンディ：${score}こ`,W/2,150,26,'#fff','center',7);}
 if(T>3.5&&Math.sin(T*5)>-0.3)text('スペース / タップで もういちど',W/2,515,22,'#fff','center',6);
}
function drawSalty(){
 if(IM.salty_1){cover('salty_1');}else{drawBG(0,T,true);}
 const g=ctx.createLinearGradient(0,370,0,H);g.addColorStop(0,'#2a1f3d00');g.addColorStop(1,'#2a1f3ddd');ctx.fillStyle=g;ctx.fillRect(0,370,W,H-370);
 if(T>0.7){ctx.globalAlpha=Math.min(1,(T-0.7)*3);text('…ふーん。これだけ？',W/2,428,44,'#cfd8ff','center',10);ctx.globalAlpha=1;}
 if(T>1.6)text(`このステージの キャンディ：${score2}こ　もっと あつめて また おいで`,W/2,476,19,'#fff','center',6);
 if(T>2.5&&Math.sin(T*5)>-0.3)text('スペース / タップで タイトルへ',W/2,515,18,'#fff','center',5);
}
function drawOver(){
 drawBG(camX,T);drawGround(camX);
 drawBoy(W/2,GY,T,{f:1});
 page(['ふうせんが ぜんぶ われちゃった…','もういちど ちょうせんしよう！'],W/2,220,560);
}

// ---------- loop ----------
let last=performance.now();
function frame(now){
 const dt=Math.min(0.033,(now-last)/1000);last=now;T+=dt;
 ctx.setTransform(scale*dpr,0,0,scale*dpr,0,0);ctx.lineJoin='round';ctx.lineCap='round';
 if(loaded<ALL.length&&T<10){ctx.fillStyle='#ffe8f4';ctx.fillRect(0,0,W,H);text('よみこみちゅう… '+loaded+' / '+ALL.length,W/2,H/2,30,'#ffd84a');for(const k in pressed)delete pressed[k];tapped=false;requestAnimationFrame(frame);return;}
 if(S==='title'){drawTitle();if(confirm()){SFX.page();go('s1');}}
 else if(S==='s1'){drawBG(0,T);town.forEach(h=>houseS(h.x,GY,h.w,h.h,h.c,h.s));drawGround(0);
  drawGirl(W/2+130,170+Math.sin(T*2)*12,T,'fly',-1);drawBoy(W/2-160,GY,T,{f:1,armUp:true});
  page(['ふしぎな おんなのこが','そらから キャンディを ばらまいている！','← → で うごいて、スペースで ジャンプ。','こどもに ぶつかると おとしちゃうよ。'],W/2,250,640);
  if(T>0.8&&confirm()){SFX.page();go('p1');}}
 else if(S==='p1'){updP1(dt);updParts(dt);updFloat(dt);drawP1();}
 else if(S==='s2'){if(T<0.02)S2s=false;drawStory2();if(T>2.5&&confirm()){SFX.page();go('p2');}}
 else if(S==='p2'){updP2(dt);updParts(dt);updFloat(dt);if(S==='p2')drawP2();}
 else if(S==='salty'){drawSalty();if(T>2.5&&confirm()){SFX.page();go('title');}}
 else if(S==='end'){drawEnd();if(T>(IM.ending3_2?2.5:3.5)&&confirm()){SFX.page();go('title');}}
 else if(S==='over'){drawOver();if(T>0.8&&confirm()){SFX.page();go('p2');}}
 for(const k in pressed)delete pressed[k];tapped=false;
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
