<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>霧雨館殺人事件</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #f3ead8;
  --gold: #d6b26a;
  --gold-dim: #8a6f3c;
  --panel: rgba(14, 12, 22, 0.86);
  --panel-edge: rgba(214, 178, 106, 0.55);
  --red: #c4423a;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #050408; overflow: hidden; }
body { font-family: 'Zen Kaku Gothic New', sans-serif; color: var(--ink); user-select: none; }
#wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
#stage { position: relative; width: 1280px; height: 720px; overflow: hidden; transform-origin: center center; background: #000; }

/* layers */
.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: opacity .8s; }
#bgB { opacity: 0; }
#tint { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,.55) 100%); }
#flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
#flash.on { animation: flash .7s ease-out; }
@keyframes flash { 0% { opacity: .95; } 100% { opacity: 0; } }
#stage.shake { animation: shake .5s; }
@keyframes shake { 0%,100% { translate: 0 0; } 20% { translate: -14px 6px; } 40% { translate: 12px -8px; } 60% { translate: -8px 4px; } 80% { translate: 6px -2px; } }

.ch { position: absolute; bottom: 0; height: 640px; width: 480px; object-fit: cover; object-position: top;
  -webkit-mask-image: radial-gradient(ellipse 58% 72% at 50% 42%, #000 58%, transparent 82%);
  mask-image: radial-gradient(ellipse 58% 72% at 50% 42%, #000 58%, transparent 82%);
  transition: opacity .35s, filter .35s, transform .35s; opacity: 0; pointer-events: none; }
.ch.on { opacity: 1; }
.ch.dim { filter: brightness(.45) saturate(.6); }
#chL { left: 40px; transform: translateX(-20px); }
#chR { right: 60px; transform: translateX(20px); }
#chL.on, #chR.on { transform: none; }
#chC { left: 150px; height: 660px; width: 495px; filter: brightness(.8); }

/* text box */
#box { position: absolute; left: 40px; right: 40px; bottom: 24px; height: 178px; background: var(--panel);
  border: 1px solid var(--panel-edge); border-radius: 6px; padding: 30px 40px 20px; display: none;
  box-shadow: 0 10px 40px rgba(0,0,0,.6), inset 0 0 0 4px rgba(0,0,0,.4); }
#box.on { display: block; }
#name { position: absolute; top: -20px; left: 28px; padding: 6px 22px; background: linear-gradient(#2b1f14, #17110b);
  border: 1px solid var(--gold); border-radius: 3px; font-family: 'Shippori Mincho', serif; font-weight: 700; font-size: 22px; color: var(--gold); letter-spacing: .1em; }
#name:empty { display: none; }
#text { font-size: 25px; line-height: 1.7; letter-spacing: .03em; white-space: pre-wrap; }
#text.narr { color: #d9d2c4; }
#next { position: absolute; right: 22px; bottom: 14px; color: var(--gold); font-size: 18px; opacity: 0; animation: bob 1s infinite; }
#next.on { opacity: 1; }
@keyframes bob { 50% { transform: translateY(4px); } }

/* choice menu */
#menu { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 14px; background: rgba(0,0,0,.35); }
#menu.on { display: flex; }
#menu .q { font-family: 'Shippori Mincho', serif; font-size: 28px; color: var(--gold); margin-bottom: 10px; text-shadow: 0 2px 8px #000; }
.btn { min-width: 420px; padding: 14px 28px; background: var(--panel); border: 1px solid var(--panel-edge); color: var(--ink);
  font: 700 22px 'Zen Kaku Gothic New', sans-serif; border-radius: 4px; cursor: pointer; text-align: left; transition: background .15s, transform .15s; }
.btn:hover, .btn:focus-visible { background: rgba(70, 50, 24, .92); transform: translateX(6px); outline: none; }

/* hub */
#hub { position: absolute; top: 70px; right: 30px; width: 430px; max-height: 620px; display: none; flex-direction: column; gap: 6px; }
#hub.on { display: flex; }
#hub .loc { font-family: 'Shippori Mincho', serif; font-weight: 800; font-size: 30px; color: var(--gold); text-shadow: 0 2px 10px #000; margin-bottom: 4px; }
#hub .grp { font-size: 14px; color: var(--gold); letter-spacing: .2em; margin: 8px 0 2px; text-shadow: 0 1px 4px #000; }
#hub .act { padding: 9px 16px; background: var(--panel); border: 1px solid rgba(214,178,106,.3); border-radius: 4px; cursor: pointer; font-size: 18px; display: flex; gap: 10px; align-items: center; transition: background .15s, transform .15s; }
#hub .act:hover { background: rgba(70, 50, 24, .92); transform: translateX(-4px); }
#hub .act.done { color: #a39c8d; }
#hub .act.done::after { content: '✓'; margin-left: auto; color: var(--gold-dim); }
#hub .act.new::after { content: 'NEW'; margin-left: auto; font-size: 11px; color: #111; background: var(--gold); padding: 1px 6px; border-radius: 2px; }
#hub .act .ic { width: 22px; text-align: center; }
#hub .act.big { background: linear-gradient(90deg, #5a1d18, #2a0e0c); border-color: var(--red); font-weight: 700; font-size: 20px; justify-content: center; animation: pulse 1.6s infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 18px rgba(196,66,58,.8); } }
#hubScroll .moves { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
#hubScroll .moves .act { font-size: 16px; padding: 7px 12px; }
#hubScroll { overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding-right: 4px; }

/* HUD */
#hud { position: absolute; top: 14px; left: 20px; right: 20px; display: none; justify-content: space-between; align-items: center; pointer-events: none; }
#hud.on { display: flex; }
#hud .left { font-family: 'Shippori Mincho', serif; color: var(--gold); font-size: 18px; text-shadow: 0 1px 6px #000; letter-spacing: .1em; }
#hud .right { display: flex; gap: 8px; pointer-events: auto; }
.hbtn { background: var(--panel); border: 1px solid var(--panel-edge); color: var(--ink); padding: 7px 16px; font: 700 16px 'Zen Kaku Gothic New'; border-radius: 4px; cursor: pointer; }
.hbtn:hover { background: rgba(70,50,24,.92); }
#lives { position: absolute; top: 56px; left: 20px; font-size: 30px; color: var(--red); display: none; text-shadow: 0 0 8px #000; letter-spacing: 4px; }
#lives.on { display: block; }

/* notebook */
#note { position: absolute; inset: 0; background: rgba(5,4,10,.82); display: none; padding: 40px 60px; }
#note.on { display: block; }
#note .head { display: flex; align-items: center; gap: 20px; margin-bottom: 18px; }
#note .title { font-family: 'Shippori Mincho', serif; font-weight: 800; font-size: 32px; color: var(--gold); }
#note .prompt { font-size: 20px; color: #fff; background: #5a1d18; padding: 6px 16px; border-radius: 3px; }
#note .close { margin-left: auto; }
#note .body { display: flex; gap: 30px; height: 560px; }
#grid { flex: 1.15; display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; align-content: start; overflow-y: auto; padding: 4px; }
.card { aspect-ratio: 1; position: relative; border: 1px solid rgba(214,178,106,.35); border-radius: 4px; overflow: hidden; cursor: pointer; background: #120f18; }
.card img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
.card .lbl { position: absolute; left: 0; right: 0; bottom: 0; padding: 4px 6px; background: rgba(0,0,0,.75); font-size: 13px; text-align: center; }
.card.sel { outline: 3px solid var(--gold); }
.card .tag { position: absolute; top: 4px; left: 4px; font-size: 11px; background: var(--gold); color: #111; padding: 1px 5px; border-radius: 2px; font-weight: 700; }
#detail { flex: 1; background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 6px; padding: 22px; display: flex; flex-direction: column; gap: 14px; }
#detail img { width: 100%; height: 190px; flex-shrink: 0; object-fit: cover; object-position: top; border-radius: 3px; }
#detail h3 { margin: 0; font-family: 'Shippori Mincho', serif; font-size: 26px; color: var(--gold); }
#detail p { margin: 0; font-size: 17px; line-height: 1.7; white-space: pre-wrap; overflow-y: auto; }
#detail .upd { color: #ffcf7a; }
#presentBtn { align-self: flex-end; margin-top: auto; background: linear-gradient(#8b2a22, #561611); border-color: #e46a5f; font-size: 22px; padding: 10px 30px; }

/* item get */
#get { position: absolute; left: 50%; top: 44%; translate: -50% -50%; width: 520px; background: var(--panel); border: 1px solid var(--gold); border-radius: 6px; padding: 22px; display: none; text-align: center; box-shadow: 0 0 60px rgba(214,178,106,.25); }
#get.on { display: block; animation: pop .4s; }
@keyframes pop { from { transform: scale(.7); opacity: 0; } }
#get .k { color: var(--gold); letter-spacing: .3em; font-size: 15px; }
#get img { width: 260px; height: 260px; object-fit: cover; object-position: top; border-radius: 4px; margin: 10px 0; }
#get .n { font-family: 'Shippori Mincho', serif; font-size: 28px; font-weight: 800; }

/* title */
#title { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: linear-gradient(transparent 30%, rgba(0,0,0,.6)); }
#title h1 { margin: 0; font-family: 'Shippori Mincho', serif; font-weight: 800; font-size: 92px; letter-spacing: .15em; color: #f6eedd; text-shadow: 0 0 30px rgba(0,0,0,.9), 0 4px 0 #3a2a14; }
#title .sub { font-family: 'Shippori Mincho', serif; font-size: 24px; color: var(--gold); letter-spacing: .3em; margin-bottom: 40px; text-shadow: 0 2px 6px #000; }
#title .btn { text-align: center; min-width: 320px; }
#title .btn:hover { transform: scale(1.04); }
#title .hint { margin-top: 18px; font-size: 14px; color: #aaa; }
#title.off { display: none; }
#banner { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.7); font-family: 'Shippori Mincho', serif; font-size: 52px; font-weight: 800; color: var(--gold); letter-spacing: .2em; text-shadow: 0 0 20px #000; }
#banner.on { display: flex; animation: fadein 1s; }
@keyframes fadein { from { opacity: 0; } }
#objection { position: absolute; left: 50%; top: 40%; translate: -50% -50%; font-family: 'Shippori Mincho', serif; font-weight: 800; font-size: 120px; color: #fff; -webkit-text-stroke: 4px #8b1a12; text-shadow: 0 0 30px #f33; display: none; rotate: -6deg; }
#objection.on { display: block; animation: slam .9s; }
@keyframes slam { 0% { transform: scale(3); opacity: 0; } 25% { transform: scale(1); opacity: 1; } 85% { opacity: 1; } 100% { opacity: 0; } }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <img id="bgA" class="bg" alt="">
    <img id="bgB" class="bg" alt="">
    <div id="tint"></div>
    <img id="chC" class="ch" alt="">
    <img id="chL" class="ch" alt="">
    <img id="chR" class="ch" alt="">
    <div id="hud"><div class="left" id="hudLoc"></div><div class="right">
      <button class="hbtn" id="bNote">手帳</button>
      <button class="hbtn" id="bHint">ひよりに相談</button>
      <button class="hbtn" id="bMute">♪ ON</button>
    </div></div>
    <div id="lives"></div>
    <div id="hub"><div class="loc" id="hubLoc"></div><div id="hubScroll"></div></div>
    <div id="box"><div id="name"></div><div id="text"></div><div id="next">▼</div></div>
    <div id="menu"></div>
    <div id="get"><div class="k">― 手帳に記録した ―</div><img alt=""><div class="n"></div></div>
    <div id="note">
      <div class="head"><div class="title">捜査手帳</div><div class="prompt" id="notePrompt"></div><button class="hbtn close" id="noteClose">閉じる</button></div>
      <div class="body"><div id="grid"></div><div id="detail"></div></div>
    </div>
    <div id="objection">それだ！</div>
    <div id="banner"></div>
    <div id="flash"></div>
    <div id="title">
      <h1>霧雨館殺人事件</h1>
      <div class="sub">― 探偵九条と助手ひよりの事件簿 ―</div>
      <button class="btn" id="bStart">はじめから</button>
      <button class="btn" id="bCont" style="display:none">つづきから</button>
      <div class="hint">クリック / Enter で進む　・　音が出ます</div>
    </div>
  </div>
</div>
<script src="js/fm-worklet.js"></script>
<script src="js/fm-audio.js"></script>
<script src="js/music.js"></script>
<script src="js/engine.js"></script>
<script src="js/story.js"></script>
</body>
</html>
