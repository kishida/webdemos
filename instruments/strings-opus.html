  <h1>Quartetto in Re „Auftakt“</h1>
  <div class="jp">弦楽四重奏 ニ長調 ― 弱起のアレグロ</div>
  <p>4つの楽器の弦を、デジタル導波管と弓の摩擦（スティック＝スリップ）モデルでリアルタイムに物理計算して鳴らします。
  旋律はどれも弱起（アウフタクト）から始まり、強拍の手前で少し息を吸ってから着地します。
  下のパネルには弦の振動（ヘルムホルツ運動をスローモーションで表示）と弓の動きが出ます。パネルをクリックするとその楽器をミュートできます。</p>
  <button id="go">▶ 演奏を始める</button>
  <div class="small">音が出ます · ヘッドホン推奨</div>
</div>
<script>
'use strict';
/* =====================================================================
   1. 物理モデル：弓奏弦（デジタル導波管 + 弓の摩擦テーブル + 胴体共鳴）
   ===================================================================== */
class BowedVoice{
  constructor(sr,o){
    this.sr=sr; this.N=16384; this.mask=16383;
    this.nk=new Float64Array(this.N); this.br=new Float64Array(this.N); this.w=0;
    this.beta=o.beta; this.pole=o.pole; this.t60=o.t60; this.vibRate=o.vibRate;
    this.gain=o.gain; this.direct=o.direct; this.det=o.detune||1;
    this.modes=o.modes.map(m=>{const f=Math.min(m[0],sr*0.45),q=m[1],gg=m[2];
      const w0=2*Math.PI*f/sr,al=Math.sin(w0)/(2*q),a0=1+al;
      return {b0:al/a0*gg,b2:-al/a0*gg,a1:-2*Math.cos(w0)/a0,a2:(1-al)/a0,x1:0,x2:0,y1:0,y2:0};});
    this.ev=[]; this.ei=0;
    this.freq=220; this.fT=220; this.gc=1; this.vel=0; this.vT=0; this.ac=0.01; this.rc=0.01;
    this.force=0.5; this.fo=0.5; this.bowing=false; this.off=true; this.lp=0; this.loss=0.95; this.lossMul=1;
    this.vib=0; this.vibT=0; this.vibStart=0; this.ph=Math.random()*6.28;
    this.pl=0; this.plN=0; this.plA=0; this.dcx=0; this.dcy=0;
    this.seed=(Math.random()*4e9)>>>0; this.nz=0; this.Lb=200; this.upd();
    if(o.ev) this.push(o.ev);
  }
  push(evs){ this.ev=this.ev.slice(this.ei).concat(evs).sort((a,b)=>a.t-b.t); this.ei=0; }
  clear(){ this.ev=[]; this.ei=0; this.vT=0; this.off=true; this.rc=1-Math.exp(-1/(0.08*this.sr)); }
  upd(){ // ループ全長 = sr/f − ローパスの位相遅延（正確な音程）
    const f=this.freq*this.det, w=2*Math.PI*f/this.sr, p=this.pole;
    const pd=Math.atan2(p*Math.sin(w),1-p*Math.cos(w))/w;
    this.Lb=this.sr/f-pd;
    this.loss=Math.min(0.995,Math.max(0.85,Math.pow(10,-3/(this.t60*f))))*this.lossMul;
  }
  apply(e,t){
    const sr=this.sr;
    if(e.k==='on'){
      this.fT=e.f;
      if(e.g>0){ this.gc=1-Math.exp(-1/(e.g*sr)); }
      else { this.freq=e.f; this.gc=1; this.vib*=0.4; }
      this.vT=e.v; this.ac=1-Math.exp(-1/(e.a*sr)); this.fo=e.p; if(e.a<0.02) this.force=Math.min(0.97,e.p+0.15);
      this.bowing=true; this.off=false; this.lossMul=1;
      this.vibT=e.vib; this.vibStart=t+e.vd; if(e.bp) this.beta=e.bp; this.upd();
    }else if(e.k==='off'){
      this.vT=0; this.rc=1-Math.exp(-1/(e.r*sr)); this.off=true;
    }else if(e.k==='pluck'){
      this.freq=this.fT=e.f; this.bowing=false; this.vT=0; this.vel=0; this.off=true;
      this.lossMul=0.992; this.upd();
      this.plN=Math.max(4,Math.round(sr*0.0011)); this.pl=0; this.plA=e.v; this.vibT=0; this.vib=0;
    }
  }
  process(out,t0){
    const sr=this.sr,n=out.length,mask=this.mask,nk=this.nk,br=this.br,modes=this.modes,nm=modes.length;
    const dph=2*Math.PI*this.vibRate/sr;
    for(let i=0;i<n;i++){
      const t=t0+i/sr;
      while(this.ei<this.ev.length&&this.ev[this.ei].t<=t){this.apply(this.ev[this.ei],t);this.ei++;}
      if(this.freq!==this.fT){ this.freq+=(this.fT-this.freq)*this.gc; if(Math.abs(this.freq-this.fT)<1e-4)this.freq=this.fT; if((i&7)===0)this.upd(); }
      else if((i&63)===0) this.upd();
      this.vel+=(this.vT-this.vel)*(this.vT>this.vel?this.ac:this.rc);
      this.force+=(this.fo-this.force)*0.0008;
      if(this.off&&this.vel<0.003)this.bowing=false;
      const vt=t>=this.vibStart?this.vibT:0; this.vib+=(vt-this.vib)*0.00009;
      this.ph+=dph; if(this.ph>6.283185307179586)this.ph-=6.283185307179586;
      const L=this.Lb/(1+this.vib*Math.sin(this.ph));
      const bl=L*this.beta, nl=L-bl;
      let p=this.w-nl, ip=Math.floor(p), fr=p-ip;
      const nutOut=nk[ip&mask]*(1-fr)+nk[(ip+1)&mask]*fr;
      p=this.w-bl; ip=Math.floor(p); fr=p-ip;
      const brOut=br[ip&mask]*(1-fr)+br[(ip+1)&mask]*fr;
      this.lp=this.loss*(1-this.pole)*brOut+this.pole*this.lp+1e-22;
      const bRef=-this.lp, nRef=-nutOut*0.996;
      let nv=0;
      if(this.bowing){
        this.seed=(Math.imul(this.seed,1664525)+1013904223)>>>0;
        this.nz+=((this.seed/4294967296-0.5)-this.nz)*0.25;
        const vb=this.vel*(1+0.1*this.nz);
        const dv=vb-(bRef+nRef);                      // 弓と弦の相対速度
        let s=Math.abs((dv+0.001)*(5-4*this.force))+0.75; s*=s; s*=s;
        let fc=1/s; if(fc>1)fc=1;                      // 摩擦特性（スティック／スリップ）
        nv=dv*fc;
      }
      if(this.pl<this.plN){ nv+=this.plA*Math.sin(Math.PI*this.pl/this.plN); this.pl++; }
      nk[this.w]=bRef+nv; br[this.w]=nRef+nv; this.w=(this.w+1)&mask;
      // 胴体：並列共鳴モード
      const x=brOut; let y=x*this.direct;
      for(let k=0;k<nm;k++){const m=modes[k];const yy=m.b0*x+m.b2*m.x2-m.a1*m.y1-m.a2*m.y2;m.x2=m.x1;m.x1=x;m.y2=m.y1;m.y1=yy;y+=yy;}
      const d=y-this.dcx+0.995*this.dcy; this.dcx=y; this.dcy=d+1e-25;
      out[i]=d*this.gain;
    }
  }
}
const PROC_SRC=`
class BowedProc extends AudioWorkletProcessor{
  constructor(o){super();this.v=new BowedVoice(sampleRate,o.processorOptions);
    this.port.onmessage=e=>{const d=e.data;if(d.type==='ev')this.v.push(d.ev);else if(d.type==='clear')this.v.clear();};}
  process(i,o){const ch=o[0][0];if(ch)this.v.process(ch,currentTime);return true;}
}
registerProcessor('bowed-string',BowedProc);`;
const WORKLET_URL=URL.createObjectURL(new Blob([BowedVoice.toString()+'\n'+PROC_SRC],{type:'application/javascript'}));

const scaleModes=(ms,k)=>ms.map(m=>[m[0]*k,m[1],m[2]]);
const VIOLIN_MODES=[[280,10,.9],[460,14,.6],[545,12,.8],[830,8,.35],[1250,6,.45],[2350,3,.85],[3250,3,.45],[4500,2.5,.2]];
const INST={
  violin:{beta:0.125,pole:0.62,t60:0.9,vibRate:5.6,gain:1.0,direct:0.22,modes:VIOLIN_MODES,vibDepth:0.0055},
  viola:{beta:0.13,pole:0.62,t60:1.0,vibRate:5.3,gain:0.8,direct:0.22,modes:scaleModes(VIOLIN_MODES,0.8),vibDepth:0.005},
  cello:{beta:0.13,pole:0.58,t60:1.2,vibRate:5.0,gain:1.5,direct:0.2,vibDepth:0.0045,
    modes:[[105,9,.9],[172,12,.7],[205,10,.8],[380,8,.45],[560,6,.45],[1050,3,.55],[1500,3,.3],[2300,2.5,.15]]}
};

/* =====================================================================
   2. 楽譜（オリジナル作曲・ニ長調・4/4・弱起）
   記法: 音名+オクターブ:拍数  フラグ ~スラー .スタッカート ^弱起 >アクセント t トリル
   ===================================================================== */
const PC={c:0,d:2,e:4,f:5,g:7,a:9,b:11};
function toMidi(nm){const L=nm[0];let r=nm.slice(1),acc=0;if(r[0]==='#'){acc=1;r=r.slice(1);}else if(r[0]==='b'&&r.length>1){acc=-1;r=r.slice(1);}return 12*(parseInt(r)+1)+PC[L]+acc;}
function parse(str){return str.trim().split(/\s+/).map(tok=>{
  const m=tok.match(/^(r|[a-g](?:#|b)?\d):(\d*\.?\d+)(.*)$/); if(!m) throw new Error('bad token '+tok);
  const f=m[3]; return {m:m[1]==='r'?null:toMidi(m[1]),d:parseFloat(m[2]),st:f.includes('.'),sl:f.includes('~'),pk:f.includes('^'),ac:f.includes('>'),tr:f.includes('t')};});}
const CH={D:['d3','a3','f#4'],D6:['f#2','a3','d4'],D64:['a2','f#3','d4'],G:['g2','b3','g4'],A7:['a2','g3','c#4'],
  A:['a2','c#4','e4'],E7d:['d3','g#3','e4'],Ac:['c#3','a3','e4'],E7:['e2','g#3','d4'],Fm:['f#2','a3','c#4'],
  Bm:['b2','f#3','d4'],E:['e2','g#3','b3'],Em7:['g2','b3','e4'],Dfin:['d2','a3','f#4']};
const T={
  1:{mel:"f#5:1.5~ e5:.5 d5:1 a5:.5~ f#5:.5",harm:[["D",4]]},
  2:{mel:"g5:1.5~ b5:.5 a5:1~ g5:.5 e5:.5",harm:[["G",2],["A7",2]]},
  3:{mel:"f#5:1 d5:.5~ f#5:.5 g5:.5~ e5:.5~ c#5:.5~ d5:.5",harm:[["D6",2],["A7",2]]},
  4:{mel:"e5:2 r:1 a4:.5^ d5:.5^",harm:[["A",2],["R",2]],breath:1},
  7:{mel:"f#5:.5~ a5:.5~ d6:.5~ f#5:.5 e5:1t g5:.5~ c#5:.5",harm:[["D64",2],["A7",2]]},
  8:{mel:"d5:1 a4:1. d4:1. e5:.5^~ f#5:.5^",harm:[["D",3],["R",1]],breath:1},
  9:{mel:"g#5:1.5~ f#5:.5 e5:1 c#5:.5~ e5:.5",harm:[["E7d",2],["Ac",2]]},
  10:{mel:"a5:1.5~ f#5:.5 d5:.5. b4:.5. g#4:.5. b4:.5.",harm:[["D",2],["E7",2]]},
  11:{mel:"c#5:1 e5:.5~ a5:.5 f#5:.5~ a5:.5~ c#6:.5~ a5:.5",harm:[["A",2],["Fm",2]]},
  12:{mel:"d6:.5~ b5:.5~ f#5:.5~ d5:.5 e5:1 r:1",harm:[["Bm",2],["E",1],["R",1]],vc:"b2:1. b2:1. e2:1. e2:.5^ a2:.5^",breath:1},
  13:{mel:"e5:4",harm:[["A",4]],vc:"c#3:1.5~ b2:.5 a2:1 c#3:.5~ e3:.5"},
  14:{mel:"f#5:2 e5:2",harm:[["D",2],["E7",2]],vc:"f#3:1.5~ e3:.5 d3:1 b2:.5~ g#2:.5"},
  15:{mel:"e5:2 f#5:1 d5:1",harm:[["Ac",2],["D",1],["E7",1]],vc:"a2:1 c#3:.5~ e3:.5 d3:.5~ f#3:.5 e3:.5~ d3:.5"},
  16:{mel:"c#5:2 g5:1 a4:.5^ d5:.5^",harm:[["A",2],["A7",1],["R",1]],vc:"c#3:2 a2:1 r:1",breath:1},
  24:{mel:"d5:.5. f#5:.5. a5:.5. d6:.5. b5:.5~ g5:.5~ e5:.5~ g5:.5",harm:[["D",2],["Em7",2]]},
  25:{mel:"f#5:1 a5:.5~ f#5:.5 e5:1t g5:.5~ c#5:.5",harm:[["D64",2],["A7",2]]},
  26:{mel:"d5:.5. a4:.5. f#4:.5. a4:.5. c#5:.5. e5:.5. g5:.5. e5:.5.",harm:[["D",2],["A7",2]]},
  27:{mel:"f#5:1> e5:1> d5:1> c#5:1>",harm:[["D",1],["A7",1],["D",1],["A7",1]],pat:'hits'},
  28:{mel:"d5:3> r:1",harm:[["Dfin",3],["R",1]],pat:'sus'}
};
T[5]=T[1]; T[6]=T[2];

const PARTS=[
  {id:'vn1',name:'Violino I',jp:'第1ヴァイオリン',color:[240,198,116],pan:-0.55,inst:'violin',open:[55,62,69,76],sn:['G','D','A','E'],range:[58,90]},
  {id:'vn2',name:'Violino II',jp:'第2ヴァイオリン',color:[236,140,118],pan:-0.2,inst:'violin',open:[55,62,69,76],sn:['G','D','A','E'],range:[56,84]},
  {id:'va',name:'Viola',jp:'ヴィオラ',color:[120,204,170],pan:0.22,inst:'viola',open:[48,55,62,69],sn:['C','G','D','A'],range:[46,74]},
  {id:'vc',name:'Violoncello',jp:'チェロ',color:[146,168,246],pan:0.52,inst:'cello',open:[36,43,50,57],sn:['C','G','D','A'],range:[36,66]}
];

const DMAJ=[2,4,6,7,9,11,1];
function thirdBelow(m){const pc=((m%12)+12)%12,i=DMAJ.indexOf(pc);if(i<0)return m-3;const t=DMAJ[(i+5)%7];let x=m-1;while(((x%12)+12)%12!==t)x--;return x;}

function buildScore(){
  const seq=[];
  seq.push({num:0,mel:"a4:.5^ d5:.5^",harm:[["R",1]],dyn:.72,sec:['Hauptthema','第1主題 ― 弱起で開始'],pickupBar:1});
  for(const pass of [1,2]) for(let n=1;n<=16;n++){
    const b=Object.assign({},T[n],{num:n,pass});
    b.pat=n<=8?(pass===1?'A1':'A2'):n<=12?'B':'C';
    b.dyn=n<=8?(pass===1?.8:.7):n<=11?.92:n===12?.8:.4;
    if(n===1&&pass===2) b.sec=['Wiederholung','反復 ― チェロはピッツィカート'];
    if(n===9) b.sec=['Überleitung','推移 ― イ長調へ'];
    if(n===13) b.sec=['Seitenthema','第2主題 ― チェロの歌'];
    seq.push(b);
  }
  for(let n=17;n<=23;n++){const b=Object.assign({},T[n-16],{num:n,pat:'A3',dyn:.86});if(n===17)b.sec=['Reprise','再現 ― 第2ヴァイオリンが3度下で寄り添う'];seq.push(b);}
  for(let n=24;n<=28;n++){const b=Object.assign({pat:'K'},T[n],{num:n,dyn:n>=27?1:.95});if(n===24)b.sec=['Coda','コーダ'];seq.push(b);}

  const notes={vn1:[],vn2:[],va:[],vc:[]}, bars=[];
  let B=0;
  const metric=(pos)=>{const k=Math.round(pos);if(Math.abs(pos-k)>0.01)return .88;return k===0?1:k===2?.95:.91;};
  const put=(pid,str,b0,base,barStart,extra)=>{
    let pos=b0;
    for(const tk of parse(str)){
      if(tk.m!==null){
        const rel=pos-barStart; let v=base*metric(rel);
        if(tk.pk) v=base*(0.84+0.1*(rel-Math.floor(rel)));
        if(tk.ac) v*=1.08;
        notes[pid].push(Object.assign({b:pos,d:tk.d,m:tk.m,st:tk.st,sl:tk.sl,pk:tk.pk,ac:tk.ac,tr:tk.tr,pz:false,vel:Math.min(1,v)},extra||{}));
      }
      pos+=tk.d;
    }
  };
  let prevPickup=false;
  for(const bar of seq){
    const beats=bar.harm.reduce((s,h)=>s+h[1],0);
    bars.push({b0:B,beats,num:bar.num,sec:bar.sec,pick:bar.pickupBar?[B,B+1]:bar.breath?[B+beats-1,B+beats]:null});
    // 第1ヴァイオリン（旋律）
    put('vn1',bar.mel,B,bar.dyn*(prevPickup?1.04:1),B);
    if(prevPickup&&notes.vn1.length){const lastDown=notes.vn1.find(n=>Math.abs(n.b-B)<1e-6);if(lastDown)lastDown.land=true;}
    if(bar.pat==='A3'){ // 3度下のハモり
      const s=parse(bar.mel).map(t=>t.m===null?`r:${t.d}`:null);
      let pos=B;
      for(const tk of parse(bar.mel)){ if(tk.m!==null){const rel=pos-B;notes.vn2.push({b:pos,d:tk.d,m:thirdBelow(tk.m),st:tk.st,sl:tk.sl,pk:tk.pk,ac:tk.ac,tr:false,pz:false,vel:bar.dyn*.62*metric(rel)});} pos+=tk.d; }
    }
    let hb=B;
    const acc=bar.pat==='C'?.34:bar.dyn*.42;
    for(const [cn,len] of bar.harm){
      if(cn!=='R'){
        const [c,va,v2]=CH[cn].map(toMidi);
        const P=bar.pat;
        const add=(pid,m,b,d,o)=>notes[pid].push(Object.assign({b,d,m,st:false,sl:false,pk:false,ac:false,tr:false,pz:false,vel:acc*metric(b-B)},o||{}));
        if(P==='hits'){ for(const [pid,m] of [['vn2',v2],['va',va],['vc',c]]) add(pid,m,hb,len,{ac:true,vel:.82}); }
        else if(P==='sus'){ for(const [pid,m] of [['vn2',v2],['va',va],['vc',c]]) add(pid,m,hb,len,{ac:true,fin:true,vel:.85}); }
        else{
          const off=(P==='B'||P==='C');
          for(const [pid,m] of [['vn2',v2],['va',va]]){
            if(pid==='vn2'&&P==='A3')continue;
            for(let k=0;k<len*2;k++){ if(off&&k%2===0)continue; add(pid,m,hb+k*.5,.5,{st:true}); }
          }
          if(!bar.vc&&P!=='C'){
            for(let k=0;k<len;k++) add('vc',c,hb+k,1,{st:P!=='A2',pz:P==='A2',vel:bar.dyn*(P==='A2'?.75:.62)*metric(hb+k-B)});
          }
        }
      }
      hb+=len;
    }
    if(bar.vc) put('vc',bar.vc,B,bar.pat==='C'?.62:bar.dyn*.7,B);
    if(bar.pat==='sus'){ notes.vn1.filter(n=>n.b>=B).forEach(n=>n.fin=true); }
    prevPickup=!!(bar.pickupBar||bar.breath);
    B+=beats;
  }
  for(const k in notes) notes[k].sort((a,b)=>a.b-b.b);
  // テンポ地図：弱起の前でわずかに“息”を取る、終止でリタルダンド
  const spb=60/112, beatDur=[];
  for(const bar of bars){
    for(let k=0;k<bar.beats;k++){
      let f=1;
      if(bar.num===0) f=1.1;
      else if(bar.pick&&k===bar.beats-1) f=1.12;
      if(bar.num===27) f=1+0.06*(k+1);
      if(bar.num===28) f=1.4;
      if(bar.num===26) f=1+0.015*k;

    }
  }
  const cum=[0]; for(const d of beatDur)cum.push(cum[cum.length-1]+d);
  const tAt=b=>{const i=Math.max(0,Math.min(beatDur.length-1,Math.floor(b)));return cum[i]+(b-i)*beatDur[i];};
  for(const bar of bars){bar.t0=tAt(bar.b0);bar.t1=tAt(bar.b0+bar.beats);bar.bt=[];for(let k=0;k<=bar.beats;k++)bar.bt.push(tAt(bar.b0+k));if(bar.pick)bar.pt=[tAt(bar.pick[0]),tAt(bar.pick[1])];}
  return {notes,bars,tAt,total:cum[cum.length-1]};
}

/* 演奏データ（音源イベント＋表示用データ）を作る */
const mtof=m=>440*Math.pow(2,(m-69)/12);
function perform(score){
  const out={};
  PARTS.forEach((P,pi)=>{
    const inst=INST[P.inst], src=score.notes[P.id], tAt=score.tAt;
    const vis=src.map(n=>Object.assign({},n,{t0:tAt(n.b),t1:tAt(n.b+n.d)}));
    // トリル展開
    const exp=[];
    for(const n of src){
      if(n.tr){
        const cnt=Math.max(4,Math.round(n.d*8)), sd=n.d/cnt, up=n.m+2, lo=n.m-2;
        for(let k=0;k<cnt;k++){const m=k===cnt-2?lo:(k%2===0?up:n.m);exp.push(Object.assign({},n,{b:n.b+k*sd,d:sd,m,tr:false,sl:k<cnt-1?true:n.sl,trill:true}));}
      } else exp.push(Object.assign({},n));
    }
    const ev=[], strokes=[]; let dir=1, pos=-0.7, cur=null;
    for(let i=0;i<exp.length;i++){
      const n=exp[i], prev=exp[i-1], next=exp[i+1];
      n.t0=tAt(n.b); n.t1=tAt(n.b+n.d);
      const legIn=!!(prev&&prev.sl&&!prev.pz&&!n.pz&&Math.abs(prev.b+prev.d-n.b)<1e-6);
      const legOut=!!(n.sl&&next&&!next.pz&&Math.abs(n.b+n.d-next.b)<1e-6);
      const f=mtof(n.m), dur=n.t1-n.t0;
      if(n.pz){ ev.push({t:n.t0,k:'pluck',f,v:0.35+0.4*n.vel}); n.tOff=n.t0+0.4; cur=null; continue; }
      const v=(0.05+0.17*n.vel)*(n.ac?1.12:1);
      const p=Math.min(0.95,0.36+0.32*n.vel+(n.ac?0.1:0)+(n.st?0.06:0));
      const a=n.st?0.012:n.ac?0.016:(n.pk?0.04:0.032);
      const longish=dur>0.32;
      ev.push({t:n.t0,k:'on',f,v,p,a,g:legIn?(n.trill?0.004:0.022):0,
        vib:n.trill?0:(longish?inst.vibDepth:inst.vibDepth*0.25),vd:legIn?0.02:0.13,bp:inst.beta*(0.92+0.16*Math.random())});
      n.v=v; n.p=p;
      if(!legOut){
        let gate=n.st?Math.min(dur,Math.max(0.075,dur*0.42)):n.fin?dur*1.0:dur*0.9;
        n.tOff=n.t0+gate;
        ev.push({t:n.tOff,k:'off',r:n.fin?0.6:n.st?0.025:0.07});
      }
      // 弓のストローク（表示用）
      if(!legIn){ dir=-dir; cur={t0:n.t0,t1:n.t0,dir,start:pos,st:n.st}; strokes.push(cur); }
      if(cur){ cur.t1=n.tOff||n.t1; }
      if(!legOut&&cur){ const travel=cur.st?0.14:Math.min(1.7,Math.max(0.2,(cur.t1-cur.t0)*1.15)); cur.end=Math.max(-1,Math.min(1,cur.start+cur.dir*travel)); pos=cur.end; }
    }
    for(let i=0;i<exp.length;i++){ if(exp[i].tOff===undefined){ let j=i; while(j<exp.length&&exp[j].tOff===undefined)j++; exp[i].tOff=j<exp.length?exp[j].tOff:exp[i].t1; } }
    // 弱起グループ（表示用）
    const groups=[];
    for(let i=0;i<vis.length;i++){ if(vis[i].pk&&!(vis[i-1]&&vis[i-1].pk)){ let j=i; while(j<vis.length&&vis[j].pk)j++; if(j<vis.length)groups.push({part:pi,from:vis.slice(i,j),to:vis[j],done:false}); } }
    out[P.id]={vis,exp,ev,strokes,groups};
  });
  return out;
}

function makeIR(ac){
  const sr=ac.sampleRate,len=Math.floor(sr*2.6),b=ac.createBuffer(2,len,sr);
  for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);let lp=0;
    for(let i=0;i<len;i++){const t=i/sr;const env=Math.exp(-t*3.1)*(t<0.015?t/0.015:1);const k=0.2+0.72*Math.min(1,t/1.8);lp+=(Math.random()*2-1-lp)*(1-k);d[i]=lp*env;}
    [0.011,0.017,0.023,0.031,0.038,0.047].forEach((et,j)=>{const ii=Math.floor((et+ch*0.0027)*sr);d[ii]+=(0.6-j*0.08)*(j%2?1:-1);});}
  return b;
}
async function initAudio(){

  master.connect(comp); comp.connect(ctx.destination);
  const conv=ctx.createConvolver(); conv.buffer=makeIR(ctx);
  const wet=ctx.createGain(); wet.gain.value=0.42; conv.connect(wet); wet.connect(master);
  const dry=ctx.createGain(); dry.gain.value=0.8; dry.connect(master);
  let useW=!!ctx.audioWorklet;
  if(useW){ try{ await ctx.audioWorklet.addModule(WORKLET_URL); }catch(e){ console.warn('worklet failed, fallback',e); useW=false; } }
  nodes=PARTS.map((P,i)=>{
    const opt=Object.assign({},INST[P.inst],{detune:Math.pow(2,((i-1.5)*0.7-2.4)/1200)});
    let node,post;
    if(useW){ node=new AudioWorkletNode(ctx,'bowed-string',{numberOfInputs:0,numberOfOutputs:1,outputChannelCount:[1],processorOptions:opt}); post=m=>node.port.postMessage(m); }
    else { const v=new BowedVoice(ctx.sampleRate,opt); node=ctx.createScriptProcessor(2048,1,1); node.onaudioprocess=e=>v.process(e.outputBuffer.getChannelData(0),e.playbackTime); post=m=>{if(m.type==='ev')v.push(m.ev);else v.clear();}; }
    const g=ctx.createGain(), an=ctx.createAnalyser(); an.fftSize=2048; an.smoothingTimeConstant=0.6;
    const pan=ctx.createStereoPanner(); pan.pan.value=P.pan;

    return {node,post,g,an,td:new Float32Array(2048),fd:new Uint8Array(1024),rms:0,muted:false};

}

      const pi=gp.part, x0=tx(a.t0), y0=laneY(pi,a.m), x1=tx(gp.to.t0), y1=laneY(pi,gp.to.m), top=Math.min(y0,y1)-lh*0.28;
      const passed=now>gp.to.t0; g.strokeStyle=passed?'rgba(255,220,140,.25)':'rgba(255,220,140,.8)'; g.lineWidth=1.3; g.setLineDash([3,3]);
      g.beginPath(); g.moveTo(x0,y0-6); g.quadraticCurveTo((x0+x1)/2,top,x1,y1-6); g.stroke(); g.setLineDash([]);
      const ang=Math.atan2((y1-6)-top,x1-(x0+x1)/2); g.fillStyle=g.strokeStyle; g.beginPath(); g.moveTo(x1,y1-5); g.lineTo(x1-7*Math.cos(ang-0.4),y1-5-7*Math.sin(ang-0.4)); g.lineTo(x1-7*Math.cos(ang+0.4),y1-5-7*Math.sin(ang+0.4)); g.fill();
      if(pi===0||pi===3){ g.font='10.5px "Noto Serif JP", serif'; g.fillStyle=passed?'rgba(255,220,140,.3)':'rgba(255,226,160,.9)'; g.fillText('弱起',x0-2,top-2); }
    } }
    // 音符
    PARTS.forEach((P,pi)=>{
      const vis=PF[P.id].vis, nh=Math.max(4,lh*0.8/(P.range[1]-P.range[0])*1.7);
      for(const n of vis){ if(n.t1<tMin)continue; if(n.t0>tMax)break;
        const x0=tx(n.t0), x1=Math.max(x0+3,tx(n.t1)-2), y=laneY(pi,n.m);
        const act=n.t0<=now&&now<n.t1, past=n.t1<=now;
        const al=act?1:past?.28:.78;
        if(n.pz){ g.fillStyle=rgba(P.color,al); g.beginPath(); g.moveTo(x0,y); g.lineTo(x0+nh*0.9,y-nh*0.9); g.lineTo(x0+nh*1.8,y); g.lineTo(x0+nh*0.9,y+nh*0.9); g.fill(); continue; }
        const gr=g.createLinearGradient(x0,0,x1,0); gr.addColorStop(0,rgba(act?[255,246,224]:P.color,al)); gr.addColorStop(1,rgba(P.color,al*0.55));
        g.fillStyle=gr; rr(x0,y-nh/2,x1-x0,nh,Math.min(nh/2,(x1-x0)/2)); g.fill();
        if(n.pk&&guide){ g.strokeStyle=past?'rgba(255,226,150,.3)':'rgba(255,232,170,.95)'; g.lineWidth=1.4; rr(x0-2,y-nh/2-2,x1-x0+4,nh+4,nh/2+2); g.stroke(); }
        if(n.tr){ g.strokeStyle=rgba(P.color,al); g.lineWidth=1; g.beginPath(); for(let x=x0+14;x<x1;x+=1){const yy=y-nh-4+Math.sin((x-x0)*0.7)*1.6;x===x0+14?g.moveTo(x,yy):g.lineTo(x,yy);} g.stroke(); g.fillStyle=rgba(P.color,al); g.font='italic 600 11px "Cormorant Garamond", serif'; g.fillText('tr',x0,y-nh-1); }
        if(n.st&&pi===0){ g.fillStyle=rgba(P.color,al); g.beginPath(); g.arc(x0+3,y-nh/2-4,1.4,0,7); g.fill(); }
        if(act){ g.globalCompositeOperation='lighter'; g.globalAlpha=0.55*(nodes[pi]&&nodes[pi].muted?0.2:1); const s=nh*7; g.drawImage(SPR[pi],px-s/2,y-s/2,s,s); g.globalAlpha=1; g.globalCompositeOperation='source-over'; }
      }
    });
  }
  // 再生ヘッド
  const ph=g.createLinearGradient(px-14,0,px+14,0); ph.addColorStop(0,'rgba(255,220,150,0)'); ph.addColorStop(.5,`rgba(255,230,170,${.2+bloom*.4})`); ph.addColorStop(1,'rgba(255,220,150,0)');
  g.fillStyle=ph; g.fillRect(px-14,rTop,28,rBot-rTop); g.fillStyle='rgba(255,236,190,.85)'; g.fillRect(px-0.5,rTop,1,rBot-rTop);
  // 粒子
  g.globalCompositeOperation='lighter';
  for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.02;p.vx*=0.985;p.life-=p.decay;if(p.life<=0){particles.splice(i,1);continue;}
    g.globalAlpha=p.life; const s=p.size*(0.6+p.life); g.drawImage(p.spr,p.x-s/2,p.y-s/2,s,s);}
  for(let i=rings.length-1;i>=0;i--){const r=rings[i];r.r+=2.2;r.life-=0.018;if(r.life<=0){rings.splice(i,1);continue;}
    g.globalAlpha=r.life*0.8; g.strokeStyle='rgba(255,226,150,1)'; g.lineWidth=1.5; g.beginPath(); g.arc(r.x,r.y,r.r,0,7); g.stroke();}
  g.globalAlpha=1; g.globalCompositeOperation='source-over';
  g.restore();
  g.strokeStyle='rgba(226,194,122,.25)'; g.lineWidth=1; rr(rL+.5,rTop+.5,rR-rL-1,rBot-rTop-1,10); g.stroke();
  return {px,tx};
}

function spawn(pi,x,y,count,spr,speed){for(let k=0;k<count;k++){const a=Math.random()*Math.PI*2,s=(0.4+Math.random())*speed;particles.push({x,y,vx:Math.cos(a)*s-0.6,vy:Math.sin(a)*s-0.3,life:1,decay:0.012+Math.random()*0.02,size:6+Math.random()*10,spr});}}

function updateTriggers(now,px){
  if(!PF)return;
  PARTS.forEach((P,pi)=>{const vis=PF[P.id].vis;while(ptr.vis[pi]<vis.length&&vis[ptr.vis[pi]].t0<=now){const n=vis[ptr.vis[pi]];ptr.vis[pi]++;
    if(now-n.t0<0.2&&!nodes[pi].muted){const melodic=(pi===0)||(pi===3&&!n.st&&!n.pz&&n.d>=0.5)||(pi===1&&n.sl);spawn(pi,px,laneY(pi,n.m),melodic?7:2,SPR[pi],melodic?2.2:1.2);}}});
  while(ptr.grp<allGroups.length&&allGroups[ptr.grp].to.t0<=now){const gp=allGroups[ptr.grp];ptr.grp++;
    if(now-gp.to.t0<0.25&&guide){const y=laneY(gp.part,gp.to.m);rings.push({x:px,y,r:4,life:1});spawn(gp.part,px,y,14,SPG,3);if(gp.part===0||gp.part===3)bloom=1;}}
}
function findCur(arr,pi,key,now){let i=ptr[key][pi];while(i<arr.length-1&&arr[i+1].t0<=now)i++;ptr[key][pi]=i;return arr[i]&&arr[i].t0<=now?arr[i]:null;}

function drawPanel(pi,now){
  const P=PARTS[pi], r=L.panels[pi], c=P.color, nd=nodes[pi], mob=L.mob;
  g.save(); rr(r.x,r.y,r.w,r.h,12);
  const bg=g.createLinearGradient(0,r.y,0,r.y+r.h); bg.addColorStop(0,'rgba(34,23,15,.86)'); bg.addColorStop(1,'rgba(14,10,7,.9)'); g.fillStyle=bg; g.fill();
  g.strokeStyle=rgba(c,nd&&nd.muted?.15:.35); g.lineWidth=1; g.stroke(); g.clip();
  // 情報
  let rms=0; if(nd){ nd.an.getFloatTimeDomainData(nd.td); let s=0; for(let i=0;i<nd.td.length;i+=2)s+=nd.td[i]*nd.td[i]; rms=Math.sqrt(s/(nd.td.length/2)); nd.rms=nd.rms*0.6+rms*0.4; rms=nd.rms; }
  const head=mob?30:38;
  g.fillStyle=rgba(c,.95); g.font=`italic 600 ${mob?14:18}px "Cormorant Garamond", serif`; g.fillText(P.name,r.x+12,r.y+(mob?18:24));
  if(!mob){ g.fillStyle='rgba(243,230,200,.5)'; g.font='10.5px "Noto Serif JP", serif'; g.fillText(P.jp,r.x+12,r.y+38); }
  const exp=PF?PF[P.id].exp:null;
  const n=exp?findCur(exp,pi,'exp',now):null;
  const sounding=n&&now<n.tOff+0.05;
  const m=n?n.m:P.open[1];
  let si=0; for(let k=0;k<4;k++) if(P.open[k]<=m) si=k;
  if(n){ g.textAlign='right'; g.fillStyle=sounding?'rgba(255,240,210,.95)':'rgba(243,230,200,.4)'; g.font=`${mob?13:16}px "Cormorant Garamond", serif`;
    g.fillText(`${nname(m)} · ${mtof(m).toFixed(1)} Hz`,r.x+r.w-12,r.y+(mob?18:24));
    if(!mob){ g.font='10.5px "Noto Serif JP", serif'; g.fillStyle='rgba(243,230,200,.5)'; g.fillText(n.pz?'pizz. 撥弦':`${P.sn[si]}線 · ${n.st?'staccato':n.sl||(exp[exp.indexOf(n)-1]||{}).sl?'legato':'détaché'}`,r.x+r.w-12,r.y+38); }
    g.textAlign='left'; }
  // 弦と指板
  const sTop=r.y+head+(mob?6:14), sBot=r.y+r.h-(mob?26:44), nutX=r.x+16, brX=r.x+r.w-22, sp=(sBot-sTop)/3;
  const fb=g.createLinearGradient(0,sTop-10,0,sBot+10); fb.addColorStop(0,'#17100b'); fb.addColorStop(.5,'#0c0805'); fb.addColorStop(1,'#17100b');
  g.fillStyle=fb; g.fillRect(nutX,sTop-sp*0.45,(brX-nutX)*0.7,sBot-sTop+sp*0.9);
  g.fillStyle='rgba(240,225,190,.5)'; g.fillRect(nutX-2,sTop-sp*0.45,3,sBot-sTop+sp*0.9);
  g.fillStyle='rgba(205,160,100,.75)'; rr(brX-3,sTop-sp*0.5,6,sBot-sTop+sp,3); g.fill();
  const fFrac=1-Math.pow(2,-(m-P.open[si])/12), fX=nutX+(brX-nutX)*fFrac;
  for(let k=0;k<4;k++){ const y=sBot-k*sp, active=k===si&&sounding;
    if(!active){ g.strokeStyle=k===si?rgba(c,.45):'rgba(200,190,170,.28)'; g.lineWidth=1+(3-k)*0.35; g.beginPath(); g.moveTo(nutX,y); g.lineTo(brX,y); g.stroke(); continue; }
    // 指から駒まで振動・指より手前は静止
    g.strokeStyle=rgba(c,.5); g.lineWidth=1.4; g.beginPath(); g.moveTo(nutX,y); g.lineTo(fX,y); g.stroke();
    const A=Math.min(sp*0.55,rms*sp*3.2+1), len=brX-fX;
    g.globalCompositeOperation='lighter';
    const lens=g.createLinearGradient(0,y-A,0,y+A); lens.addColorStop(0,rgba(c,0)); lens.addColorStop(.5,rgba(c,.38)); lens.addColorStop(1,rgba(c,0));
    g.fillStyle=lens; g.beginPath(); g.moveTo(fX,y); for(let j=0;j<=24;j++){const u=j/24;g.lineTo(fX+len*u,y-A*4*u*(1-u));} for(let j=24;j>=0;j--){const u=j/24;g.lineTo(fX+len*u,y+A*4*u*(1-u));} g.fill();
    // ヘルムホルツ運動（スローモーション）：角が放物線の包絡を周回
    const bowDirNow=PF?((PF[P.id].strokes[ptr.str[pi]]||{}).dir||1):1;
    const ph=((now*(0.7+(m-36)/40))%1+1)%1, phase=bowDirNow>0?ph:1-ph;
    let u,yc; if(phase<0.5){u=1-2*phase;yc=-A*4*u*(1-u);}else{u=2*phase-1;yc=A*4*u*(1-u);}
    if(n.pz){u=0.5;yc=A*Math.cos(now*9.0);}
    g.strokeStyle='rgba(255,246,226,.95)'; g.lineWidth=1.6; g.beginPath(); g.moveTo(fX,y); g.lineTo(fX+len*u,y+yc); g.lineTo(brX,y); g.stroke();
    g.globalAlpha=0.6; const s=22+A*3; g.drawImage(SPR[pi],fX+len*u-s/2,y+yc-s/2,s,s); g.globalAlpha=1;
    g.globalCompositeOperation='source-over';
    // 指
    g.fillStyle='rgba(255,240,215,.9)'; g.beginPath(); g.arc(fX,y,3.2,0,7); g.fill();
  }
  // 弓
  const strokes=PF?PF[P.id].strokes:null; bowState={dir:1};
  if(strokes&&strokes.length){
    const s=findCur(strokes,pi,'str',now);
    let bp=-0.7, onStr=false, dir=1;
    if(s){ const prog=Math.min(1,(now-s.t0)/Math.max(0.01,s.t1-s.t0)); bp=s.start+(s.end-s.start)*prog; onStr=now<=s.t1+0.02; dir=s.dir; }
    bowState={dir};
    const isPz=n&&n.pz&&sounding;
    const vibLen=brX-fX, bowX=Math.max(fX+10,brX-Math.max(16,vibLen*0.2))-(onStr?0:0);
    const bl=(sBot-sTop)*2.6+40, off=bp*(sBot-sTop)*0.75;
    const yTip=(sTop+sBot)/2-bl/2+off, yFrog=yTip+bl;
    g.globalAlpha=isPz?0.12:onStr?1:0.4;
    const lift=onStr?0:5;
    g.strokeStyle='rgba(245,236,214,.85)'; g.lineWidth=2.4; g.beginPath(); g.moveTo(bowX+lift,yTip); g.lineTo(bowX+lift,yFrog); g.stroke();
    g.strokeStyle='#6b3d1d'; g.lineWidth=2.6; g.beginPath(); g.moveTo(bowX+lift+1,yTip); g.quadraticCurveTo(bowX+lift+9,(yTip+yFrog)/2,bowX+lift+6,yFrog); g.stroke();
    g.fillStyle='#2a1a10'; g.fillRect(bowX+lift-1,yFrog-16,9,16); g.fillStyle='rgba(230,215,180,.8)'; g.fillRect(bowX+lift,yFrog-14,3,3);
    if(onStr&&!isPz){ const yC=sBot-si*sp; g.globalCompositeOperation='lighter'; g.globalAlpha=Math.min(1,0.3+rms*8); g.drawImage(SPW,bowX-10,yC-10,20,20); g.globalCompositeOperation='source-over'; }
    g.globalAlpha=1;
    if(!mob&&n&&!n.pz){ g.fillStyle='rgba(243,230,200,.55)'; g.font='10px "Noto Serif JP", serif';
      g.fillText(`弓速 ${(n.v||0).toFixed(3)}  弓圧 ${(n.p||0).toFixed(2)}  ${dir>0?'↓ダウン':'↑アップ'}`,r.x+12,r.y+r.h-30); }
  }
  // スペクトル
  if(nd){ nd.an.getByteFrequencyData(nd.fd); const bins=mob?28:44, sx=r.x+12, sw=r.w-24, sh=mob?14:18, sy=r.y+r.h-8, maxBin=Math.floor(4500/(ctx.sampleRate/2048));
    for(let k=0;k<bins;k++){ const a=Math.floor(Math.pow(k/bins,1.6)*maxBin)+1, b=Math.floor(Math.pow((k+1)/bins,1.6)*maxBin)+1; let v=0; for(let j=a;j<=b;j++)v=Math.max(v,nd.fd[j]); v=v/255;
      g.fillStyle=rgba(c,0.25+v*0.7); const h=Math.max(1,Math.pow(v,1.5)*sh); g.fillRect(sx+k*sw/bins,sy-h,sw/bins-1.5,h); } }
  if(nd&&nd.muted){ g.fillStyle='rgba(8,5,3,.6)'; g.fillRect(r.x,r.y,r.w,r.h); g.fillStyle='rgba(243,230,200,.8)'; g.font='13px "Noto Serif JP", serif'; g.textAlign='center'; g.fillText('ミュート中（クリックで解除）',r.x+r.w/2,r.y+r.h/2); g.textAlign='left'; }
  g.restore();
}
let bowState={dir:1};

function frame(){
  const now=playing?scoreNow():-1;
  let loud=0; for(const n of nodes) loud+=n.rms||0;
  bloom*=0.94;
  drawBackground(now,loud);
  drawHeader(now);
  const rb=drawRibbon(Math.max(-0.5,now));
  if(playing&&!paused) updateTriggers(now,rb.px);
  for(let i=0;i<4;i++) drawPanel(i,now);
  if(SC&&now>SC.total+0.6){
    const a=Math.min(1,(now-SC.total-0.6)/1.5);
    g.globalAlpha=a; g.fillStyle='#e2c27a'; g.textAlign='center'; g.font=`italic ${L.mob?34:52}px "Cormorant Garamond", serif`;
    g.fillText('Fine',W/2,(L.rTop+L.rBot)/2); g.font='13px "Noto Serif JP", serif'; g.fillStyle='rgba(243,230,200,.8)'; g.fillText('「⟲ 最初から」でもう一度',W/2,(L.rTop+L.rBot)/2+28); g.textAlign='left'; g.globalAlpha=1;
    if(!ended){ended=true;}
  }
  requestAnimationFrame(frame);
}

/* =====================================================================
   5. 操作
   ===================================================================== */
const bPlay=document.getElementById('bPlay'), bRe=document.getElementById('bRe'), bGuide=document.getElementById('bGuide');
document.getElementById('go').addEventListener('click',async e=>{
  e.target.disabled=true; e.target.textContent='調弦中…';
  try{ await initAudio(); if(ctx.state!=='running') await ctx.resume(); startPerformance();
    document.getElementById('intro').classList.add('hide'); document.getElementById('ctrl').style.display='flex';
  }catch(err){ console.error(err); e.target.textContent='音声を初期化できませんでした'; }
});
bPlay.onclick=async()=>{ if(!ctx)return; if(ended){startPerformance();return;} if(paused){await ctx.resume();paused=false;bPlay.textContent='❚❚ 停止';} else {await ctx.suspend();paused=true;bPlay.textContent='▶ 再開';} };
bRe.onclick=async()=>{ if(!ctx)return; if(ctx.state!=='running')await ctx.resume(); startPerformance(); };
bGuide.onclick=()=>{ guide=!guide; bGuide.classList.toggle('on',guide); };
cv.addEventListener('click',e=>{ if(!nodes.length)return; for(let i=0;i<4;i++){const r=L.panels[i]; if(e.clientX>=r.x&&e.clientX<=r.x+r.w&&e.clientY>=r.y&&e.clientY<=r.y+r.h){ const nd=nodes[i]; nd.muted=!nd.muted; nd.g.gain.setTargetAtTime(nd.muted?0:1,ctx.currentTime,0.03); } } });
addEventListener('resize',resize);
resize();
SC=buildScore(); PF=perform(SC); ptr={vis:[0,0,0,0],exp:[0,0,0,0],str:[0,0,0,0],grp:0};
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>{drawOrnament();});
requestAnimationFrame(frame);

/* 検証用：オフラインで1音を合成して音程と音量を測る */
window.__testNote=async(inst,midi,secs=1.6)=>{
  const sr=48000, oc=new OfflineAudioContext(1,Math.floor(sr*secs),sr);
  await oc.audioWorklet.addModule(WORKLET_URL);
  const f=mtof(midi);
  const n=new AudioWorkletNode(oc,'bowed-string',{numberOfInputs:0,numberOfOutputs:1,outputChannelCount:[1],
    processorOptions:Object.assign({},INST[inst],{ev:[{t:0.02,k:'on',f,v:0.18,p:0.6,a:0.03,g:0,vib:0,vd:0},{t:secs-0.3,k:'off',r:0.07}]})});
  n.connect(oc.destination); const buf=await oc.startRendering(); const d=buf.getChannelData(0);
  const a=Math.floor(sr*0.5), b=Math.floor(sr*(secs-0.35)); let s=0,pk=0,nan=false; for(let i=a;i<b;i++){s+=d[i]*d[i];pk=Math.max(pk,Math.abs(d[i]));if(!isFinite(d[i]))nan=true;}
  // 自己相関で基本周期
  const minL=Math.floor(sr/(f*1.5)), maxL=Math.ceil(sr/(f/1.5)); let best=0,bl=0;
  for(let l=minL;l<=maxL;l++){let c=0;for(let i=a;i<a+8192;i++)c+=d[i]*d[i+l];if(c>best){best=c;bl=l;}}
  const c0=(()=>{let c=0;for(let i=a;i<a+8192;i++)c+=d[i]*d[i+bl-1];return c;})(), c2=(()=>{let c=0;for(let i=a;i<a+8192;i++)c+=d[i]*d[i+bl+1];return c;})();
  const shift=0.5*(c0-c2)/(c0-2*best+c2); const est=sr/(bl+shift);
  let e0=0; for(let i=a;i<a+8192;i++)e0+=d[i]*d[i];
  return {inst,midi,target:+f.toFixed(2),est:+est.toFixed(2),cents:+(1200*Math.log2(est/f)).toFixed(1),rms:+Math.sqrt(s/(b-a)).toFixed(4),peak:+pk.toFixed(3),periodicity:+(best/e0).toFixed(3),nan};
};
