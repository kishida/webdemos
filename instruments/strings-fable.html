<script type="text/plain" id="worklet-src">
'use strict';
const CFG = [

  { key:'vn2', beta:0.132, pole:0.57, vibRate:5.4, vibDepth:0.0046, pizzT60:0.5, fc:8500, dry:0.16, gain:0.36, pan:-0.2,
    modes:[[282,11,.9],[448,16,1],[562,16,1],[720,9,.5],[980,7,.5],[1450,5,.45],[2450,2.6,.5],[3300,4,.22]] },
  { key:'va',  beta:0.128, pole:0.60, vibRate:5.2, vibDepth:0.0046, pizzT60:0.6, fc:7000, dry:0.16, gain:0.6, pan:0.22,
    modes:[[225,11,.9],[370,15,1],[452,15,1],[600,9,.55],[850,7,.5],[1200,5,.45],[2050,2.6,.55],[2900,4,.22]] },

];
const TUNE_C = -0.18;   // ループ全体の遅延補正（サンプル）
const N = 4096, M = N - 1, KICK = 0, START = 0.8;
const SCRATCH = 0.6;   // 発音時の噛みつき雑音の強さ
let RUB = globalThis.__RUB !== undefined ? globalThis.__RUB : 0.2;   // 弓の擦れの量

class Voice {
  constructor(sr) {
    this.sr = sr; this.nb = new Float32Array(N); this.bb = new Float32Array(N);
    this.wi = 0; this.active = false; this.released = true; this.pizz = false;
    this.y1 = 0; this.bowVel = 0; this.bowTarget = 0; this.bowRate = 0; this.slope = 2; this.contact = 0;
    this.base = 100; this.baseTarget = 100; this.vibAmt = 0; this.vibTarget = 0; this.vibPhase = 0; this.vibInc = 0;
    this.beta = 0.127; this.pole = 0.6; this.g = 0.95; this.offAt = 0; this.tail = 0; this.midi = 0; this.born = 0;
    this.pluckN = 0; this.pluckI = 0; this.pluckAmp = 0; this.nL = 80; this.bL = 12; this.nz = 0; this.dn = 0; this.wn1 = 0; this.sla = 0.15; this.rubK = 1; this.scr = 0; this.scrDecay = 0.999;
  }
  lenFor(freq) { return this.sr / freq - this.pole / (1 - this.pole) - TUNE_C; }
  start(freq, vel, dir, pizz, durS, cfg, midi, born) {
    this.nb.fill(0); this.bb.fill(0); this.y1 = 0; this.wi = 0;
    this.active = true; this.released = false; this.pizz = pizz; this.midi = midi; this.born = born;
    this.beta = cfg.beta; this.vibPhase = Math.random() * 6.28; this.vibInc = 2 * Math.PI * cfg.vibRate / this.sr; this.vibAmt = 0;
    if (pizz) {
      this.pole = 0.42; this.g = Math.exp(-6.91 / (freq * cfg.pizzT60));
      this.contact = 0; this.bowVel = 0; this.bowTarget = 0; this.vibTarget = 0;
      this.base = this.baseTarget = this.lenFor(freq);
      this.pluckN = Math.max(6, Math.round(this.base * 0.16)); this.pluckI = 0; this.pluckAmp = (0.25 + 0.75 * vel) * dir;
      this.tail = Math.round(cfg.pizzT60 * 1.3 * this.sr); this.released = true;
    } else {
      this.pole = cfg.pole; this.g = 0.95; this.contact = 1;
      this.base = this.baseTarget = this.lenFor(freq);
      this.bowTarget = dir * (0.02 + 0.19 * vel) * Math.min(1, Math.sqrt(520 / freq)); this.bowVel = this.bowTarget * START;
      this.pluckN = Math.max(4, Math.round(this.base * 0.12)); this.pluckI = 0; this.pluckAmp = this.bowTarget * KICK;
      this.bowRate = Math.abs(this.bowTarget) / ((durS > 0.4 ? 0.05 : 0.022) * this.sr);
      this.slope = 5 - 4 * (0.52 + 0.3 * vel);
      this.scr = (0.4 + 0.6 * vel) * SCRATCH * Math.min(1, durS / 0.4); this.rubK = Math.max(0.45, Math.min(1, Math.sqrt(durS / 0.3))); this.scrDecay = Math.exp(-1 / (0.03 * this.sr));
      this.vibTarget = durS > 0.3 ? cfg.vibDepth : 0;
    }
  }
  // 弓の返し: 遅延線（弦の振動）は消さず、弓の向きだけ反転させる
  rebow(freq, vel, dir, durS, cfg) {
    this.released = false; this.contact = 1;
    this.bowTarget = dir * (0.02 + 0.19 * vel) * Math.min(1, Math.sqrt(520 / freq));
    this.bowRate = Math.abs(this.bowTarget - this.bowVel) / (0.02 * this.sr) + 1e-9;
    this.slope = 5 - 4 * (0.62 + 0.33 * vel);
    this.scr = Math.max(this.scr, 0.25 * (0.4 + 0.6 * vel) * SCRATCH * Math.min(1, durS / 0.4));
    this.vibTarget = durS > 0.3 ? cfg.vibDepth : 0;
    this.rubK = Math.max(0.45, Math.min(1, Math.sqrt(durS / 0.3)));   // 短い弓ほど軽く
  }
  retune(freq, durS, cfg, midi) {
    this.baseTarget = this.lenFor(freq); this.midi = midi;
    this.vibTarget = durS > 0.3 ? cfg.vibDepth : 0;
  }
  release() {
    if (this.released) return;
    this.released = true; this.bowTarget = 0;
    this.bowRate = Math.abs(this.bowVel) / (0.045 * this.sr) + 1e-9;
    this.tail = Math.round(0.3 * this.sr);
  }
  tick() {
    this.dn = 0;
    if (this.released && --this.tail <= 0) { this.active = false; return 0; }
    const dB = this.bowTarget - this.bowVel;
    if (dB !== 0) this.bowVel = Math.abs(dB) <= this.bowRate ? this.bowTarget : this.bowVel + (dB > 0 ? this.bowRate : -this.bowRate);
    this.base += (this.baseTarget - this.base) * 0.004;
    this.vibAmt += (this.vibTarget - this.vibAmt) * 0.00012;
    this.vibPhase += this.vibInc;
    const total = this.base * (1 + this.vibAmt * Math.sin(this.vibPhase));
    const bL = Math.max(1.5, total * this.beta), nL = total - bL;
    this.nL = nL; this.bL = bL;
    const wi = this.wi, nb = this.nb, bb = this.bb;
    let p = wi - nL, i0 = Math.floor(p), fr = p - i0;
    const readN = nb[i0 & M] * (1 - fr) + nb[(i0 + 1) & M] * fr;
    p = wi - bL; i0 = Math.floor(p); fr = p - i0;
    const readB = bb[i0 & M] * (1 - fr) + bb[(i0 + 1) & M] * fr;
    this.y1 = this.g * (1 - this.pole) * readB + this.pole * this.y1;   // 駒での損失
    const bridgeRefl = -this.y1, nutRefl = -readN;
    let newVel = 0;
    if (this.contact > 0) {                                             // 弓の摩擦
      this.nz += (Math.random() - 0.5 - this.nz) * 0.2;
      const dv = this.bowVel * (1 + 0.5 * this.nz) - (bridgeRefl + nutRefl);
      let s = Math.abs((dv + 0.001) * this.slope) + 0.75;
      s = 1 / (s * s * s * s);
      if (s > 0.98) s = 0.98; else if (s < 0.01) s = 0.01;
      newVel = dv * s;
      // 松脂のざらつき: 滑っている間だけ摩擦力が揺らぐ（ピッチに同期した雑音パルス）＋ 発音時の噛みつき
      const wn = Math.random() * 2 - 1, slip = 1 - s / 0.98;
      this.sla += (slip - this.sla) * 0.001;
      const na = RUB * this.rubK * Math.abs(this.bowVel) * (0.12 + 0.88 * slip * Math.min(1, 0.16 / (this.sla + 1e-3)) + 1.5 * this.scr);
      this.scr *= this.scrDecay;
      newVel += na * wn * 0.08;                    // 弦の中へ（滑りのタイミングが揺れる）
      this.dn = na * (wn - this.wn1); this.wn1 = wn; // 駒へ直接届く高域成分
    }
    if (this.pluckI < this.pluckN) {                                    // ピチカート
      newVel += this.pluckAmp * 0.5 * (1 - Math.cos(2 * Math.PI * this.pluckI / this.pluckN)) * 1.2;
      this.pluckI++;
    }
    nb[wi & M] = bridgeRefl + newVel;
    bb[wi & M] = nutRefl + newVel;
    this.wi = wi + 1;
    return this.y1;
  }
  // 進行波から弦の変位形状（ヘルムホルツ運動）を復元する
  shape(out) {
    const K = out.length, nL = this.nL, bL = this.bL, half = (nL + bL) / 2, w = this.wi - 1, nb = this.nb, bb = this.bb;
    let y = 0;
    for (let k = 0; k < K; k++) {
      const dn = (k + 0.5) / K * half; let sl;
      if (dn < nL / 2) { const d = nL / 2 - dn; sl = nb[(w - Math.round(d)) & M] + nb[(w - Math.round(nL - d)) & M]; }
      else { const d = dn - nL / 2; sl = -(bb[(w - Math.round(d)) & M] + bb[(w - Math.round(bL - d)) & M]); }
      y += sl * half / K; out[k] = y;
    }
    for (let k = 0; k < K; k++) out[k] -= y * (k + 1) / K;
  }
}

class Instrument {
  constructor(sr, cfg) {
    this.sr = sr; this.cfg = cfg; this.voices = [0, 1, 2, 3].map(() => new Voice(sr));
    this.last = null; this.dir = 1; this.level = 0; this.lpy = 0; this.lpa = 1 - Math.exp(-2 * Math.PI * cfg.fc / sr);
    const n = cfg.modes.length; this.n = n;
    this.b0 = new Float64Array(n); this.a1 = new Float64Array(n); this.a2 = new Float64Array(n);
    this.z1 = new Float64Array(n); this.z2 = new Float64Array(n); this.mg = new Float64Array(n);
    cfg.modes.forEach(([f, q, g], k) => {
      const w = 2 * Math.PI * f / sr, al = Math.sin(w) / (2 * q), a0 = 1 + al;
      this.b0[k] = al / a0; this.a1[k] = -2 * Math.cos(w) / a0; this.a2[k] = (1 - al) / a0; this.mg[k] = g;
    });
    const a = (cfg.pan + 1) * Math.PI / 4; this.gl = Math.cos(a); this.gr = Math.sin(a);
    this.dcx = 0; this.dcy = 0; this.ny = 0;
  }
  noteOn(midi, vel, flags, durS, offAt, pos) {
    const freq = 440 * Math.pow(2, (midi - 69) / 12), cfg = this.cfg;
    const l = this.last;
    if ((flags & 1) && l && l.active && !l.released && !l.pizz) { l.retune(freq, durS, cfg, midi); l.offAt = offAt; return; }
    if (!(flags & 2)) for (const c of this.voices) if (c.active && !c.pizz && c.midi === midi) {   // 同じ音の連打
      if (!(flags & 4)) this.dir = -this.dir;
      c.rebow(freq, vel, this.dir, durS, cfg); c.offAt = offAt; c.born = pos; this.last = c; return;
    }
    let v = null;
    for (const c of this.voices) if (!c.active) { v = c; break; }
    if (!v) { for (const c of this.voices) if (c.released && (!v || c.born < v.born)) v = c; }
    if (!v) { for (const c of this.voices) if (!v || c.born < v.born) v = c; }
    if (!(flags & 4)) this.dir = -this.dir;
    v.start(freq, vel, this.dir, !!(flags & 2), durS, cfg, midi, pos);
    v.offAt = offAt; this.last = v;
  }

    let x = 1e-18, nz = 0;
    const vs = this.voices;
    for (let i = 0; i < 4; i++) { const v = vs[i]; if (v.active) { if (!v.released && pos >= v.offAt) v.release(); x += v.tick(); nz += v.dn; } }
    x += nz * 3.5;
    let y = this.cfg.dry * x;
    const b0 = this.b0, a1 = this.a1, a2 = this.a2, z1 = this.z1, z2 = this.z2, mg = this.mg;
    for (let k = 0; k < this.n; k++) {                                  // 胴の共鳴
      const o = b0[k] * x + z1[k];
      z1[k] = z2[k] - a1[k] * o; z2[k] = -b0[k] * x - a2[k] * o;
      y += mg[k] * o;
    }
    this.lpy += this.lpa * (y - this.lpy);
    this.ny += 0.6 * (nz - this.ny);
    const o = this.lpy - this.dcx + 0.995 * this.dcy; this.dcx = this.lpy; this.dcy = o;
    const out = (o + this.ny * 1.6) * this.cfg.gain, a = out < 0 ? -out : out;

<script>
'use strict';
/* ======================================================================
   楽譜 — Quartetto in Sol maggiore (Allegro), オリジナル・モーツァルト風

function strPt(k, f) {   // 弦k上の位置 (f=0 ナット, 1 駒)
  const xn = (k - 1.5) * 0.013, xb = (k - 1.5) * 0.032;
  return [xn + (xb - xn) * f, -0.62 + 1.22 * f];
}
function drawInstrument(L, now) {
  const { cx, by, s, i } = L, l = lv[i], F = frame.I[i];
  // 床の光だまり & 後光
  g.save(); g.globalCompositeOperation = 'lighter';
  let gr = g.createRadialGradient(cx, L.floor, 0, cx, L.floor, s * 0.9);
  gr.addColorStop(0, `rgba(${RGB[i]},${0.10 + 0.3 * l})`); gr.addColorStop(1, `rgba(${RGB[i]},0)`);
  g.save(); g.translate(cx, L.floor); g.scale(1, 0.16); g.translate(-cx, -L.floor); g.fillStyle = gr; g.fillRect(cx - s, L.floor - s, 2 * s, 2 * s); g.restore();
  gr = g.createRadialGradient(cx, by + s * 0.55, s * 0.1, cx, by + s * 0.55, s * 1.25);
  gr.addColorStop(0, `rgba(${RGB[i]},${0.05 + 0.34 * l})`); gr.addColorStop(1, `rgba(${RGB[i]},0)`);
  g.fillStyle = gr; g.fillRect(cx - s * 1.3, by - s * 0.8, s * 2.6, s * 2.7);
  g.restore();

  g.save(); g.translate(cx, by); g.scale(s, s);
  const breathe = 1 + 0.004 * l * Math.sin(now * 0.03);
  g.scale(breathe, breathe);
  const [w0, w1, w2] = WOOD[i];
  if (i === 3) { g.strokeStyle = '#b9b3a8'; g.lineWidth = 0.012; g.beginPath(); g.moveTo(0, 1); g.lineTo(0, 1.14); g.stroke(); }
  // ネック・糸巻・スクロール
  g.fillStyle = w2; g.fillRect(-0.03, -0.64, 0.06, 0.68);
  g.strokeStyle = w1; g.lineWidth = 0.018; g.lineCap = 'round';
  for (const [y, sd] of [[-0.66, -1], [-0.69, 1], [-0.72, -1], [-0.75, 1]]) { g.beginPath(); g.moveTo(0, y); g.lineTo(sd * 0.085, y); g.stroke(); }
  g.fillStyle = w1; g.beginPath(); g.roundRect(-0.034, -0.78, 0.068, 0.16, 0.02); g.fill();
  g.beginPath(); g.arc(0, -0.80, 0.045, 0, 7); g.fill();
  g.strokeStyle = w2; g.lineWidth = 0.008; g.beginPath();
  for (let a = 0; a < 9; a += 0.3) { const r = 0.004 + a * 0.0042; g.lineTo(Math.cos(a) * r, -0.80 + Math.sin(a) * r); } g.stroke();
  // 胴
  gr = g.createRadialGradient(-0.07, 0.42, 0.03, 0, 0.5, 0.72);
  gr.addColorStop(0, w0); gr.addColorStop(0.55, w1); gr.addColorStop(1, w2);
  g.shadowColor = `rgba(${RGB[i]},${0.25 + 0.6 * l})`; g.shadowBlur = (8 + 34 * l) * DPR;
  g.fillStyle = gr; g.fill(BODY); g.shadowBlur = 0;
  g.strokeStyle = 'rgba(30,8,2,.9)'; g.lineWidth = 0.012; g.stroke(BODY);
  g.save(); g.translate(0, 0.5); g.scale(0.93, 0.955); g.translate(0, -0.5); g.strokeStyle = 'rgba(20,6,2,.55)'; g.lineWidth = 0.006; g.stroke(BODY); g.restore();
  // ニスの艶
  g.save(); g.clip(BODY); gr = g.createLinearGradient(-0.4, 0, 0.3, 1);
  gr.addColorStop(0.18, 'rgba(255,240,210,0)'); gr.addColorStop(0.3, 'rgba(255,240,210,.20)'); gr.addColorStop(0.42, 'rgba(255,240,210,0)');
  g.fillStyle = gr; g.fillRect(-0.5, 0, 1, 1); g.restore();
  // f字孔
  g.strokeStyle = '#150603'; g.fillStyle = '#150603'; g.lineWidth = 0.016;
  for (const sd of [-1, 1]) {
    g.beginPath(); g.moveTo(0.125 * sd, 0.44); g.bezierCurveTo(0.075 * sd, 0.50, 0.195 * sd, 0.58, 0.145 * sd, 0.645); g.stroke();
    g.beginPath(); g.arc(0.135 * sd, 0.435, 0.013, 0, 7); g.arc(0.135 * sd, 0.65, 0.016, 0, 7); g.fill();
  }
  // 指板・テールピース・駒
  g.fillStyle = '#120c0b'; g.beginPath(); g.moveTo(-0.03, -0.63); g.lineTo(0.03, -0.63); g.lineTo(0.052, 0.36); g.lineTo(-0.052, 0.36); g.closePath(); g.fill();
  g.beginPath(); g.moveTo(-0.055, 0.70); g.lineTo(0.055, 0.70); g.lineTo(0.022, 0.94); g.lineTo(-0.022, 0.94); g.closePath(); g.fill();
  g.strokeStyle = '#e8cf9c'; g.lineWidth = 0.014; g.beginPath(); g.moveTo(-0.075, 0.60); g.lineTo(0.075, 0.60); g.stroke();
  // 弦
  const used = {}, act = [];
  for (const m of [...F.n].sort((a, b) => b - a)) {
    let k = 3; while (k > 0 && (OPEN[i][k] > m || used[k])) k--;
    if (used[k]) continue; used[k] = 1; act.push([k, m]);
  }
  g.lineCap = 'butt';
  for (let k = 0; k < 4; k++) {
    const a = strPt(k, 0), b = strPt(k, 1);
    g.strokeStyle = used[k] ? 'rgba(255,250,235,.25)' : 'rgba(235,228,210,.75)'; g.lineWidth = 0.0045 + (3 - k) * 0.0012;
    g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.lineTo((k - 1.5) * 0.022, 0.71); g.stroke();
  }
  for (const [k, m] of act) {            // 振動している弦
    const f = Math.max(0, Math.min(0.72, 1 - Math.pow(2, (OPEN[i][k] - m) / 12))), a = strPt(k, f), b = strPt(k, 1);
    const amp = (0.006 + 0.022 * l) * (1 - f * 0.6);
    g.save(); g.globalCompositeOperation = 'lighter'; g.shadowColor = COL[i]; g.shadowBlur = 10 * DPR;
    g.fillStyle = `rgba(${RGB[i]},.28)`; g.beginPath(); g.moveTo(a[0], a[1]);
    for (let q = 0; q <= 16; q++) { const u = q / 16; g.lineTo(a[0] + (b[0] - a[0]) * u + amp * Math.sin(Math.PI * u), a[1] + (b[1] - a[1]) * u); }
    for (let q = 16; q >= 0; q--) { const u = q / 16; g.lineTo(a[0] + (b[0] - a[0]) * u - amp * Math.sin(Math.PI * u), a[1] + (b[1] - a[1]) * u); }
    g.fill();
    g.strokeStyle = '#fff6df'; g.lineWidth = 0.006;
    for (const ph of [now * 0.045 + k, now * 0.071 + 2 * k]) {
      const sw = Math.sin(ph); g.beginPath(); g.moveTo(a[0], a[1]);
      for (let q = 1; q <= 16; q++) { const u = q / 16; g.lineTo(a[0] + (b[0] - a[0]) * u + amp * sw * Math.sin(Math.PI * u), a[1] + (b[1] - a[1]) * u); }
      g.stroke();

    g.restore();
  }
  // 弓
  const arco = !F.z && l > 0.04, on = arco ? 1 : 0;
  L.bowA = (L.bowA || 0) + (on - (L.bowA || 0)) * 0.12;
  const ba = L.bowA, BL = 1.12;
  g.save(); g.translate(0, 0.49 - (1 - ba) * 0.05); g.rotate(-0.13 + (1 - ba) * -0.25); g.translate(bowPos[i] * BL * 0.33 + (1 - ba) * 0.3, 0);
  g.globalAlpha = 0.35 + 0.65 * ba;
  g.strokeStyle = '#f4efe2'; g.lineWidth = 0.011; g.beginPath(); g.moveTo(-BL / 2, 0); g.lineTo(BL / 2, 0); g.stroke();
  g.strokeStyle = '#6a2c12'; g.lineWidth = 0.014; g.lineCap = 'round'; g.beginPath(); g.moveTo(-BL / 2, -0.012); g.quadraticCurveTo(0, -0.012, BL / 2, -0.04); g.stroke();
  g.fillStyle = '#1a0f0c'; g.fillRect(BL / 2 - 0.09, -0.042, 0.085, 0.042);
  g.fillStyle = '#6a2c12'; g.beginPath(); g.moveTo(-BL / 2, -0.02); g.lineTo(-BL / 2 - 0.025, 0.004); g.lineTo(-BL / 2 + 0.02, 0.004); g.fill();
  g.restore();
  g.restore();
}

function drawScope(L, now) {
  const { cx, i } = L, F = frame.I[i], l = lv[i];
  const y0 = L.floor + H * 0.078, w = Math.min(W * 0.17, 240), hh = H * 0.021;
  // ラベル
  g.textAlign = 'center'; g.fillStyle = `rgba(${RGB[i]},${0.7 + 0.3 * l})`;
  g.font = `italic 600 ${Math.max(13, H * 0.024)}px ${SERIF}`; g.fillText(NAMES[i], cx, L.floor + H * 0.036); const nw = g.measureText(NAMES[i]).width;
  const nn = F.n.length ? [...F.n].sort((a, b) => a - b).map(m => NN[m % 12] + (Math.floor(m / 12) - 1)).join(' ') + (F.z ? '  pizz.' : '') : '·';
  g.font = `${Math.max(10, H * 0.0155)}px ${SERIF}`; g.fillStyle = 'rgba(233,201,138,.6)'; g.textAlign = 'left'; g.fillText(nn, cx + nw / 2 + 9, L.floor + H * 0.036);
  // 弦のスコープ（ウェーブガイド内部状態から復元した弦の形）
  let mx = 0; for (const v of F.s) mx = Math.max(mx, Math.abs(v));
  peak[i] = Math.max(mx, peak[i] * 0.97, 1e-6);
  const h = hist[i]; if (L.lastS !== F.s) { L.lastS = F.s; h.push(F.s); if (h.length > 7) h.shift(); }
  g.fillStyle = 'rgba(233,201,138,.6)'; g.fillRect(cx - w / 2 - 2, y0 - 5, 2, 10); g.fillRect(cx + w / 2, y0 - 5, 2, 10);
  g.save(); g.globalCompositeOperation = 'lighter'; g.lineWidth = 1.4; g.lineJoin = 'round';
  h.forEach((sarr, q) => {
    g.strokeStyle = `rgba(${RGB[i]},${(q + 1) / h.length * (0.22 + 0.5 * Math.min(1, l * 1.5))})`;
    g.beginPath(); g.moveTo(cx - w / 2, y0);
    for (let k = 0; k < sarr.length; k++) g.lineTo(cx - w / 2 + (k + 1) / (sarr.length + 1) * w, y0 - sarr[k] / peak[i] * hh * Math.min(1, 0.25 + l));
    g.lineTo(cx + w / 2, y0); g.stroke();
  });
  g.restore();
}

function drawRibbon(t) {
  const y0 = H * 0.815, y1 = H * 0.955, x0 = 30, x1 = W - 30, laneH = (y1 - y0) / 4, pps = Math.max(90, W / 8.5), px = x0 + (x1 - x0) * 0.27;
  g.save(); g.beginPath(); g.rect(x0, y0 - 6, x1 - x0, y1 - y0 + 12); g.clip();
  for (let i = 0; i < 4; i++) {
    g.fillStyle = i % 2 ? 'rgba(233,201,138,.022)' : 'rgba(233,201,138,.045)'; g.fillRect(x0, y0 + i * laneH, x1 - x0, laneH);
  }
  // 小節線
  g.font = `italic ${Math.max(10, H * 0.014)}px ${SERIF}`; g.textAlign = 'left';
  SCORE.bars.forEach((b, k) => {
    const x = px + (b.t - t) * pps; if (x < x0 - 40 || x > x1 + 5) return;
    g.fillStyle = 'rgba(233,201,138,.2)'; g.fillRect(x, y0, 1, y1 - y0);
    g.fillStyle = 'rgba(233,201,138,.42)'; if (k + SCORE.off > 0) g.fillText(k + SCORE.off, x + 4, y0 - 0);
  });
  for (let i = 0; i < 4; i++) {
    const ns = SCORE.notes[i], R = RANGE[i], ly = y0 + i * laneH, nh = Math.max(3, laneH / (R[1] - R[0] + 3));
    for (const n of ns) {
      const xa = px + (n.t - t) * pps; if (xa > x1) break;
      const xb = px + (n.end - t) * pps; if (xb < x0) continue;
      const y = ly + laneH - 3 - (n.m - R[0] + 1) / (R[1] - R[0] + 2) * (laneH - 6);
      const on = t >= n.t && t < n.end + 0.02, past = t >= n.end;
      g.fillStyle = on ? '#fffaf0' : `rgba(${RGB[i]},${past ? 0.25 : 0.85})`;
      if (on) { g.shadowColor = COL[i]; g.shadowBlur = 14 * DPR; }
      g.beginPath();
      if (n.pizz) g.arc(xa + nh, y, nh * 0.9, 0, 7); else g.roundRect(xa, y - nh / 2, Math.max(2, xb - xa - 1), nh, nh / 2);
      g.fill(); g.shadowBlur = 0;
    }
  }
  // 再生位置
  const gr = g.createLinearGradient(px - 60, 0, px, 0); gr.addColorStop(0, 'rgba(255,240,200,0)'); gr.addColorStop(1, 'rgba(255,240,200,.13)');
  g.fillStyle = gr; g.fillRect(px - 60, y0, 60, y1 - y0);
  g.fillStyle = '#fff3d6'; g.shadowColor = '#ffcf7a'; g.shadowBlur = 12 * DPR; g.fillRect(px - 0.75, y0 - 6, 1.5, y1 - y0 + 12); g.shadowBlur = 0;
  g.restore();
  // 左右フェード
  for (const [xa, xb] of [[x0, x0 + 50], [x1, x1 - 70]]) {
    const f = g.createLinearGradient(xa, 0, xb, 0); f.addColorStop(0, 'rgba(8,5,10,1)'); f.addColorStop(1, 'rgba(8,5,10,0)');
    g.fillStyle = f; g.fillRect(Math.min(xa, xb), y0 - 8, Math.abs(xb - xa), y1 - y0 + 16);
  }
  // 進行バー
  const pr = Math.max(0, Math.min(1, (t - LEAD) / (SCORE.end - LEAD)));
  g.fillStyle = 'rgba(233,201,138,.18)'; g.fillRect(x0, H - 22, x1 - x0, 1);
  g.fillStyle = '#e9c98a'; g.fillRect(x0, H - 22.5, (x1 - x0) * pr, 2);
  g.beginPath(); g.arc(x0 + (x1 - x0) * pr, H - 21.5, 3, 0, 7); g.fill();
  for (const s of SCORE.secs) { const x = x0 + (x1 - x0) * (s.t - LEAD) / (SCORE.end - LEAD); g.fillStyle = 'rgba(233,201,138,.5)'; g.fillRect(x, H - 26, 1, 9); }
}
const RANGE = SCORE.notes.map(ns => [Math.min(...ns.map(n => n.m)), Math.max(...ns.map(n => n.m))]);
cv.addEventListener('click', e => {
  if (!started || e.clientY < H - 40) return;
  const f = Math.max(0, Math.min(1, (e.clientX - 30) / (W - 60)));
  node.port.postMessage({ type: 'seek', t: Math.max(0, LEAD + f * (SCORE.end - LEAD) - 0.05) });
  if (!frame.playing) node.port.postMessage({ type: 'play' });
});

function draw() {
  requestAnimationFrame(draw);
  const now = performance.now(), dt = Math.min(0.05, (now - lastNow) / 1000); lastNow = now;
  const t = frame.playing ? frame.t + Math.min(0.1, (now - frameAt) / 1000) : frame.t;
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  g.drawImage(bg, 0, 0, W, H);

  // 発音検出 → 火の粉と波紋
  const jump = t < lastT - 0.05 || t > lastT + 0.5;
  for (let i = 0; i < 4; i++) {
    const ns = SCORE.notes[i];
    if (jump) { let k = 0; while (k < ns.length && ns[k].t < t) k++; ptr[i] = k; }
    while (ptr[i] < ns.length && ns[ptr[i]].t <= t) {
      const n = ns[ptr[i]++], L = LAY[i], long = n.end - n.t;
      if (long > 0.2 || n.pizz) rings.push({ x: L.cx, y: L.by + L.s * 0.55, r: L.s * 0.3, a: n.pizz ? 0.55 : 0.32, i, v: L.s * (n.pizz ? 1.5 : 0.9) });
      const cnt = n.pizz ? 9 : long > 0.2 ? 5 : 2;
      for (let q = 0; q < cnt; q++) embers.push({ x: L.cx + (Math.random() - .5) * L.s * 0.3, y: L.by + L.s * (0.45 + Math.random() * 0.2), vx: (Math.random() - .5) * 60, vy: -30 - Math.random() * 90, life: 0, max: 1.2 + Math.random() * 1.8, i, r: 0.8 + Math.random() * 1.8 });
    }
    const target = Math.min(1, frame.I[i].l * 6.5);
    lv[i] += (target - lv[i]) * (target > lv[i] ? 0.35 : 0.1);
    if (!frame.I[i].z) bowPos[i] = Math.max(-1, Math.min(1, bowPos[i] + frame.I[i].d * dt * (0.5 + 2.2 * lv[i]) * (lv[i] > 0.04 ? 1 : 0)));
  }
  lastT = t;

  // スポットライト
  g.save(); g.globalCompositeOperation = 'lighter';
  for (const L of LAY) {
    const a = 0.05 + 0.2 * lv[L.i], gr = g.createLinearGradient(0, 0, 0, L.floor);
    gr.addColorStop(0, `rgba(${RGB[L.i]},${a})`); gr.addColorStop(1, `rgba(${RGB[L.i]},${a * 0.15})`);
    g.fillStyle = gr; g.beginPath(); g.moveTo(L.cx - W * 0.012, 0); g.lineTo(L.cx + W * 0.012, 0); g.lineTo(L.cx + L.s * 0.72, L.floor); g.lineTo(L.cx - L.s * 0.72, L.floor); g.fill();
  }
  // 塵
  const tot = (lv[0] + lv[1] + lv[2] + lv[3]) / 4;
  for (const d of dust) {
    d.y -= d.v * dt * (1 + 2 * tot); d.x += d.d * dt + Math.sin(now * 0.0006 + d.ph) * 0.12;
    if (d.y < -5) { d.y = H + 5; d.x = Math.random() * W; }
    g.fillStyle = `rgba(255,225,170,${0.10 + 0.14 * Math.sin(now * 0.0016 + d.ph) ** 2 + 0.15 * tot})`;
    g.beginPath(); g.arc(d.x, d.y, d.r, 0, 7); g.fill();
  }
  g.restore();

  for (const L of LAY) drawInstrument(L, now);

  g.save(); g.globalCompositeOperation = 'lighter';
  for (let k = rings.length - 1; k >= 0; k--) {
    const r = rings[k]; r.r += r.v * dt; r.a -= dt * 0.45; if (r.a <= 0) { rings.splice(k, 1); continue; }
    g.strokeStyle = `rgba(${RGB[r.i]},${r.a})`; g.lineWidth = 1.2; g.beginPath(); g.ellipse(r.x, r.y, r.r * 0.75, r.r, 0, 0, 7); g.stroke();
  }
  for (let k = embers.length - 1; k >= 0; k--) {
    const e = embers[k]; e.life += dt; if (e.life > e.max) { embers.splice(k, 1); continue; }
    e.vy -= 14 * dt; e.vx += Math.sin(now * 0.002 + e.x) * 20 * dt; e.x += e.vx * dt; e.y += e.vy * dt;
    const a = Math.sin(Math.PI * e.life / e.max);
    g.fillStyle = `rgba(${RGB[e.i]},${a * 0.85})`; g.beginPath(); g.arc(e.x, e.y, e.r * (0.6 + a), 0, 7); g.fill();
  }
  if (embers.length > 900) embers.splice(0, embers.length - 900);
  g.restore();

  for (const L of LAY) drawScope(L, now);
  drawRibbon(t);

  // 見出し
  g.textAlign = 'left'; g.fillStyle = '#f1dcae';
  g.font = `italic ${Math.max(20, H * 0.042)}px ${SERIF}`; g.fillText('Quartetto in Sol maggiore', 38, (W < 960 ? 76 : 30) + H * 0.035);
  g.font = `${Math.max(10, H * 0.015)}px ${SERIF}`; g.fillStyle = 'rgba(233,201,138,.6)';
  g.fillText('ALLEGRO  ·  ALLA MANIERA DI MOZART  ·  VERSIONE II — IN LEVARE', 40, (W < 960 ? 76 : 30) + H * 0.035 + Math.max(16, H * 0.026), W - 80);
  let sec = SCORE.secs[0]; for (const s of SCORE.secs) if (t >= s.t - 0.05) sec = s;
  let bar = 0; SCORE.bars.forEach((b, k) => { if (t >= b.t) bar = k + SCORE.off; });
  const yy = H * 0.797;
  g.font = `italic 600 ${Math.max(14, H * 0.025)}px ${SERIF}`; g.fillStyle = '#f1dcae'; g.fillText(sec.it, 38, yy);
  const wIt = g.measureText(sec.it).width;
  g.font = `${Math.max(10, H * 0.015)}px ${SERIF}`; g.fillStyle = 'rgba(233,201,138,.6)'; if (38 + wIt + 14 + g.measureText(sec.jp).width < W - 250) g.fillText(sec.jp, 38 + wIt + 14, yy);
  g.textAlign = 'right'; g.font = `italic ${Math.max(11, H * 0.017)}px ${SERIF}`;
  const tt = Math.max(0, t - LEAD), f2 = v => String(Math.floor(v)).padStart(2, '0');
  g.fillText(`battuta ${bar} / ${SCORE.bars.length - 1 + SCORE.off}   ·   ${Math.floor(tt / 60)}:${f2(tt % 60)}`, W - 38, yy);

  $('bPlay').textContent = frame.playing ? '❚❚' : '▶';
}
draw();
