<style>
:root{
  --red:#e8402f; --ink:#0d1219; --panel:rgba(15,20,28,.85);
  --line:#2a3442; --txt:#eef2f7; --sub:#93a1b3; --green:#8bff9f;

*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN",sans-serif;color:var(--txt)}
canvas{display:block}

/* ---------- 車窓の車内オーバーレイ ---------- */
#frame{position:fixed;inset:0;z-index:20;pointer-events:none;transition:opacity .8s ease}
body.overhead #frame{opacity:0}
#frame .sillTop{position:absolute;top:0;left:0;right:0;height:8.5vh;background:linear-gradient(#151a22,#0d1016);border-bottom:2px solid #1f2632}
#frame .sillBot{position:absolute;bottom:0;left:0;right:0;height:14vh;background:linear-gradient(#171d26,#0b0e13);border-top:2px solid #232b38}
#frame .pillarL{position:absolute;left:0;top:0;bottom:0;width:3vw;min-width:22px;background:linear-gradient(90deg,#0b0e13,#161c26 60%,#0e1218);box-shadow:inset -6px 0 12px rgba(0,0,0,.5)}
#frame .pillarDoor{position:absolute;left:20%;top:0;bottom:0;width:4.2vw;min-width:34px;
  background:linear-gradient(90deg,#0b0e13,#1b222e 45%,#0c1016);box-shadow:0 0 26px rgba(0,0,0,.55)}
#frame .reflect{position:absolute;inset:0;background:linear-gradient(112deg,transparent 40%,rgba(255,255,255,.04) 45%,rgba(255,255,255,.09) 47.5%,rgba(255,255,255,.025) 53%,transparent 58%)}
#frame .vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(4,7,11,.5) 100%)}
#frame .glassEdge{position:absolute;inset:0;box-shadow:inset 0 0 44px rgba(0,0,0,.5),inset 0 0 0 2px rgba(255,255,255,.04)}
#frame .rail{position:absolute;left:7%;right:7%;bottom:11.5vh;height:9px;border-radius:5px;
  background:linear-gradient(#eef1f5,#9aa4b0 55%,#6d7683);box-shadow:0 5px 12px rgba(0,0,0,.5)}
#frame .inSign{position:absolute;top:calc(8.5vh + 7px);left:50%;transform:translateX(-50%);
  background:#0a0d12;border:1px solid #262f3c;border-radius:6px;padding:5px 14px;
  font-family:"DotGothic16",monospace;font-size:clamp(10px,1.5vw,14px);letter-spacing:3px;color:#ff6255;
  text-shadow:0 0 8px rgba(255,80,60,.8);white-space:nowrap}
body.night #frame .inSign{box-shadow:0 0 18px rgba(255,80,60,.25)}

/* ---------- HUD ---------- */
.panel{position:fixed;z-index:30;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:14px 16px;box-shadow:0 10px 30px rgba(0,0,0,.35);
  opacity:0;transform:translateY(-10px);transition:opacity .8s ease .2s,transform .8s ease .2s;pointer-events:none}
body.ready .panel{opacity:1;transform:none}
body.overhead .panel{transform:translateX(-30px)}
body.overhead.ready .panel{transform:translateX(-30px)}
#hudTL{top:16px;left:16px;border-top:3px solid var(--red);max-width:min(360px,46vw)}
#hudTL .lineTag{display:inline-flex;align-items:center;gap:8px;background:var(--red);color:#fff;

#hudTL .lineEn{font-size:9px;letter-spacing:3px;color:#8b98a8;margin-top:6px}
#hudTL .title{font-family:"DotGothic16",monospace;font-size:19px;margin-top:6px;letter-spacing:1px}
#route{position:relative;width:100%;height:52px;margin-top:10px}
.rTrack{position:absolute;top:20px;left:2px;right:2px;height:3px;background:#39424f;border-radius:2px}
#rTrain{position:absolute;top:14px;left:0;width:17px;height:12px;background:#fff;border:2px solid var(--red);border-radius:4px}
.rSt{position:absolute;top:8px;transform:translateX(-50%);text-align:center;width:64px}
.rSt .num{display:block;font-family:"DotGothic16",monospace;font-size:10px;color:var(--red)}
.rSt .dotS{display:block;width:11px;height:11px;margin:3px auto;background:var(--red);border:2px solid #fff;border-radius:50%}
.rSt .nm{display:block;font-size:11px;color:#cfd8e3;margin-top:4px;white-space:nowrap}

#hudBL{bottom:16px;left:16px;border-top:3px solid var(--green);min-width:230px}
.spd{font-family:"DotGothic16",monospace;font-size:58px;line-height:1;color:var(--green);

.next{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;flex-wrap:wrap}
.next .nLbl{color:var(--sub);font-size:11px;letter-spacing:2px}

.next .dist{font-family:"DotGothic16",monospace;font-size:13px;color:#ffd23e}

#hudTR{top:16px;right:16px;display:flex;flex-direction:column;gap:8px;pointer-events:auto;padding:10px}
.btn{pointer-events:auto;cursor:pointer;font-family:inherit;font-size:13px;font-weight:700;letter-spacing:1px;
  color:#cfd8e3;background:#1b232e;border:1px solid #2c3644;border-radius:8px;padding:9px 14px;
  transition:transform .15s ease,border-color .2s,color .2s,background .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);border-color:var(--red);color:#fff}

.speedCtl{background:#1b232e;border:1px solid #2c3644;border-radius:8px;padding:9px 12px}
.speedCtl label{font-size:11px;color:var(--sub);letter-spacing:1px}
.speedCtl b{font-family:"DotGothic16",monospace;color:#ffd23e;font-size:15px}
.speedCtl input{width:130px;accent-color:var(--red);cursor:pointer;margin-top:4px}

#hudBR{bottom:16px;right:16px;display:flex;flex-direction:column;gap:8px;align-items:flex-end;padding:10px}
.seg{display:flex;gap:8px;pointer-events:auto}
.segBtn{min-width:104px;font-size:14px}
.hint{font-size:10.5px;color:#6d7a8c;text-align:right;letter-spacing:.5px;line-height:1.7}

#toast{position:fixed;top:18px;left:50%;transform:translate(-50%,-90px);z-index:60;
  background:rgba(15,20,28,.94);border-left:4px solid var(--red);border-radius:8px;

  box-shadow:0 12px 34px rgba(0,0,0,.5);transition:transform .45s cubic-bezier(.2,.9,.3,1.25),opacity .3s;opacity:0}
#toast.show{transform:translate(-50%,0);opacity:1}

/* ---------- 読み込み画面 ---------- */
#load{position:fixed;inset:0;z-index:100;background:var(--ink);display:flex;align-items:center;justify-content:center;
  transition:opacity .7s ease}
#load.hide{opacity:0;pointer-events:none}
.loadInner{text-align:center}
.loadLine{width:min(320px,70vw);height:3px;margin:0 auto 26px;background:repeating-linear-gradient(90deg,#3a4656 0 12px,transparent 12px 22px);position:relative;border-radius:2px}
.loadTrain{position:absolute;top:-15px;left:0;font-size:24px;animation:run 1.8s ease-in-out infinite alternate}
@keyframes run{from{transform:translateX(0)}to{transform:translateX(calc(min(320px,70vw) - 30px))}}
.loadTitle{font-family:"DotGothic16",monospace;font-size:26px;letter-spacing:6px;color:#fff}
.loadSub{font-size:12px;color:var(--sub);letter-spacing:4px;margin-top:8px}
.loadDots{margin-top:18px;display:flex;gap:8px;justify-content:center}
.loadDots i{width:8px;height:8px;border-radius:50%;background:var(--red);animation:blink 1.2s infinite}
.loadDots i:nth-child(2){animation-delay:.2s}.loadDots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,100%{opacity:.15}50%{opacity:1}}

@media (max-width:760px){
  #hudTL{max-width:60vw}#hudTL .title{font-size:15px}.spd{font-size:42px}
  .hint{display:none}#frame .pillarDoor{left:14%}
}

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";
if(!window.THREE){ document.getElementById('load').innerHTML='<div class="loadInner"><div class="loadTitle">Three.js の読み込みに失敗しました</div><div class="loadSub">通信環境をご確認ください</div></div>'; return; }

const TAU = Math.PI*2, PERIOD = 1600;
const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
renderer.setSize(innerWidth, innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xcfe0ee, 40, 1600);
const camera = new THREE.PerspectiveCamera(74, innerWidth/innerHeight, 0.1, 6000);

const hemi = new THREE.HemisphereLight(0xbcd9ff, 0x8aa06a, 0.75);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff1d6, 1.15);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, {left:-55, right:55, top:55, bottom:-55, near:20, far:280});
sun.shadow.bias = -0.0004;
scene.add(sun, sun.target);

/* ============================================================
   線路の曲線
============================================================ */
function trackX(s){
  return 22*Math.sin(TAU*s/PERIOD) + 7*Math.sin(2*TAU*s/PERIOD + 1.3) + 3.2*Math.sin(4*TAU*s/PERIOD + 0.6);
}
const _tp = new THREE.Vector3(), _tr = new THREE.Vector3(), _tt = new THREE.Vector3();
function trackPose(s){
  const tx = (trackX(s+2) - trackX(s-2))/4, tz = -1;
  const l = Math.hypot(tx, tz);
  _tt.set(tx/l, 0, tz/l);
  _tr.set(-_tt.z, 0, _tt.x);
  _tp.set(trackX(s), 0, -s);
  return {p:_tp, r:_tr, t:_tt, yaw: Math.atan2(-_tt.x, -_tt.z)};
}
class TrackCurve extends THREE.Curve{
  constructor(s0,s1,lat,y){ super(); this.s0=s0; this.s1=s1; this.lat=lat; this.y=y; }
  getPoint(t, target){
    target = target || new THREE.Vector3();
    const s = this.s0 + (this.s1-this.s0)*t, pose = trackPose(s);
    return target.set(pose.p.x + pose.r.x*this.lat, this.y, pose.p.z + pose.r.z*this.lat);
  }
}
function ribbon(s0, s1, lat0, lat1, y, segs){
  const pos=[], uv=[], idx=[];
  for(let i=0;i<=segs;i++){
    const s = s0 + (s1-s0)*i/segs, pose = trackPose(s);
    pos.push(pose.p.x+pose.r.x*lat0, y, pose.p.z+pose.r.z*lat0,
             pose.p.x+pose.r.x*lat1, y, pose.p.z+pose.r.z*lat1);
    uv.push(0, i/segs, 1, i/segs);
    if(i<segs){ const a=i*2; idx.push(a,a+1,a+2, a+1,a+3,a+2); }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv,2));
  const n = new Float32Array(pos.length); for(let i=0;i<n.length;i+=3) n[i+1]=1;
  g.setAttribute('normal', new THREE.BufferAttribute(n,3));
  g.setIndex(idx);
  return g;
}
function mergeGeoms(list){
  let vc=0, ic=0;
  list.forEach(g=>{ vc+=g.attributes.position.count; ic+=g.index.count; });
  const pos=new Float32Array(vc*3), nor=new Float32Array(vc*3), uv=new Float32Array(vc*2);
  const idx = new (vc>65535?Uint32Array:Uint16Array)(ic);
  let vo=0, io=0;
  list.forEach(g=>{
    pos.set(g.attributes.position.array, vo*3);
    nor.set(g.attributes.normal.array, vo*3);
    if(g.attributes.uv) uv.set(g.attributes.uv.array, vo*2);
    const gi=g.index.array;
    for(let i=0;i<gi.length;i++) idx[io+i]=gi[i]+vo;
    io+=gi.length; vo+=g.attributes.position.count;
  });
  const out=new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.BufferAttribute(pos,3));
  out.setAttribute('normal', new THREE.BufferAttribute(nor,3));
  out.setAttribute('uv', new THREE.BufferAttribute(uv,2));
  out.setIndex(new THREE.BufferAttribute(idx,1));
  return out;
}

/* ============================================================
   マテリアル
============================================================ */
const M = {
  ground:   new THREE.MeshLambertMaterial({color:0x74a45a}),
  ballast:  new THREE.MeshLambertMaterial({color:0x857f72}),
  rail:     new THREE.MeshPhongMaterial({color:0xb9bec4, shininess:70}),
  sleep:    new THREE.MeshLambertMaterial({color:0x4a4139}),
  concrete: new THREE.MeshLambertMaterial({color:0xc9cdd1}),
  white:    new THREE.MeshLambertMaterial({color:0xf1f3f5}),
  yellow:   new THREE.MeshLambertMaterial({color:0xe8b62a}),
  steel:    new THREE.MeshLambertMaterial({color:0x3c444e}),
  sand:     new THREE.MeshLambertMaterial({color:0xb3a27a}),
  road:     new THREE.MeshLambertMaterial({color:0x9aa0a6}),
  reed:     new THREE.MeshLambertMaterial({color:0x3c5f34}),
  water:    new THREE.MeshLambertMaterial({color:0x4e7fa8}),
  tunnel:   new THREE.MeshLambertMaterial({color:0x5c6169, side:THREE.BackSide}),
  portal:   new THREE.MeshLambertMaterial({color:0x8b9098, side:THREE.DoubleSide}),
  tLamp:    new THREE.MeshLambertMaterial({color:0x33261a, emissive:0xffb45c, emissiveIntensity:0.15}),
  sPanel:   new THREE.MeshLambertMaterial({color:0x8a8f96, emissive:0xffd9a0, emissiveIntensity:0.03}),
  bulb:     new THREE.MeshLambertMaterial({color:0x3a3428, emissive:0xffd9a0, emissiveIntensity:0.2}),
  crossR:   new THREE.MeshLambertMaterial({color:0x3a100c, emissive:0xff2b1f, emissiveIntensity:0.3}),
  sigG:     new THREE.MeshLambertMaterial({color:0x0f2a14, emissive:0x37ff6b, emissiveIntensity:0.9}),
  dark:     new THREE.MeshLambertMaterial({color:0x22262c}),
  litWin:   new THREE.MeshLambertMaterial({color:0x241a10, emissive:0xffbf78, emissiveIntensity:1, transparent:true, opacity:0}),
};

/* ============================================================
   テクスチャ
============================================================ */
const fontStack = '"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif';
function makeTex(w, h, draw){
  const c = document.createElement('canvas'); c.width=w; c.height=h;
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 4;
  draw(c.getContext('2d'), w, h); t.needsUpdate = true; return t;
}
const redraws = [];
function makeDotTex(w, h, draw){
  const c = document.createElement('canvas'); c.width=w; c.height=h;
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 4;
  const fn = ()=>{ draw(c.getContext('2d'), w, h); t.needsUpdate = true; };
  fn(); redraws.push(fn); return t;
}
if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>redraws.forEach(f=>f()));

const sideTex = makeTex(1024, 256, (ctx)=>{
  ctx.fillStyle='#f2f4f6'; ctx.fillRect(0,0,1024,256);
  ctx.fillStyle='#cfd4da'; ctx.fillRect(0,0,1024,26);
  ctx.fillStyle='#b9c0c8'; ctx.fillRect(0,232,1024,24);
  ctx.fillStyle='#d63a2e'; ctx.fillRect(0,190,1024,26);
  ctx.fillStyle='#1c2836'; ctx.fillRect(0,48,1024,88);
  ctx.save(); ctx.globalAlpha=.08; ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.moveTo(120,136); ctx.lineTo(340,48); ctx.lineTo(430,48); ctx.lineTo(210,136); ctx.fill();
  ctx.beginPath(); ctx.moveTo(560,136); ctx.lineTo(780,48); ctx.lineTo(830,48); ctx.lineTo(610,136); ctx.fill(); ctx.restore();
  [80, 854].forEach(x=>{
    ctx.fillStyle='#e8ebee'; ctx.fillRect(x,26,100,206);
    ctx.fillStyle='#16202c'; ctx.fillRect(x+10,52,80,74);
    ctx.fillStyle='#c3c9d1'; ctx.fillRect(x+48,26,3,206);
    ctx.fillStyle='#d63a2e'; ctx.fillRect(x,190,100,26);
  });
  ctx.fillStyle='#8b95a1'; ctx.font='24px '+fontStack; ctx.textAlign='center';
  ctx.fillText('クモハ 111', 512, 176);
});
const sideMat = new THREE.MeshPhongMaterial({map:sideTex, shininess:55});

const noseTex = makeDotTex(512, 512, (ctx)=>{
  ctx.fillStyle='#f2f4f6'; ctx.fillRect(0,0,512,512);
  ctx.fillStyle='#cfd4da'; ctx.fillRect(0,0,512,30);
  ctx.fillStyle='#0d1014'; ctx.fillRect(40,34,432,56);
  ctx.fillStyle='#ff5546'; ctx.font='34px "DotGothic16",monospace'; ctx.textAlign='center';
  ctx.fillText('快速 湖尻', 256, 74);
  ctx.fillStyle='#15202e';
  ctx.beginPath(); ctx.moveTo(60,104); ctx.lineTo(452,104); ctx.lineTo(424,232); ctx.lineTo(88,232); ctx.fill();
  ctx.fillStyle='#f2f4f6'; ctx.fillRect(252,104,8,128);
  ctx.strokeStyle='rgba(255,255,255,.25)'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(120,220); ctx.lineTo(230,120); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(400,220); ctx.lineTo(290,120); ctx.stroke();
  [[120,330],[392,330]].forEach(([x,y])=>{
    ctx.fillStyle='#fdf6d8'; ctx.beginPath(); ctx.arc(x,y,27,0,TAU); ctx.fill();
    ctx.strokeStyle='#d5d8dc'; ctx.lineWidth=5; ctx.stroke();
  });
  ctx.fillStyle='#d63a2e'; ctx.fillRect(0,400,512,46);
  ctx.fillStyle='#b9c0c8'; ctx.fillRect(0,446,512,66);
  ctx.fillStyle='#33383e'; ctx.fillRect(216,470,80,30);

function makeRings(count, rMin, rMax, hMin, hMax, color, snow){
  const g = new THREE.Group();
  for(let i=0;i<count;i++){
    const a = Math.random()*TAU, r = rMin + Math.random()*(rMax-rMin);
    const h = hMin + Math.random()*(hMax-hMin), rad = h*(0.7+Math.random()*0.6);
    const cone = new THREE.Mesh(new THREE.ConeGeometry(rad, h, 7), new THREE.MeshLambertMaterial({color}));
    cone.position.set(Math.cos(a)*r, h/2-4, Math.sin(a)*r);
    g.add(cone);
    if(snow && h > (hMin+hMax)*0.62){
      const cap = new THREE.Mesh(new THREE.ConeGeometry(rad*0.34, h*0.26, 7), new THREE.MeshLambertMaterial({color:0xeef2f6}));
      cap.position.set(cone.position.x, h - h*0.13, cone.position.z);
      g.add(cap);
    }
  }
  return g;
}

const dyn = [];
function addDyn(obj, s, lat, opt){
  opt = opt || {};
  const it = {s, lat, obj, y:opt.y||0, face:opt.face||'fwd'};
  placeDyn(it);
  obj.traverse(m=>{ if(m.isMesh) m.castShadow = !!opt.shadow; });
  scene.add(obj); dyn.push(it);
}
function placeDyn(it){
  const pose = trackPose(it.s);
  it.obj.position.set(pose.p.x + pose.r.x*it.lat, it.y, pose.p.z + pose.r.z*it.lat);
  it.obj.rotation.y = (it.face==='track')
    ? Math.atan2(Math.sign(it.lat)*pose.r.x, Math.sign(it.lat)*pose.r.z)
    : pose.yaw;
}
const R = (a,b)=> a + Math.random()*(b-a);

function treeGeoCanopy(kind){
  const list = [];
  if(kind==='cherry'){
    [[0,3.3,0,1.7],[1.1,2.8,0.5,1.2],[-1,2.9,-0.4,1.25],[0.3,2.6,-0.9,1.05]].forEach(([x,y,z,r])=>{
      const s = sph(r, 8, 6); s.translate(x,y,z); list.push(s);
    });
  } else if(kind==='conifer'){
    const c1 = new THREE.ConeGeometry(1.5, 2.4, 7); c1.translate(0,2.1,0); list.push(c1);
    const c2 = new THREE.ConeGeometry(1.05, 2.0, 7); c2.translate(0,3.7,0); list.push(c2);
  } else {
    [[0,3.0,0,1.5],[0.9,2.5,0.4,1.05],[-0.8,2.6,-0.3,1.0]].forEach(([x,y,z,r])=>{
      const s = sph(r, 8, 6); s.translate(x,y,z); list.push(s);
    });
  }
  return mergeGeoms(list);
}

function addPerson(s, lat, key){
  const g = makePerson();

  addDyn(g, s, lat, {
    y: 1.05,
    face: 'track',
    shadow: true
  });

  const it = dyn[dyn.length - 1];

  people.push({
    it,
    key,
    state: 'waiting',
    baseLat: lat,
    y: 1.05,
    t: 0,
    resetTimer: 0,
    phase: Math.random() * TAU
  });
}

function startBoarding(st){
  let started = false;

  for(const p of people){
    if(started) break;
    if(p.key !== st.num) continue;

    let d = (p.it.s - st.s) % PERIOD;
    if(d < 0) d += PERIOD;

    if((d < 12 || d > PERIOD - 12) && p.state === 'waiting'){
      p.state = 'boarding';
      p.t = 0;
      p.it.obj.visible = true;
      p.it.obj.rotation.z = 0;
      started = true;
    }
  }
}

function updatePeople(dt){
  const tn = performance.now() * 0.001;

  for(const p of people){
    if(p.state === 'waiting'){
      // 待機中の轻微な揺れ
      p.it.obj.position.y = p.y + Math.sin(tn * 2 + p.phase) * 0.02;
      p.it.obj.rotation.z = Math.sin(tn * 1.7 + p.phase) * 0.02;

    } else if(p.state === 'boarding'){
      // 乗り込みアニメーション
      p.t += dt / 1.8;

      const t = Math.min(1, p.t);
      const e = t * t * (3 - 2 * t);

      // 車両側へ移動
      p.it.lat = p.baseLat + (1.05 - p.baseLat) * e;
      p.it.y = p.y + (0.95 - p.y) * e;

      placeDyn(p.it);

      if(t >= 1){
        p.state = 'boarded';
        p.it.obj.visible = false;
        p.resetTimer = 3.0;
      }

    } else if(p.state === 'boarded'){
      // しばらくしてからまた待機する
      p.resetTimer -= dt;

      if(p.resetTimer <= 0){
        p.state = 'waiting';
        p.it.lat = p.baseLat;
        p.it.y = p.y;
        p.it.obj.visible = true;
        placeDyn(p.it);
      }
    }
  }
}

/* ============================================================
   運転シミュレーション(完全修正版)
============================================================ */
let sTrain = 60, v = 14, odometer = 0;
let vmax = 100/3.6, dayness = 1, dayTarget = 1;
let mode = 'win';

let dwell = false, dwellT = 0, lastAnnounce = null, arrived = false;
let dwellUntil = 0;
let currentStopIndex = -1;
let lastArrivedKey = null;
let lastDepartedKey = null;
let departOdometer = 0;
let stuckTime = 0;

const A_ACC = 0.9, A_DEC = 1.3;
const trainPos = new THREE.Vector3();
const tunnelLight = new THREE.PointLight(0xffd9a0, 0, 70, 1.5); scene.add(tunnelLight);

function distTo(st){
  let d = (st.s - sTrain) % PERIOD;
  if(d < 0) d += PERIOD;
  return d;
}

function nearestStop(){
  let best = null;
  for(const st of stops){
    const d = distTo(st);
    if(!best || d < best.d) best = {d, st};
  }
  return best;
}

function stopKey(st){
  return st ? (st.num || st.name) : null;
}

function getNextStop(){
  if(!stops || stops.length === 0) return null;
  if(currentStopIndex === -1 || currentStopIndex >= stops.length){
    return nearestStop();
  }
  const idx = (currentStopIndex + 1) % stops.length;
  const st = stops[idx];
  return { st, d: distTo(st) };
}

function getDrivingStop(){
  const base = getNextStop();
  if(!base || !stops || stops.length === 0) return base;

  const moved = odometer - departOdometer;

  if(lastDepartedKey && stopKey(base.st) === lastDepartedKey && moved < 100){
    let alt = null;
    for(const st of stops){
      if(stopKey(st) === lastDepartedKey) continue;
      const d = distTo(st);
      if(!alt || d < alt.d) alt = { st, d };
    }
    if(alt) return alt;
  }

  return base;
}

let toastTimer = 0;
const toastEl = document.getElementById('toast');

function toast(msg, ms){
  console.log('[ANN]', msg);
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  toastTimer = ms || 3200;
}

function tryArrive(st){
  if(dwell) return false;

  const key = stopKey(st);
  const moved = odometer - departOdometer;

  if(lastDepartedKey && key === lastDepartedKey && moved < 100){
    console.warn('[ARRIVE_IGNORE] 発車直後の同一駅を無視', {
      station: st.name,
      key,
      moved
    });
    return false;
  }

  const idx = stops.findIndex(x => stopKey(x) === key);
  if(idx !== -1) currentStopIndex = idx;

  lastArrivedKey = key;
  sTrain = st.s;
  arrived = true;
  dwell = true;
  dwellUntil = performance.now() + 2000;

  console.log('[ARRIVE]', {
    station: st.name,
    key,
    index: currentStopIndex,
    s: sTrain,
    odometer
  });

  toast('「' + st.name + '」に到着しました');

  if(typeof chime === 'function') chime();
startBoarding(st);
  return true;
}

function departTrain(){
  dwell = false;
  arrived = false;
  lastAnnounce = null;

  sTrain += 2.0;
  odometer += 2.0;
  v = Math.max(v, 1.0);

  lastDepartedKey = lastArrivedKey;
  departOdometer = odometer;
  stuckTime = 0;

  const next = getDrivingStop();

  console.log('[DEPART]', {
    station: currentStopIndex >= 0 && currentStopIndex < stops.length ? stops[currentStopIndex].name : null,
    key: lastDepartedKey,
    s: sTrain,
    odometer,
    v,
    next: next ? next.st.name : null,
    nextKey: next ? stopKey(next.st) : null,
    nextD: next ? next.d : null
  });

  toast('発車しました');
}

function stepDrive(dt){
  if(dwell){
    const now = performance.now();
    if(now >= dwellUntil || !isFinite(dwellUntil)){
      departTrain();
    }
    return;
  }

  const cand = getDrivingStop();
  const moved = odometer - departOdometer;
  const ignoringSame = !!(
    cand &&
    lastDepartedKey &&
    stopKey(cand.st) === lastDepartedKey &&
    moved < 100
  );

  if(cand && !ignoringSame && cand.d < 1.0){
    if(tryArrive(cand.st)) return;
  }

  const prev = sTrain;

  if(cand && !ignoringSame){
    if(cand.d < v*v/(2*A_DEC) + 0.3) v = Math.max(0, v - A_DEC*dt);
    else v = Math.min(vmax, v + A_ACC*dt);
  } else {
    v = Math.min(vmax, v + A_ACC*dt);
  }

  const ds = v * dt;
  sTrain += ds;
  odometer += ds;

  if(v < 0.01 && (!cand || cand.d > 2.0)){
    stuckTime += dt;
    if(stuckTime > 1.0){
      console.warn('[FAILSAFE] 停止状態から強制的に発進', {
        s: sTrain,
        odometer,
        next: cand ? cand.st.name : null,
        nextKey: cand ? stopKey(cand.st) : null,
        d: cand ? cand.d : null
      });
      v = 1.0;
      stuckTime = 0;
    }
  } else {
    stuckTime = 0;
  }

  if(cand && !ignoringSame){
    const dNow = distTo(cand.st);

    if(!arrived && dNow < 1.0 && v < 1.2){
      if(tryArrive(cand.st)) return;
    }

    if(!arrived && prev < cand.st.s && sTrain >= cand.st.s){
      if(tryArrive(cand.st)) return;
    }

    if(!arrived && v < 0.01 && cand.d < 8){
      if(tryArrive(cand.st)) return;
    }
  }

  if(cand && !ignoringSame){
    const dAnn = distTo(cand.st);
    if(dAnn < 320 && lastAnnounce !== cand.st && v > 1){
      lastAnnounce = cand.st;
      toast('次の停留場は ' + cand.st.name + ' です');
    }
  }
}

const orbit = {a:0, r:34, tilt:0.5};
const mouse = {x:0, y:0, tx:0, ty:0};
const camPos = new THREE.Vector3(), camLook = new THREE.Vector3(), camUp = new THREE.Vector3(0,1,0);
let camInit = false, fovCur = 74;
const qYaw = new THREE.Quaternion(), qRoll = new THREE.Quaternion(), qWin = new THREE.Quaternion();
const YAX = new THREE.Vector3(0,1,0), ZAX = new THREE.Vector3(0,0,1);
let bank = 0;

function updateCamera(dt){
  const vF = Math.min(1.25, v/27.8);
  const swayX = (Math.sin(sTrain*0.41) + Math.sin(sTrain*0.173+1.7)*0.6)*0.012*vF;
  const swayY = Math.sin(sTrain*0.29+0.5)*0.007*vF;
  const swayRoll = Math.sin(sTrain*0.21+2.1)*0.006*vF;
  bank = Math.max(-0.02, Math.min(0.02,
    (trackX(sTrain+8) - 2*trackX(sTrain) + trackX(sTrain-8)) * -(v*v*0.00002)));
  qYaw.setFromAxisAngle(YAX, trackPose(sTrain).yaw);
  qRoll.setFromAxisAngle(ZAX, bank + swayRoll*0.5);
  train.quaternion.copy(qYaw).multiply(qRoll);
  trainPos.set(trackX(sTrain), 0, -sTrain);
  train.position.copy(trainPos);

  let desPos, desLook, desUp, fovT;
  if(mode === 'win'){
    qWin.copy(qYaw).multiply(qRoll.setFromAxisAngle(ZAX, bank + swayRoll));
    desPos = new THREE.Vector3(0.55 + mouse.x*0.2 + swayX, 1.48 + mouse.y*0.1 + swayY, -13.8)
      .applyQuaternion(qWin).add(trainPos);
    desLook = new THREE.Vector3(0, 0.12, -80).applyQuaternion(qWin).add(trainPos);
    desUp = new THREE.Vector3(0,1,0).applyQuaternion(qWin);
    fovT = 74;
  } else {
    const ox = Math.sin(orbit.a), oz = Math.cos(orbit.a);
    const h = Math.sin(orbit.tilt), c = Math.cos(orbit.tilt);
    desPos = new THREE.Vector3(
      trainPos.x + ox*orbit.r*c,
      Math.max(2.5, orbit.r*h + 1.5),
      trainPos.z + oz*orbit.r*c);
    desLook = new THREE.Vector3(trainPos.x, 1.4, trainPos.z);
    desUp = new THREE.Vector3(0,1,0);
    fovT = 55;
  }
  if(!camInit){ camPos.copy(desPos); camLook.copy(desLook); camUp.copy(desUp); camInit = true; }
  const k = 1 - Math.exp(-3.2*dt);
  camPos.lerp(desPos, k); camLook.lerp(desLook, k);
  camUp.lerp(desUp, k).normalize();
  fovCur += (fovT - fovCur)*k;
  camera.fov = fovCur; camera.updateProjectionMatrix();
  camera.position.copy(camPos);
  camera.up.copy(camUp);
  camera.lookAt(camLook);
}

function initAudio(){
  AC = new (window.AudioContext || window.webkitAudioContext)();
  master = AC.createGain(); master.gain.value = 0; master.connect(AC.destination);
  const lp = AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=300;
  engG = AC.createGain(); engG.gain.value = 0.1;
  eng1 = AC.createOscillator(); eng1.type='sawtooth'; eng1.frequency.value=55;
  eng2 = AC.createOscillator(); eng2.type='sine'; eng2.frequency.value=110;
  const g2 = AC.createGain(); g2.gain.value = 0.4;
  eng1.connect(lp); eng2.connect(g2); g2.connect(lp); lp.connect(engG); engG.connect(master);
  eng1.start(); eng2.start();
  const buf = AC.createBuffer(1, AC.sampleRate*2, AC.sampleRate);
  const dd = buf.getChannelData(0);
  for(let i=0;i<dd.length;i++) dd[i] = Math.random()*2-1;
  const ns = AC.createBufferSource(); ns.buffer = buf; ns.loop = true;
  const bp = AC.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1100; bp.Q.value=0.7;
  rumG = AC.createGain(); rumG.gain.value = 0.04;
  ns.connect(bp); bp.connect(rumG); rumG.connect(master); ns.start();
}
function chime(){
  if(!AC || !soundOn) return;
  const ct = AC.currentTime;
  [[1318.5, 0, 0.24],[987.77, 0.26, 0.34]].forEach(([f,t,d])=>{
    const o = AC.createOscillator(), g = AC.createGain();
    o.type='sine'; o.frequency.value=f;
    g.gain.setValueAtTime(0, ct+t);
    g.gain.linearRampToValueAtTime(0.22, ct+t+0.02);
    g.gain.exponentialRampToValueAtTime(0.001, ct+t+d);
    o.connect(g); g.connect(master); o.start(ct+t); o.stop(ct+t+d+0.05);
  });
}

const clock = new THREE.Clock();
let time = 0;
function animate(){
  const dt = Math.min(0.05, clock.getDelta());

  stepDrive(dt);

  /* 区間ラップ(2周期分を走ったら1周期分巻き戻す) */

  /* 動態景観のリサイクル */
  dyn.forEach(it=>{
    if(it.s < sTrain - 90){
      it.s += PERIOD;
      if(it.ribbon){
        const r = it.ribbon;
        it.obj.geometry.dispose();
        it.obj.geometry = ribbon(r.s0 + (it.s - r.s0), r.s0 + (it.s - r.s0) + r.len, r.lat0, r.lat1, 0.055, 20);
        r.s0 = it.s;
      } else placeDyn(it);
    }
  });

  updateCamera(dt);
updatePeople(dt);
  const n = 1-dayness;
  M.crossR.emissiveIntensity = (Math.sin(time*7) > -0.2 ? 1 : 0.12)*(0.3 + 2.0*n);

  const sm = ((sTrain % PERIOD)+PERIOD)%PERIOD;
  const inTunnel = (sm>990 && sm<1130) ? 1 : 0;
  tunnelLight.intensity = 2.4*n*inTunnel;
  if(inTunnel){
    const pose = trackPose(sTrain);
    tunnelLight.position.set(trainPos.x - pose.t.x*12, 2.2, trainPos.z - pose.t.z*12);
  }

  mtnFar.position.set(trainPos.x*0.1, 0, trainPos.z*0.1);
  mtnNear.position.set(trainPos.x*0.22, 0, trainPos.z*0.22);
  cloudGroup.position.set(trainPos.x*0.05, 0, trainPos.z*0.05);
  cloudGroup.rotation.y += dt*0.004;
  ground.position.x = trainPos.x; ground.position.z = trainPos.z;
  sky.position.copy(camera.position);
  sunSpr.position.copy(camera.position).addScaledVector(sunDir, 2200);
  moonSpr.position.copy(camera.position).addScaledVector(moonDir, 2200);

  sun.position.copy(trainPos).addScaledVector(sunDir, 130);
  sun.target.position.copy(trainPos);
  sun.target.updateMatrixWorld();

  let d = sm; if(d > PERIOD-260) d -= PERIOD;
  petalMat.opacity = Math.max(0, Math.min(1, 1 - Math.abs(d-140)/190))*0.92;
  if(petalMat.opacity > 0.01){
    const p = petalGeo.attributes.position.array;
    for(let i=0;i<PETALS;i++){
      p[i*3+1] -= petalSpd[i]*dt;
      p[i*3]   += (Math.sin(time*1.3 + i)*0.5 + 0.6)*dt;
      if(p[i*3+1] < 0){ p[i*3+1] = 11; p[i*3] = R(-9,9); p[i*3+2] = R(-70,14); }
    }
    petalGeo.attributes.position.needsUpdate = true;
    petals.position.copy(trainPos);
    petals.quaternion.copy(train.quaternion);
  }

  mills.forEach(m=> m.obj.rotation.z += dt*m.sp);
  birds.forEach(b=>{
    const a = time*b.sp + b.ph;
    const cx = trainPos.x + b.off.x, cz = trainPos.z + b.off.z;
    const dx = -Math.sin(a)*b.r*b.sp, dz = Math.cos(a)*b.r*0.65*b.sp;
    b.g.position.set(cx + Math.cos(a)*b.r, b.off.y + Math.sin(a*0.7)*3, cz + Math.sin(a)*b.r*0.65);
    b.g.rotation.y = Math.atan2(-dx, -dz);
    const f = Math.sin(time*9 + b.ph)*0.7;
    b.wl.rotation.z = f; b.wr.rotation.z = -f;
  });

  if(Math.abs(dayness - dayTarget) > 0.001){
    dayness += (dayTarget - dayness)*Math.min(1, dt*0.8);
    applyDaylight(dayness);
  }

  if(AC && eng1){
    const vF = Math.min(1.4, v/27.8);
    master.gain.setTargetAtTime(soundOn ? 0.8 : 0, AC.currentTime, 0.2);
    eng1.frequency.setTargetAtTime(48 + vF*42, AC.currentTime, 0.2);
    eng2.frequency.setTargetAtTime(96 + vF*84, AC.currentTime, 0.2);
    engG.gain.setTargetAtTime(0.06 + 0.2*vF, AC.currentTime, 0.2);
    rumG.gain.setTargetAtTime(0.03 + 0.28*vF, AC.currentTime, 0.2);
  }

  const spd = Math.round(v*3.6);
  if(spd !== lastSpd){ spdEl.textContent = spd; lastSpd = spd; }
  if(time - lastHudT > 0.15){
    lastHudT = time;
    const nb = getDrivingStop();
    if(nb){
      nextEl.textContent = nb.st.name;
      distEl.textContent = dwell ? '停車中' : (nb.d < 40 ? 'まもなく' : Math.round(nb.d)+'m');
    }
    const pct = (((sTrain % PERIOD)+PERIOD)%PERIOD)/PERIOD*100;
    rTrainEl.style.left = 'calc('+pct+'% - 8px)';
    mouse.x += (mouse.tx - mouse.x)*0.06;
    mouse.y += (mouse.ty - mouse.y)*0.06;
  }
  if(toastTimer > 0){ toastTimer -= dt*1000; if(toastTimer <= 0) toastEl.classList.remove('show'); }

  renderer.render(scene, camera);
}
renderer.setAnimationLoop(animate);

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

setTimeout(()=>{
  document.getElementById('load').classList.add('hide');
  document.body.classList.add('ready');
  setTimeout(()=> toast('彩湖線 快速 湖尻行き — [Space] で視点切替できます'), 1200);
}, 900);
})();
</script>
</body>
</html>
