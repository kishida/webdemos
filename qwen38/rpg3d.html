<script type="module">
import * as THREE from 'three';

/* ================= AUDIO ================= */
let AC = null;
function ac(){ if(!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); return AC; }
function tone(f, d, type, v, slide){
  if(type === undefined) type = 'sine';
  if(v === undefined) v = .3;
  if(slide === undefined) slide = 0;
  const a = ac(), o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.value = f;
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), a.currentTime + d);
  g.gain.setValueAtTime(v, a.currentTime);
  g.gain.exponentialRampToValueAtTime(.001, a.currentTime + d);
  o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime + d);
}
function noise(d, v, fq){
  if(v === undefined) v = .4;
  if(fq === undefined) fq = 1000;
  const a = ac(), n = a.createBufferSource(), b = a.createBuffer(1, a.sampleRate * d, a.sampleRate);
  const ch = b.getChannelData(0);
  for(let i = 0; i < ch.length; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / ch.length);
  n.buffer = b;
  const f = a.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = fq;
  const g = a.createGain(); g.gain.value = v;
  n.connect(f).connect(g).connect(a.destination); n.start();
}
const SFX = {
  shoot: function(){ noise(.18, .5, 1400); tone(110, .14, 'sine', .4, -60); },
  hit: function(){ tone(220, .1, 'square', .25, -120); noise(.08, .25, 800); },
  hurt: function(){ tone(140, .2, 'sawtooth', .3, -70); },
  heal: function(){ tone(520, .15, 'sine', .25, 200); setTimeout(function(){ tone(700, .2, 'sine', .2, 200); }, 120); },
  coin: function(){ tone(900, .08, 'square', .15); setTimeout(function(){ tone(1300, .12, 'square', .15); }, 70); },
  level: function(){ [440,550,660,880].forEach(function(f, i){ setTimeout(function(){ tone(f, .2, 'triangle', .25); }, i * 110); }); },
  click: function(){ tone(600, .05, 'square', .12); },
  boom: function(){ noise(.5, .7, 300); tone(70, .4, 'sine', .5, -30); },
  talk: function(){ tone(400, .06, 'triangle', .15); },
  flee: function(){ tone(300, .2, 'sawtooth', .2, -150); }
};

/* ================= TEXTURES ================= */
function R(a, b){ return a + Math.random() * (b - a); }
function tex(size, fn, rx, ry){
  if(rx === undefined) rx = 1;
  if(ry === undefined) ry = 1;
  const c = document.createElement('canvas'); c.width = c.height = size;
  fn(c.getContext('2d'), size);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(rx, ry); t.anisotropy = 4;
  return t;
}
const stoneTex = tex(256, function(g, s){
  g.fillStyle = '#98958c'; g.fillRect(0, 0, s, s);
  for(let y = 0; y < 8; y++){
    for(let x = -1; x < 4; x++){
      const bx = x * 64 + (y % 2 ? 32 : 0), by = y * 32;
      g.fillStyle = 'hsl(' + R(35,50) + ',' + R(2,8) + '%,' + R(48,62) + '%)';
      g.fillRect(bx + 2, by + 2, 60, 28);
      g.fillStyle = 'rgba(0,0,0,.25)';
      for(let i = 0; i < 14; i++) g.fillRect(bx + R(2,58), by + R(2,26), R(1,3), R(1,3));
    }
  }
  g.strokeStyle = 'rgba(40,38,32,.6)'; g.lineWidth = 3;
  for(let y = 0; y <= 8; y++){ g.beginPath(); g.moveTo(0, y * 32); g.lineTo(s, y * 32); g.stroke(); }
});
const plasterTex = tex(128, function(g, s){
  g.fillStyle = '#efe6d2'; g.fillRect(0, 0, s, s);
  for(let i = 0; i < 500; i++){
    g.fillStyle = 'rgba(' + (R(120,170)|0) + ',' + (R(105,150)|0) + ',' + (R(80,120)|0) + ',.12)';
    g.fillRect(R(0,s), R(0,s), R(1,3), R(1,3));
  }
  for(let i = 0; i < 6; i++){
    g.fillStyle = 'rgba(90,80,60,.08)';
    g.beginPath(); g.arc(R(0,s), R(0,s), R(8,26), 0, 7); g.fill();
  }
});
const roofTex = tex(128, function(g, s){
  g.fillStyle = '#7a4028'; g.fillRect(0, 0, s, s);
  for(let y = 0; y < 16; y++){
    for(let x = -1; x < 8; x++){
      g.fillStyle = 'hsl(' + R(10,18) + ',' + R(38,52) + '%,' + R(26,40) + '%)';
      g.beginPath(); g.arc(x * 16 + (y % 2 ? 8 : 0), y * 8 + 8, 9, Math.PI, 0); g.fill();
    }
  }
  g.fillStyle = 'rgba(0,0,0,.3)';
  for(let y = 0; y < 16; y++) g.fillRect(0, y * 8, s, 2);
});
const woodTex = tex(128, function(g, s){
  g.fillStyle = '#5d4126'; g.fillRect(0, 0, s, s);
  for(let x = 0; x < 8; x++){
    g.fillStyle = 'hsl(' + R(24,32) + ',' + R(30,45) + '%,' + R(20,32) + '%)';
    g.fillRect(x * 16, 0, 15, s);
    g.strokeStyle = 'rgba(0,0,0,.35)';
    for(let i = 0; i < 5; i++){
      g.beginPath(); g.moveTo(x * 16 + R(2,13), 0);
      g.bezierCurveTo(x * 16 + R(0,16), s/3, x * 16 + R(0,16), 2*s/3, x * 16 + R(2,13), s);
      g.stroke();
    }
  }
});
const grassTex = tex(256, function(g, s){
  g.fillStyle = '#5a8a34'; g.fillRect(0, 0, s, s);
  for(let i = 0; i < 2600; i++){
    g.fillStyle = 'hsl(' + R(75,110) + ',' + R(35,55) + '%,' + R(24,42) + '%)';
    g.fillRect(R(0,s), R(0,s), R(1,3), R(2,5));
  }
  for(let i = 0; i < 10; i++){
    g.fillStyle = 'rgba(70,110,40,.25)';
    g.beginPath(); g.arc(R(0,s), R(0,s), R(14,40), 0, 7); g.fill();
  }
}, 46, 46);

/* ================= SCENE ================= */
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('game').appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xc2d8e8, 70, 420);
const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, .1, 900);
scene.add(camera);

const sunDir = new THREE.Vector3(-.45, .62, -.55).normalize();
const sun = new THREE.DirectionalLight(0xfff2d8, 2.4);
sun.position.copy(sunDir).multiplyScalar(180);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -130; sun.shadow.camera.right = 130;
sun.shadow.camera.top = 130; sun.shadow.camera.bottom = -130;
sun.shadow.camera.near = 20; sun.shadow.camera.far = 420;
sun.shadow.bias = -.0008;
scene.add(sun);
scene.add(new THREE.HemisphereLight(0xbcd8ff, 0x5a7a3a, .85));

// sky dome (blue sky)
{
  const g = new THREE.SphereGeometry(700, 24, 16);
  const m = new THREE.ShaderMaterial({
    side: THREE.BackSide, fog: false,
    uniforms: { sd: { value: sunDir } },
    vertexShader: 'varying vec3 vP;void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
    fragmentShader: 'varying vec3 vP;uniform vec3 sd;void main(){vec3 d=normalize(vP);float h=clamp(d.y,0.,1.);vec3 c=mix(vec3(.78,.88,.96),vec3(.18,.42,.85),pow(h,.55));float s=max(dot(d,sd),0.);c+=vec3(1.,.92,.7)*pow(s,420.)*1.6+vec3(1.,.85,.6)*pow(s,6.)*.18;gl_FragColor=vec4(c,1.);}'
  });
  scene.add(new THREE.Mesh(g, m));
}
// clouds
const clouds = [];
for(let i = 0; i < 7; i++){
  const g = new THREE.Group();
  const n = 3 + (Math.random() * 3 | 0);
  for(let j = 0; j < n; j++){
    const s = new THREE.Mesh(new THREE.SphereGeometry(R(6,13), 7, 6),
      new THREE.MeshBasicMaterial({ color:0xffffff, fog:true }));
    s.position.set(R(-14,14), R(-2,3), R(-6,6));
    s.scale.y = .45; g.add(s);
  }
  g.position.set(R(-260,260), R(70,110), R(-260,120));
  scene.add(g); clouds.push(g);
}

/* ================= TERRAIN ================= */
function roadX(z){ return 4 * Math.sin(z * .05); }
function groundH(x, z){
  let h = Math.sin(x * .02) * Math.cos(z * .017) * 1.3 + Math.sin(x * .05 + 1.7) * .5;
  const d = Math.abs(x - roadX(z));
  const flat = THREE.MathUtils.clamp((d - 7) / 20, 0, 1);
  h *= flat;
  const dx = x, dz = z + 175;
  h += 26 * Math.exp(-(dx * dx + dz * dz) / (140 * 140));
  return h;
}
{
  const g = new THREE.PlaneGeometry(520, 520, 160, 160);
  g.rotateX(-Math.PI / 2);
  const p = g.attributes.position;
  for(let i = 0; i < p.count; i++) p.setY(i, groundH(p.getX(i), p.getZ(i)));
  g.computeVertexNormals();
  const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ map:grassTex, roughness:1 }));
  m.receiveShadow = true; scene.add(m);
}
// road ribbon
{
  const pts = [];
  for(let z = 42; z >= -141; z -= 2){ const x = roadX(z); pts.push([x, groundH(x, z) + .07, z]); }
  const pos = [], col = [], idx = [];
  const cA = new THREE.Color(0x8a6a44), cB = new THREE.Color(0x6e5232);
  for(let i = 0; i < pts.length; i++){
    const a = pts[i];
    const prev = pts[Math.max(0, i - 1)], next = pts[Math.min(pts.length - 1, i + 1)];
    const tx = next[0] - prev[0], tz = next[2] - prev[2], tl = Math.hypot(tx, tz) || 1;
    const sx = -tz / tl * 2.3, sz = tx / tl * 2.3;
    pos.push(a[0] + sx, a[1], a[2] + sz, a[0] - sx, a[1], a[2] - sz);
    const c = (i % 2 ? cA : cB).clone().offsetHSL(0, 0, R(-.04, .04));
    col.push(c.r, c.g, c.b, c.r, c.g, c.b);
    if(i < pts.length - 1){
      const k = i * 2;
      idx.push(k, k+1, k+2, k+1, k+3, k+2);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ vertexColors:true, roughness:1 }));
  m.receiveShadow = true; scene.add(m);
}

/* ================= BUILDERS ================= */
function shadowed(m){ m.castShadow = true; m.receiveShadow = true; return m; }
const woodDark = new THREE.MeshStandardMaterial({ color:0x3a2a18, roughness:.9 });
const plaster = new THREE.MeshStandardMaterial({ map:plasterTex, roughness:.95 });
const stone = new THREE.MeshStandardMaterial({ map:stoneTex, roughness:.95 });
const roof = new THREE.MeshStandardMaterial({ map:roofTex, roughness:.9 });
const coneRed = new THREE.MeshStandardMaterial({ color:0x9a3a28, roughness:.7, side:THREE.DoubleSide });
function box(w, h, d, mat, x, y, z){
  if(x === undefined) x = 0; if(y === undefined) y = 0; if(z === undefined) z = 0;
  const m = shadowed(new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat));
  m.position.set(x, y, z); return m;
}

function makeHouse(){
  const g = new THREE.Group();
  const W = 6.4, D = 7.6, H1 = 3.1, H2 = 3.0;
  g.add(box(W, H1, D, stone, 0, H1 / 2, 0));
  g.add(box(W + .5, H2, D + .5, plaster, 0, H1 + H2 / 2, 0));
  function addB(w, h, d, x, y, z, rz){
    if(rz === undefined) rz = 0;
    const b = box(w, h, d, woodDark, x, y, z);
    b.rotation.z = rz; g.add(b);
  }
  for(const s of [-1, 1]){
    const z = s * (D + .5) / 2;
    addB(.22, H2 + 1, .16, -W / 2, H1 + H2 / 2, z);

    addB(W, .24, .16, 0, H1 + H2 - .2, z);
    addB(W, .18, .14, 0, H1 + H2 / 2, z);
    const dw = W * .42, dh = H2 * .5, dl = Math.hypot(dw, dh);

function makeFence(x1, z1, x2, z2){
  const g = new THREE.Group();
  const dx = x2 - x1, dz = z2 - z1;
  const len = Math.hypot(dx, dz);
  const n = Math.max(1, Math.round(len / 2.6));
  const dir = new THREE.Vector3(dx, 0, dz).normalize();
  const up = new THREE.Vector3(0, 1, 0);
  // 柱(垂直)
  for(let i = 0; i <= n; i++){
    const t = i / n;
    const px = x1 + dx * t, pz = z1 + dz * t;
    const p = new THREE.Mesh(new THREE.CylinderGeometry(.09, .11, 1.2, 6), woodDark);
    p.position.set(px, groundH(px, pz) + .6, pz);
    g.add(shadowed(p));
  }
  // 横木: 柱間ごとに分割し、地面の高さに追従
  for(const h of [.5, 1]){
    for(let i = 0; i < n; i++){
      const t0 = i / n, t1 = (i + 1) / n;
      const ax = x1 + dx * t0, az = z1 + dz * t0;
      const bx = x1 + dx * t1, bz = z1 + dz * t1;
      const segLen = Math.hypot(bx - ax, bz - az);
      const r = new THREE.Mesh(new THREE.CylinderGeometry(.05, .05, segLen, 5), woodDark);
      r.position.set((ax + bx) / 2, (groundH(ax, az) + groundH(bx, bz)) / 2 + h, (az + bz) / 2);
      r.quaternion.setFromUnitVectors(up, dir);   // ← 柵方向に正確に揃う
      g.add(shadowed(r));
    }
  }
  return g;
}

  if(document.pointerLockElement === renderer.domElement)
    hintEl.textContent = '視点捕捉中 (ESCで解除) / 左クリック: 射撃';
  else if(lockFailed)
    hintEl.textContent = '右ドラッグ or 矢印キーで回転 / 左クリック: 射撃';
  else
    hintEl.textContent = '画面クリックで視点捕捉 / 無効なら: 右ドラッグ or 矢印キーで回転';
}

function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }
function collide(px, pz){
  for(const c of obstacles.circles){
    const dx = px - c.x, dz = pz - c.z, d2 = dx * dx + dz * dz, r = c.r + .5;
    if(d2 < r * r){
      const d = Math.sqrt(d2) || .001;
      px = c.x + dx / d * r; pz = c.z + dz / d * r;
    }
  }
  for(const b of obstacles.boxes){
    const cx = clamp(px, b.minX, b.maxX), cz = clamp(pz, b.minZ, b.maxZ);
    let dx = px - cx, dz = pz - cz, d2 = dx * dx + dz * dz;
    if(d2 < .25){
      if(d2 > 1e-4){
        const d = Math.sqrt(d2);
        px = cx + dx / d * .5; pz = cz + dz / d * .5;
      } else {
        const l = px - b.minX, r = b.maxX - px, t = pz - b.minZ, bt = b.maxZ - pz;
        const m = Math.min(l, r, t, bt);
        if(m === l) px = b.minX - .5;
        else if(m === r) px = b.maxX + .5;
        else if(m === t) pz = b.minZ - .5;
        else pz = b.maxZ + .5;
      }
    }
  }
  return [px, pz];
}

const raycaster = new THREE.Raycaster();
function shoot(){
  if(fireCd > 0) return;
  fireCd = .55; SFX.shoot(); gunKick = 1;
  flash.visible = true; flashLight.intensity = 6;
  flash.position.set(0, .012, -.62);
  const wp = new THREE.Vector3();
  flash.getWorldPosition(wp);
  flashLight.position.copy(wp);
  raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
  const groups = enemies.map(function(e){ return e.g; });
  const hits = raycaster.intersectObjects(groups, true);
  if(hits.length){
    const h = hits[0];
    const line = new THREE.Line(
      new THREE.BufferGeometry().setFromPoints([wp, h.point]),
      new THREE.LineBasicMaterial({ color:0xffe080, transparent:true, opacity:.9 })
    );
    scene.add(line);
    setTimeout(function(){ scene.remove(line); }, 70);
    let o = h.object;
    while(o && !o.userData.enemy) o = o.parent;
    if(o){
      for(const e of enemies){
        if(e.g === o){ startBattle(e); break; }
      }
    }
  }
}

const bc = document.getElementById('bcv');
const bg = bc.getContext('2d');
const battle = {
  active:false, enemy:null, e:null,
  turn:'p', state:'menu',
  heroLunge:0, enLunge:0, heroFlash:0, enFlash:0,
  dmg:[], shake:0, enDead:0, defend:false
};
const bmenu = document.getElementById('bmenu');
function startBattle(e){
  document.exitPointerLock();
  mode = 'battle';
  const st = e.g.userData.enemy;
  battle.active = true;
  battle.enemy = e;
  battle.turn = 'p';
  battle.state = 'menu';
  battle.heroLunge = 0; battle.enLunge = 0; battle.enDead = 0; battle.defend = false;
  battle.e = { name:st.name, type:st.type, hp:st.hp, max:st.maxHp, atk:st.atk, xp:st.xp, gold:st.gold };
  battle.dmg = [];
  document.getElementById('battle').style.display = 'flex';
  showBMenu();
  SFX.talk();
}
function showBMenu(){
  bmenu.innerHTML = '';
  function mk(label, fn, dis){
    const b = document.createElement('button');
    b.className = 'dbtn';
    b.textContent = label;
    b.disabled = !!dis;
    if(dis) b.style.opacity = .4;
    b.onclick = function(){ if(dis) return; SFX.click(); fn(); };
    bmenu.appendChild(b);
  }
  mk('攻撃', function(){ playerAct('atk'); });
  mk('火の矢 (12MP)', function(){ playerAct('bolt'); }, P.mp < 12);
  mk('防御', function(){ playerAct('def'); });
  mk('ポーション ×' + P.potions, function(){ playerAct('pot'); }, P.potions <= 0 || P.hp >= P.maxHp);
  mk('逃走', function(){ playerAct('flee'); });
}
function bBtnsHide(){ bmenu.innerHTML = ''; }
function playerAct(a){
  if(battle.state !== 'menu') return;
  battle.state = 'anim';
  bBtnsHide();
  const E = battle.e;
  function doHit(mult){
    battle.heroLunge = 1;
    setTimeout(function(){
      const crit = Math.random() < .15;
      const d = Math.round((P.atk + R(-2, 3)) * mult * (crit ? 1.6 : 1));
      E.hp -= d;
      battle.enFlash = 1;
      addDmg(700, 180, d, crit, null);
      SFX.hit();
      battle.shake = crit ? 10 : 5;
      setTimeout(function(){
        if(E.hp <= 0){ E.hp = 0; winBattle(); return; }
        battle.state = 'enemy';
        setTimeout(enemyAct, 700);
      }, 450);
    }, 180);
  }
  if(a === 'atk') doHit(1.1);
  if(a === 'bolt'){ P.mp -= 12; doHit(1.9); SFX.boom(); }
  if(a === 'def'){
    battle.defend = true;
    setTimeout(function(){ battle.state = 'enemy'; setTimeout(enemyAct, 500); }, 400);
  }
  if(a === 'pot'){
    P.potions--;
    P.hp = Math.min(P.maxHp, P.hp + 40);
    SFX.heal();
    addDmg(280, 180, '+40', false, '#66ff66');
    setTimeout(function(){ battle.state = 'enemy'; setTimeout(enemyAct, 700); }, 500);
  }
  if(a === 'flee'){
    if(Math.random() < .6){ SFX.flee(); endBattle(true, false); return; }
    addDmg(500, 120, '失敗!', false, '#ff6666');
    setTimeout(function(){ battle.state = 'enemy'; setTimeout(enemyAct, 600); }, 500);
  }
  updateHUD();
}
function enemyAct(){
  if(!battle.active) return;
  battle.enLunge = 1;
  setTimeout(function(){
    let d = Math.round(battle.e.atk + R(-2, 3));
    if(battle.defend){ d = Math.ceil(d / 2); battle.defend = false; }
    P.hp -= d;
    battle.heroFlash = 1;
    addDmg(280, 180, d, false, null);
    SFX.hurt();
    battle.shake = 6;
    updateHUD();
    setTimeout(function(){
      if(P.hp <= 0){ P.hp = 0; loseBattle(); return; }
      battle.state = 'menu';
      showBMenu();
    }, 500);
  }, 180);
}
function addDmg(x, y, t, crit, col){
  battle.dmg.push({ x:x, y:y, t:String(t), life:1.2, crit:crit, col:col });
}
function winBattle(){
  battle.enDead = 1;
  SFX.coin();
  const E = battle.e;
  setTimeout(function(){
    P.gold += E.gold;
    P.xp += E.xp;
    P.kills++;
    while(P.xp >= P.lv * 50){
      P.xp -= P.lv * 50; P.lv++; P.maxHp += 16; P.maxMp += 6; P.atk += 3;
      P.hp = P.maxHp; P.mp = P.maxMp;
      SFX.level();
    }
    msg('勝利! ' + E.name + 'を討つ (+' + E.gold + 'G, +' + E.xp + 'XP)');
    battle.enemy.g.userData.enemy.dying = 1;
    updateHUD();
    updateQuest();
    setTimeout(function(){ endBattle(false, false); }, 1200);
  }, 900);
}
function loseBattle(){
  msg('倒れてしまった…');
  setTimeout(function(){ endBattle(false, true); }, 1000);
}
function endBattle(fled, dead){
  battle.active = false;
  document.getElementById('battle').style.display = 'none';
  const e = battle.enemy;
  if(!fled && !dead){
    scene.remove(e.g);
    enemies.splice(enemies.indexOf(e), 1);
    setTimeout(function(){
      const t = Math.random() < .5 ? 'bandit' : 'goblin';
      spawnEnemy(t, R(-20, 20), R(-40, 20));
    }, 90000);
  }
  if(dead){ P.hp = P.maxHp * .6; P.gold = Math.floor(P.gold / 2); P.x = 0; P.z = 34; }
  updateHUD();
  document.getElementById('returnVeil').classList.remove('hidden');
  mode = 'return';
}

function drawBattle(dt){
  const W = 1000, H = 560, t = performance.now() / 1000;
  bg.save();
  if(battle.shake > 0){
    bg.translate(R(-battle.shake, battle.shake), R(-battle.shake, battle.shake));
    battle.shake *= .85;
    if(battle.shake < .5) battle.shake = 0;
  }
  const sky = bg.createLinearGradient(0, 0, 0, 400);
  sky.addColorStop(0, '#3a5a8a'); sky.addColorStop(1, '#c8a070');
  bg.fillStyle = sky; bg.fillRect(0, 0, W, 400);
  bg.fillStyle = '#4a6a34';
  bg.beginPath(); bg.moveTo(0, 400);
  for(let x = 0; x <= W; x += 50) bg.lineTo(x, 340 + Math.sin(x * .01) * 30);
  bg.lineTo(W, H); bg.lineTo(0, H); bg.fill();
  bg.fillStyle = '#5a7a3a'; bg.fillRect(0, 420, W, H);
  bg.fillStyle = 'rgba(40,30,20,.5)';
  const sil = [[120,90],[820,110],[500,70]];
  for(const h of sil){
    bg.fillRect(h[0], 300, h[1], 120);
    bg.beginPath();
    bg.moveTo(h[0] - 10, 300);
    bg.lineTo(h[0] + h[1] / 2, 240);
    bg.lineTo(h[0] + h[1] + 10, 300);
    bg.fill();
  }
  const hx = 280 + battle.heroLunge * 180 + Math.sin(t * 3) * 2;
  const ex = 720 - battle.enLunge * 180;
  battle.heroLunge *= .85;
  battle.enLunge *= .85;
  drawHero(hx, 400, battle.heroFlash, t);
  if(battle.enDead < 1){
    battle.enDead = Math.min(1, battle.enDead + dt * 1.5);
    drawEnemy2D(ex, 400, battle.e.type, battle.enFlash, t, battle.enDead);
  }
  battle.heroFlash *= .85;
  battle.enFlash *= .85;
  drawBar(60, 60, 300, 18, P.hp, P.maxHp, '#c02020', '主人公 Lv.' + P.lv);
  drawBar(W - 360, 60, 300, 18, battle.e.hp, battle.e.max, battle.e.max > 50 ? '#8040c0' : '#c04020', battle.e.name);
  battle.dmg = battle.dmg.filter(function(d){ return d.life > 0; });
  for(const d of battle.dmg){
    d.life -= dt; d.y -= dt * 50;
    bg.globalAlpha = Math.min(1, d.life * 2);
    bg.font = (d.crit ? 'bold 44px' : 'bold 32px') + ' Cinzel,serif';
    bg.fillStyle = d.col || '#ffffff';
    bg.strokeStyle = '#000000';
    bg.lineWidth = 5;
    bg.strokeText(d.t, d.x - 30, d.y);
    bg.fillText(d.t, d.x - 30, d.y);
    bg.globalAlpha = 1;
  }
  bg.restore();
}
function drawBar(x, y, w, h, v, m, col, name){
  bg.fillStyle = 'rgba(0,0,0,.6)'; bg.fillRect(x - 4, y - 4, w + 8, h + 8);
  bg.fillStyle = '#222222'; bg.fillRect(x, y, w, h);
  bg.fillStyle = col; bg.fillRect(x + 2, y + 2, (w - 4) * Math.max(0, v / m), h - 4);
  bg.fillStyle = '#ffffff'; bg.font = '14px Cinzel,serif';
  bg.fillText(name + '  ' + Math.max(0, Math.ceil(v)) + '/' + m, x + 8, y + 14);
}

  bg.strokeRect(-22, -92, 44, 54);

  bg.fillStyle = '#e8c39e';
  bg.beginPath(); bg.arc(0, -108, 15, 0, 7); bg.fill();

  bg.beginPath(); bg.arc(0, -112, 16, Math.PI, 0); bg.fill();
  bg.fillStyle = '#c02030'; bg.fillRect(-3, -134, 6, 20);

  if(type === 'goblin'){
    bg.fillStyle = '#5a8a3a'; bg.fillRect(-18, -44, 36, 44);
    bg.fillStyle = '#6a9a4a'; bg.beginPath(); bg.arc(0, -60, 17, 0, 7); bg.fill();
    bg.beginPath(); bg.moveTo(-15, -60); bg.lineTo(-34, -70); bg.lineTo(-14, -50); bg.fill();
    bg.beginPath(); bg.moveTo(15, -60); bg.lineTo(34, -70); bg.lineTo(14, -50); bg.fill();
    bg.fillStyle = '#ff3020'; bg.fillRect(-8, -62, 5, 4); bg.fillRect(3, -62, 5, 4);
    bg.fillStyle = '#b8c0d0'; bg.fillRect(24, -52, 4, 26);
  } else if(type === 'guard'){
    bg.fillStyle = '#5a6a8a'; bg.fillRect(-22, -86, 44, 86);
    bg.fillStyle = '#8898b8'; bg.beginPath(); bg.arc(0, -100, 16, 0, 7); bg.fill();
    bg.fillStyle = '#ff3020'; bg.fillRect(-6, -104, 12, 5);
    bg.fillStyle = '#c8d0e0'; bg.fillRect(28, -96, 7, 70);
    bg.fillRect(20, -96, 24, 6);
  } else {
    bg.fillStyle = '#5a2a2a'; bg.fillRect(-18, -70, 36, 70);
    bg.fillStyle = '#d8a878'; bg.beginPath(); bg.arc(0, -82, 14, 0, 7); bg.fill();
    bg.fillStyle = '#2a1a1a'; bg.beginPath(); bg.arc(0, -86, 16, Math.PI, 0); bg.fill();
    bg.beginPath(); bg.moveTo(-16, -86); bg.lineTo(-16, -70); bg.lineTo(-8, -80); bg.fill();
    bg.fillStyle = '#ff3020'; bg.fillRect(-7, -84, 4, 3); bg.fillRect(3, -84, 4, 3);
    bg.fillStyle = '#b8c0d0'; bg.fillRect(24, -76, 5, 40);
  }
  if(fl > .05){ bg.globalAlpha = fl * .7; bg.fillStyle = '#ffffff'; bg.fillRect(-26, -110, 52, 114); }
  bg.globalAlpha = 1;
  bg.restore();
}

/* ================= MINIMAP ================= */
const mini = document.getElementById('mini').getContext('2d');
function drawMini(){
  const s = 150 / 260, ox = 75;
  mini.clearRect(0, 0, 150, 150);
  mini.fillStyle = '#1c2a18'; mini.fillRect(0, 0, 150, 150);
  function T(x, z){ return [ox + x * s, ox + (z + 130) * s * .55]; }
  mini.strokeStyle = '#8a6a44'; mini.lineWidth = 4;
  mini.beginPath();
  for(let z = 42; z >= -141; z -= 6){
    const p = T(roadX(z), z);
    if(z === 42) mini.moveTo(p[0], p[1]);
    else mini.lineTo(p[0], p[1]);
  }
  mini.stroke();
  mini.fillStyle = '#3a6a2a';
  const f1 = T(9.5, -46), f2 = T(30, 26);
  mini.fillRect(Math.min(f1[0], f2[0]), Math.min(f1[1], f2[1]), Math.abs(f2[0] - f1[0]), Math.abs(f2[1] - f1[1]));
  mini.fillStyle = '#c8a060';
  for(const h of houses){ const p = T(h[0], h[1]); mini.fillRect(p[0] - 4, p[1] - 4, 8, 8); }
  const cp = T(0, -175);
  mini.fillStyle = '#999999';
  mini.fillRect(cp[0] - 14, cp[1] - 8, 28, 14);
  mini.beginPath(); mini.arc(cp[0], cp[1] - 2, 5, 0, 7); mini.fill();
  mini.fillStyle = '#ff3333';
  for(const e of enemies){
    const p = T(e.g.position.x, e.g.position.z);
    if(p[0] > 2 && p[0] < 148 && p[1] > 2 && p[1] < 148){
      mini.beginPath(); mini.arc(p[0], p[1], 2.5, 0, 7); mini.fill();
    }
  }
  const pp = T(P.x, P.z);
  mini.save();
  mini.translate(pp[0], pp[1]);
  mini.rotate(-P.yaw + Math.PI);
  mini.fillStyle = '#ffffff';
  mini.beginPath(); mini.moveTo(0, -6); mini.lineTo(4, 5); mini.lineTo(-4, 5); mini.fill();
  mini.restore();
}

/* ================= LOOP ================= */
const clock = new THREE.Clock();
function loop(){
  requestAnimationFrame(loop);
  const dt = Math.min(.05, clock.getDelta());
  const t = performance.now() / 1000;

  for(let i = 0; i < clouds.length; i++){
    clouds[i].position.x += dt * (1 + i * .2);
    if(clouds[i].position.x > 300) clouds[i].position.x = -300;
  }
  castle.userData.flag.rotation.y = Math.sin(t * 2) * .25;

  for(let idx = 0; idx < enemies.length; idx++){
    const e = enemies[idx];
    const st = e.g.userData.enemy;
    if(st.dying){ e.g.rotation.x = Math.max(-1.5, e.g.rotation.x - dt * 4); continue; }
    if(st.stun > 0){ st.stun -= dt; continue; }
    const dx = camera.position.x - e.g.position.x;
    const dz = camera.position.z - e.g.position.z;
    const dist = Math.hypot(dx, dz);
    if(dist < 9){
      e.g.rotation.y = Math.atan2(dx, dz);
      if(dist < 4 && mode === 'play'){ startBattle(e); continue; }
    }
    if(e.wait > 0){ e.wait -= dt; continue; }
    const tx = e.tx - e.g.position.x, tz = e.tz - e.g.position.z;
    const td = Math.hypot(tx, tz);
    if(td < 1){
      e.tx = e.home[0] + R(-6, 6);
      e.tz = e.home[1] + R(-6, 6);
      e.wait = R(1, 4);
      continue;
    }
    e.g.rotation.y = Math.atan2(tx, tz);
    const sp = 1.6 * dt;
    let nx = e.g.position.x + tx / td * sp;
    let nz = e.g.position.z + tz / td * sp;
    const res = collide(nx, nz);
    e.g.position.x = res[0];
    e.g.position.z = res[1];
  }

  if(bomb){
    bomb.v.y -= 20 * dt;
    bomb.m.position.addScaledVector(bomb.v, dt);
    if(bomb.m.position.y < groundH(bomb.m.position.x, bomb.m.position.z) + .12){
      SFX.boom();
      const l = new THREE.PointLight(0xff8030, 30, 12);
      l.position.copy(bomb.m.position);
      scene.add(l);
      setTimeout(function(){ scene.remove(l); }, 200);
      for(const e of enemies){
        if(e.g.position.distanceTo(bomb.m.position) < 7) e.g.userData.enemy.stun = 4;
      }
      scene.remove(bomb.m);
      bomb = null;
    }
  }

  if(mode === 'play'){
    const rotSp = 2.2 * dt;
    if(keys.ArrowLeft)  P.yaw += rotSp;
    if(keys.ArrowRight) P.yaw -= rotSp;
    if(keys.ArrowUp)    P.pitch += rotSp;
    if(keys.ArrowDown)  P.pitch -= rotSp;
    P.pitch = clamp(P.pitch, -1.35, 1.35);

    const f = new THREE.Vector3(-Math.sin(P.yaw), 0, -Math.cos(P.yaw));
    const r = new THREE.Vector3(-f.z, 0, f.x);
    let mx = 0, mz = 0;
    if(keys.KeyW){ mx += f.x; mz += f.z; }
    if(keys.KeyS){ mx -= f.x; mz -= f.z; }
    if(keys.KeyD){ mx += r.x; mz += r.z; }
    if(keys.KeyA){ mx -= r.x; mz -= r.z; }
    const ml = Math.hypot(mx, mz);
    if(ml > 0){
      mx /= ml; mz /= ml;
      const sp = P.speed * (keys.ShiftLeft ? 1.6 : 1) * dt;
      let nx = P.x + mx * sp, nz = P.z + mz * sp;
      const res = collide(nx, nz);
      P.x = res[0]; P.z = res[1];
      P.bob += sp * 2.2;
    }
    P.x = clamp(P.x, -240, 240);
    P.z = clamp(P.z, -240, 240);
    const gy = groundH(P.x, P.z) + 1.7;
    P.y += (gy - P.y) * Math.min(1, dt * 12);
    camera.position.set(P.x, P.y + Math.sin(P.bob * 2) * .03 * (ml > 0 ? 1 : 0), P.z);
    camera.rotation.set(P.pitch, P.yaw, 0, 'YXZ');
    fireCd = Math.max(0, fireCd - dt);
    raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
    const groups = enemies.map(function(e){ return e.g; });
    const h = raycaster.intersectObjects(groups, true)[0];
    document.getElementById('cross').classList.toggle('target', !!h);
  }

  gunKick *= Math.pow(.001, dt);
  gun.position.z = -.55 + gunKick * .09;
  gun.position.y = -.3 + Math.sin(P.bob * 2) * .012;
  gun.rotation.x = gunKick * .18;
  if(flash.visible){
    flash.scale.setScalar(.7 + Math.random() * .6);
    flashLight.intensity *= .7;
    if(flashLight.intensity < .3){ flash.visible = false; flashLight.intensity = 0; }
  }

  elder.position.y = groundH(elder.position.x, elder.position.z) + Math.sin(t * 2) * .02;
  merchant.position.y = groundH(merchant.position.x, merchant.position.z) + Math.sin(t * 2 + 1) * .02;

  if(msgT > 0){ msgT -= dt; if(msgT <= 0) msgEl.style.opacity = 0; }

  updateHUD();
  if(battle.active) drawBattle(dt);
  drawMini();
  renderer.render(scene, camera);
}
loop();

document.getElementById('startBtn').onclick = function(){
  ac();
  SFX.level();
  document.getElementById('startVeil').classList.add('hidden');
  mode = 'play';
  updateHint();
  tryLock();
};
