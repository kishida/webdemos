<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';
import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { VRButton } from 'three/addons/webxr/VRButton.js';
import { loadFish, createFish, FISH } from './fish-kit.js';

// ---------------------------------------------------------------------------------------------
// 水槽の寸法（m）。ガラスは z = GLASS_Z、水槽は z < GLASS_Z の側、床は y = 0、水面は y = SURFACE
// ---------------------------------------------------------------------------------------------
const GLASS_Z = -0.3, SURFACE = 5.0;
const TANK = { x0: -6.6, x1: 6.6, z0: -8.6, z1: GLASS_Z };
const WIN = { x0: -5.6, x1: 5.6, y0: 0.3, y1: 4.8 };
const SWIM = { x0: -6.1, x1: 6.1, y0: 0.2, y1: 4.7, z0: -8.1, z1: -0.85 };

const rand = (a, b) => a + (b - a) * Math.random();
const clamp = THREE.MathUtils.clamp;
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

// ---------------------------------------------------------------------------------------------
// 水の色：ガラスより奥を通る光の距離だけ、赤から先に吸われ、青緑の濁りに溶ける。three.js の fog の chunk を差し替え、
// 魚（fish-kit の材質）を含むすべての材質にかける。手前の通路（z > GLASS_Z）にはかからない
// ---------------------------------------------------------------------------------------------
const WATER_GLSL = `
uniform vec3 uWaterDeep, uWaterTop;
uniform float uWaterDensity;
vec3 waterTint(vec3 col, vec3 wp) {
  vec3 cam = cameraPosition;
  float total = length(wp - cam);
  float inside = wp.z < ${GLASS_Z.toFixed(2)} ? clamp((${GLASS_Z.toFixed(2)} - wp.z) / max(cam.z - wp.z, 1e-3), 0.0, 1.0) : 0.0;
  float d = total * inside;
  col *= exp(-vec3(0.30, 0.075, 0.055) * d);
  float h = clamp(wp.y / ${SURFACE.toFixed(1)}, 0.0, 1.0);
  vec3 fogC = mix(uWaterDeep, uWaterTop, h * h);
  float f = 1.0 - exp(-uWaterDensity * d);
  return mix(col, fogC, f);
}
`;
const waterU = {
  uWaterDeep: { value: new THREE.Color(0x041d2a) },
  uWaterTop: { value: new THREE.Color(0x1d6f86) },
  uWaterDensity: { value: 0.105 },
};
THREE.ShaderChunk.fog_pars_vertex = `#ifdef USE_FOG
varying vec3 vFogWorld;
#endif`;
THREE.ShaderChunk.fog_vertex = `#ifdef USE_FOG
vFogWorld = transpose(mat3(viewMatrix)) * (mvPosition.xyz - viewMatrix[3].xyz);
#endif`;
THREE.ShaderChunk.fog_pars_fragment = `#ifdef USE_FOG
varying vec3 vFogWorld;
${WATER_GLSL}
#endif`;
THREE.ShaderChunk.fog_fragment = `#ifdef USE_FOG
gl_FragColor.rgb = waterTint(gl_FragColor.rgb, vFogWorld);
#endif`;
// fog の uniform（fogColor など）に水の uniform を足す
Object.assign(THREE.UniformsLib.fog, waterU);
for (const k of ['basic', 'lambert', 'phong', 'standard', 'physical', 'toon', 'matcap', 'points', 'sprite']) {
  const sh = THREE.ShaderLib[k];
  if (sh) Object.assign(sh.uniforms, waterU);
}

// ---------------------------------------------------------------------------------------------
// ノイズ（JS：岩・砂の形、GLSL：テクスチャ）
// ---------------------------------------------------------------------------------------------
function hash3(x, y, z) {
  let h = Math.imul(x, 374761393) ^ Math.imul(y, 668265263) ^ Math.imul(z, 1274126177);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
}
function vnoise(x, y, z) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  const xf = x - xi, yf = y - yi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf), w = zf * zf * (3 - 2 * zf);
  const l = (a, b, t) => a + (b - a) * t;
  const c = (dx, dy, dz) => hash3(xi + dx, yi + dy, zi + dz);
  return l(l(l(c(0,0,0), c(1,0,0), u), l(c(0,1,0), c(1,1,0), u), v),
           l(l(c(0,0,1), c(1,0,1), u), l(c(0,1,1), c(1,1,1), u), v), w) * 2 - 1;
}
function fbm(x, y, z, oct = 5) {
  let s = 0, a = 0.5, f = 1;
  for (let i = 0; i < oct; i++) { s += a * vnoise(x * f, y * f, z * f); f *= 2.03; a *= 0.5; }
  return s;
}
// 繰り返せるノイズの画像（岩・砂の細かいむら）
function tileNoiseTexture(size = 256, period = 8, oct = 5) {
  const cv = document.createElement('canvas'); cv.width = cv.height = size;
  const ctx = cv.getContext('2d'); const img = ctx.createImageData(size, size);
  const per = (x, y, p) => {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    const h = (a, b) => hash3(((a % p) + p) % p, ((b % p) + p) % p, p);
    const a = h(xi, yi), b = h(xi + 1, yi), c = h(xi, yi + 1), d = h(xi + 1, yi + 1);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  };
  for (let j = 0; j < size; j++) for (let i = 0; i < size; i++) {
    let s = 0, amp = 0.5, p = period;
    for (let o = 0; o < oct; o++) { s += amp * per(i / size * p, j / size * p, p); p *= 2; amp *= 0.5; }
    const g = clamp(s * 255, 0, 255);
    const k = (j * size + i) * 4; img.data[k] = img.data[k + 1] = img.data[k + 2] = g; img.data[k + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(cv); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.NoColorSpace;
  return t;
}
const noiseTex = tileNoiseTexture(256, 8, 6);

// 世界座標で 3 方向から貼るむら（色）と、そのむらを凹凸に見せる法線のずらし
function addSurfaceDetail(mat, { scale = 1.5, colorAmt = 0.6, bump = 0.02, scale2 = 6 } = {}) {
  mat.onBeforeCompile = (sh) => {
    sh.uniforms.uNoise = { value: noiseTex };
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vWP; varying vec3 vWN;')
      .replace('#include <project_vertex>', '#include <project_vertex>\nvWP = (modelMatrix * vec4(transformed, 1.0)).xyz; vWN = normalize(mat3(modelMatrix) * objectNormal);');
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', `#include <common>
varying vec3 vWP; varying vec3 vWN; uniform sampler2D uNoise; float gDetailH;
float tri(vec3 p, vec3 n) {
  vec3 w = pow(abs(n), vec3(4.0)); w /= (w.x + w.y + w.z);
  return texture2D(uNoise, p.yz).r * w.x + texture2D(uNoise, p.zx).r * w.y + texture2D(uNoise, p.xy).r * w.z;
}`)
      .replace('#include <map_fragment>', `#include <map_fragment>
{
  float a = tri(vWP * ${(scale / 8).toFixed(4)}, vWN);
  float b = tri(vWP * ${(scale2 / 8).toFixed(4)} + 0.37, vWN);
  gDetailH = a * 0.65 + b * 0.35;
  diffuseColor.rgb *= mix(1.0, 0.35 + 1.3 * gDetailH, ${colorAmt.toFixed(3)});
}`)
      .replace('#include <normal_fragment_maps>', `#include <normal_fragment_maps>
{
  vec2 dH = vec2(dFdx(gDetailH), dFdy(gDetailH)) * ${(bump * 40).toFixed(4)};
  vec3 sx = dFdx(-vViewPosition), sy = dFdy(-vViewPosition);
  vec3 r1 = cross(sy, normal), r2 = cross(normal, sx);
  float det = dot(sx, r1) * faceDirection;
  vec3 grad = sign(det) * (dH.x * r1 + dH.y * r2);
  normal = normalize(abs(det) * normal - grad);
}`);
  };
  mat.customProgramCacheKey = () => `detail-${scale}-${colorAmt}-${bump}-${scale2}`;
  return mat;
}

// ---------------------------------------------------------------------------------------------
// renderer・scene・camera
// ---------------------------------------------------------------------------------------------
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.35;
document.body.appendChild(renderer.domElement);
RectAreaLightUniformsLib.init();

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x02070a);
scene.fog = new THREE.FogExp2(0x0b3442, 0.1); // 値は使わず、fog の chunk を有効にするため
const camera = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, 0.05, 60);

// ---------------------------------------------------------------------------------------------
// 光：水面からの光（コースティクスを映すスポットライト）、空と海底の照り返し、通路を照らす窓の光
// ---------------------------------------------------------------------------------------------
const hemi = new THREE.HemisphereLight(0x8fd0e2, 0x1c2c30, 1.25);
scene.add(hemi);

// コースティクスの模様を毎フレーム描く
const causticRT = new THREE.WebGLRenderTarget(1024, 1024, { type: THREE.HalfFloatType });
causticRT.texture.wrapS = causticRT.texture.wrapT = THREE.RepeatWrapping;
const causticMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
  fragmentShader: `
    varying vec2 vUv; uniform float uTime;
    float caus(vec2 p, float t) {
      vec2 i = p; float c = 1.0; float inten = 0.005;
      for (int n = 0; n < 5; n++) {
        float tt = t * (1.0 - (3.5 / float(n + 1)));
        i = p + vec2(cos(tt - i.x) + sin(tt + i.y), sin(tt - i.y) + cos(tt + i.x));
        c += 1.0 / length(vec2(p.x / (sin(i.x + tt) / inten), p.y / (cos(i.y + tt) / inten)));
      }
      c /= 5.0; c = 1.17 - pow(c, 1.4);
      return pow(abs(c), 7.0);
    }
    void main() {
      vec2 uv = vUv * 9.0;
      vec2 p = mod(uv * 6.28318, 6.28318) - 250.0;
      float t = uTime * 0.45 + 23.0;
      float r = caus(p + vec2(0.05, 0.0), t);
      float g = caus(p, t);
      float b = caus(p - vec2(0.05, 0.0), t);
      vec3 c = clamp(vec3(r, g, b), 0.0, 1.2);
      float edge = smoothstep(0.5, 0.36, length(vUv - 0.5));
      gl_FragColor = vec4((vec3(0.32) + c * 1.7) * edge, 1.0);
    }`,
  depthTest: false, depthWrite: false,
});
const causticScene = new THREE.Scene();
const causticQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), causticMat);
causticQuad.frustumCulled = false;
causticScene.add(causticQuad);
const causticCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

const sun = new THREE.SpotLight(0xd8f4ff, 5.0, 0, 0.62, 0.35, 0);
sun.position.set(1.5, 15, -4.4);
sun.target.position.set(0, 0, -4.4);
sun.map = causticRT.texture;
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 8; sun.shadow.camera.far = 18;
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.02;
sun.shadow.radius = 4;
scene.add(sun, sun.target);

// 手前の通路：窓から漏れる青い光
const winLight = new THREE.RectAreaLight(0x3aa0c0, 2.2, WIN.x1 - WIN.x0, WIN.y1 - WIN.y0);
winLight.position.set(0, (WIN.y0 + WIN.y1) / 2, GLASS_Z + 0.02);
winLight.lookAt(0, (WIN.y0 + WIN.y1) / 2, 10);
scene.add(winLight);

// ---------------------------------------------------------------------------------------------
// 砂の床
// ---------------------------------------------------------------------------------------------
function floorHeight(x, z) {
  const ripple = Math.sin((x * 0.8 + z * 0.35) * 8 + fbm(x * 0.4, 0, z * 0.4, 3) * 4) * 0.012;
  const dunes = fbm(x * 0.18, 3.1, z * 0.18, 4) * 0.22;
  const back = THREE.MathUtils.smoothstep(-z, 5.5, 8.6) * 0.55 + THREE.MathUtils.smoothstep(Math.abs(x), 4.8, 6.6) * 0.35;
  return 0.08 + ripple + dunes + back;
}
{
  // 奥は壁の裏まで、手前はガラスの位置で止める（通路側へ突き抜けないように）
  const g = new THREE.PlaneGeometry(TANK.x1 - TANK.x0 + 1, GLASS_Z - (TANK.z0 - 0.5), 260, 180);
  g.rotateX(-Math.PI / 2);
  g.translate((TANK.x0 + TANK.x1) / 2, 0, (GLASS_Z + TANK.z0 - 0.5) / 2);
  const pos = g.attributes.position;
  const col = new Float32Array(pos.count * 3);
  const sand = new THREE.Color(0xb8a98a), dark = new THREE.Color(0x6e6858), tmp = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    pos.setY(i, floorHeight(x, z));
    const n = fbm(x * 0.6, 7.7, z * 0.6, 4) * 0.5 + 0.5;
    tmp.copy(sand).lerp(dark, clamp(n * 0.9 - 0.15, 0, 1));
    col.set([tmp.r, tmp.g, tmp.b], i * 3);
  }
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  g.computeVertexNormals();
  const m = addSurfaceDetail(new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.95 }), { scale: 3, colorAmt: 0.45, bump: 0.012, scale2: 14 });
  const floor = new THREE.Mesh(g, m);
  floor.receiveShadow = true;
  scene.add(floor);
}

// ---------------------------------------------------------------------------------------------
// 岩：ノイズでゆがめた球。上を向いた面には海藻の緑、下は暗く
// ---------------------------------------------------------------------------------------------
const rockMat = addSurfaceDetail(new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.92 }), { scale: 2.0, colorAmt: 0.6, bump: 0.018, scale2: 7 });
const rocks = [], obstacles = [];
function makeRock(cx, cz, sx, sy, sz, seed, rotY = 0, sink = 0.25) {
  let g = new THREE.IcosahedronGeometry(1, 24);
  g.deleteAttribute('normal'); g.deleteAttribute('uv');
  g = mergeVertices(g);
  const pos = g.attributes.position, v = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    const n1 = fbm(v.x * 1.1 + seed, v.y * 1.1, v.z * 1.1 - seed, 5);
    const n2 = Math.abs(fbm(v.x * 3.2 - seed, v.y * 3.2 + seed, v.z * 3.2, 3));
    const r = 1 + 0.42 * n1 - 0.12 * n2;
    v.multiplyScalar(r);
    // 層のような段
    v.y = v.y + Math.sin(v.y * 7 + n1 * 3) * 0.025;
    if (v.y < -0.35) v.y = -0.35 + (v.y + 0.35) * 0.25;
    pos.setXYZ(i, v.x, v.y, v.z);
  }
  g.scale(sx, sy, sz);
  g.rotateY(rotY);
  g.computeVertexNormals();
  const nrm = g.attributes.normal;
  const col = new Float32Array(pos.count * 3);
  const base = new THREE.Color().setHSL(0.08 + Math.random() * 0.04, 0.12, 0.26);
  const algae = new THREE.Color(0x4f6b2e), coral = new THREE.Color(0x8a4b48), under = new THREE.Color(0x15181a), tmp = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i), ny = nrm.getY(i);
    tmp.copy(base).multiplyScalar(0.8 + 0.4 * (fbm(x * 2, y * 2, z * 2, 3) * 0.5 + 0.5));
    const a = clamp((ny - 0.35) * 2.2 + fbm(x * 1.7 + 4, y * 1.7, z * 1.7, 4) * 1.3, 0, 1);
    tmp.lerp(algae, a * 0.75);
    const c = clamp(fbm(x * 3 - 9, y * 3, z * 3, 3) * 3 - 0.9, 0, 1);
    tmp.lerp(coral, c * 0.55);
    tmp.lerp(under, clamp(-ny * 1.2, 0, 0.8));
    col.set([tmp.r, tmp.g, tmp.b], i * 3);
  }
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const mesh = new THREE.Mesh(g, rockMat);
  const y = floorHeight(cx, cz) + sy * (0.35 - sink);
  mesh.position.set(cx, y, cz);
  mesh.castShadow = mesh.receiveShadow = true;
  scene.add(mesh);
  rocks.push(mesh);
  obstacles.push({ c: new THREE.Vector3(cx, y + sy * 0.15, cz), r: Math.max(sx, sz) * 1.05, top: y + sy * 1.2 });
  return mesh;
}
// 奥の左右に大きな岩組み、中央に根、手前に小石
const ROCKS = [
  [-4.9, -6.9, 1.9, 2.4, 1.6, 1.0, 0.3], [-3.3, -7.6, 1.5, 1.6, 1.2, 2.2, 1.1], [-5.8, -4.8, 1.2, 1.5, 1.6, 3.4, 0.2],
  [-4.2, -5.5, 0.9, 0.8, 0.8, 4.4, 0.9],
  [4.6, -7.2, 2.1, 2.9, 1.5, 5.1, -0.3], [5.7, -5.0, 1.1, 1.9, 1.5, 6.3, 0.4], [3.0, -7.8, 1.3, 1.2, 1.0, 7.5, 0.8],
  [3.6, -5.9, 0.8, 0.7, 0.7, 8.8, 0.2],

      }
      if (fled) speed *= 1.8;
      speed = speed * s.speedK * (1 + 0.12 * Math.sin(performance.now() * 0.001 + this.phaseK));
      if (dt0 > 2.5) speed *= 1.15;
      if (s.burst > 0) speed *= 2.2;
      speed = Math.min(speed, this.cruise * 3);
      this.fish.setMotion(s.burst > 0 ? 'power' : 'swim');
    } else if (this.kind === 'cruise') {
      if (this.pos.distanceTo(this.target) < 1.2 + this.L || (this.timer -= dt) < 0) { this.pickWaypoint(); this.timer = rand(10, 18); }
      want.copy(this.target).sub(this.pos).normalize().addScaledVector(this.fwd(tmpA), 1.2);
      this.fish.setMotion('swim');
    } else {
      // reef（根につく魚）・bottom（底の魚）・upright（立ち泳ぎ）
      this.timer -= dt;
      if (this.state === 'rest') {
        speed = 0;
        this.fish.setMotion('hover');
        if (this.timer < 0) { this.state = 'move'; this.pickWaypoint(); this.timer = 15; }
        want.set(Math.sin(this.restYaw), 0, Math.cos(this.restYaw));
        if (Math.random() < dt * 0.08) this.restYaw += rand(-0.8, 0.8);
        this.steer(want, 0, dt);
        this.pitch *= 1 - Math.min(1, dt * 2);
        this.integrate(dt, true);
        return;
      }
      const toT = tmpB.copy(this.target).sub(this.pos); const d = toT.length();
      if (d < 0.2 + this.L * 0.6 || this.timer < 0) {
        if (Math.random() < this.restChance) { this.state = 'rest'; this.timer = rand(...this.restTime); this.restYaw = this.heading + rand(-0.6, 0.6); }
        else { this.pickWaypoint(); this.timer = 15; }
      }
      want.copy(toT.normalize()).addScaledVector(this.fwd(tmpA), 0.6);
      speed = this.cruise * clamp(d / (this.L * 2 + 0.3), 0.35, 1);
      this.fish.setMotion('swim');
    }
    // まわりの大きめの魚と重ならない
    if (this.kind !== 'school') {
      for (const o of solos) {
        if (o === this) continue;
        const dd = tmpB.copy(this.pos).sub(o.pos); const dl = dd.length(), rr = (this.L + o.L) * 0.6 + 0.15;
        if (dl < rr && dl > 1e-4) want.addScaledVector(dd.divideScalar(dl), 1.5 * (1 - dl / rr));
      }
    }
    if (want.lengthSq() < 1e-6) this.fwd(want);
    want.normalize();
    want.addScaledVector(this.avoid(V()), 2.6).normalize();
    this.steer(want, speed, dt);
    this.integrate(dt, false);
  }
  integrate(dt, resting) {
    this.fish.drive.speed = this.speedWant;
    this.fish.drive.turnRate = this.turnRate;
    this.heading += this.turnRate * dt;
    this.fish.update(dt);
    if (!resting) {
      this.pos.addScaledVector(this.fwd(tmpA), this.fish.currentSpeed * dt);
      const g = groundAt(this.pos.x, this.pos.z) + this.L * 0.18;
      this.pos.x = clamp(this.pos.x, SWIM.x0, SWIM.x1);
      this.pos.z = clamp(this.pos.z, SWIM.z0, SWIM.z1);
      this.pos.y = clamp(this.pos.y, Math.max(g, SWIM.y0 - 0.1), SWIM.y1);
    }
    this.obj.position.copy(this.pos);
    this.obj.rotation.set(-this.pitch, this.heading, 0);
  }
}

class School {
  constructor(id, n, cmRange, region, opt = {}) {
    this.members = []; this.region = region; this.target = V(); this.pull = opt.pull ?? 0.35;
    this.speedK = opt.speedK ?? 1; this.burst = 0; this.timer = 0;
    this.pickTarget();
    const c = this.target.clone();
    for (let i = 0; i < n; i++) {
      const a = new Agent(id, rand(...cmRange), 'school', { detail: opt.detail ?? 'auto', speed: opt.speed });
      a.school = this; a.phaseK = Math.random() * 10;
      a.pos.set(c.x + rand(-1, 1) * 0.8, c.y + rand(-0.4, 0.4), c.z + rand(-0.6, 0.6));
      a.heading = rand(0, 0.6);
      this.members.push(a);
    }
    schools.push(this);
  }
  pickTarget() {
    const r = this.region;
    this.target.set(rand(r.x0, r.x1), rand(r.y0, r.y1), rand(r.z0, r.z1));
    this.timer = rand(7, 14);
  }
  update(dt) {
    this.timer -= dt;
    let cx = 0, cy = 0, cz = 0;
    for (const m of this.members) { cx += m.pos.x; cy += m.pos.y; cz += m.pos.z; }
    const n = this.members.length;
    const d = Math.hypot(cx / n - this.target.x, cy / n - this.target.y, cz / n - this.target.z);
    if (this.timer < 0 || d < 1.2) this.pickTarget();
    if (this.burst > 0) this.burst -= dt;
    else if (this.burstK && Math.random() < dt * this.burstK) this.burst = rand(0.8, 1.6);
  }
}

function reef(id, n, cmRange, home, range, opt = {}) {
  for (let i = 0; i < n; i++) {
    const a = new Agent(id, rand(...cmRange), opt.kind ?? 'reef', {

    if (opt.startRest) { a.state = 'rest'; a.timer = rand(...a.restTime); a.restYaw = a.heading; }
    solos.push(a);

}

      const speed = 1.3 * dt;
      rig.position.x += (headDir.x * -ay - headDir.z * ax) * speed;
      rig.position.z += (headDir.z * -ay + headDir.x * ax) * speed;
    } else if (src.handedness === 'right') {
      if (Math.abs(ax) > 0.6 && snapReady) {
        snapReady = false;
        xrCam.getWorldPosition(headPos);
        rig.rotation.y -= Math.sign(ax) * Math.PI / 6;
        rig.updateMatrixWorld(true);
        xrCam.updateMatrixWorld(true);
        // 頭の位置を中心に回す（体がずれないように）
        headPos2.copy(headPos).sub(rig.position).applyAxisAngle(new THREE.Vector3(0, 1, 0), -Math.sign(ax) * Math.PI / 6);
        rig.position.copy(headPos).sub(headPos2);
      } else if (Math.abs(ax) < 0.3) snapReady = true;
    }
  }
  rig.position.x = clamp(rig.position.x, -8, 8);
  rig.position.z = clamp(rig.position.z, 0.9, 10);
}

// ---------------------------------------------------------------------------------------------
// 起動
// ---------------------------------------------------------------------------------------------
const loading = document.getElementById('loading');
// 進み具合：段階ごとに全体の何 % を受け持つかを決め、段階の中の進みで埋める
const loadUI = { fill: document.getElementById('loadFill'), step: document.getElementById('loadStep'), pct: document.getElementById('loadPct'), shown: 0 };
const STAGES = [
  ['props', '沈めたものを読み込んでいます', 6],
  ['ground', '海底を作っています', 4],
  ['fish', '魚を読み込んでいます', 55],
  ['spawn', '魚を放しています', 20],
  ['swim', '群れを泳がせています', 7],
  ['compile', '描く準備をしています', 8],
];
const stageStart = {}; { let acc = 0; for (const [k, , w] of STAGES) { stageStart[k] = acc; acc += w; } }
let lastPaint = 0;
// 画面を書き換える機会を作る（重い処理の合間に呼ぶ。描き直しは 1 フレームに 1 回まで）
const yieldFrame = () => new Promise((r) => { const t = setTimeout(r, 50); requestAnimationFrame(() => { clearTimeout(t); r(); }); });
async function progress(stage, f = 0) {
  const st = STAGES.find((s) => s[0] === stage);
  const v = Math.max(loadUI.shown, Math.min(100, stageStart[stage] + st[2] * clamp(f, 0, 1)));
  loadUI.shown = v;
  loadUI.fill.style.width = v.toFixed(1) + '%';
  loadUI.pct.textContent = Math.floor(v) + '%';
  loadUI.step.textContent = st[1];
  const now = performance.now();
  if (now - lastPaint > 30) { lastPaint = now; await yieldFrame(); }
}
await progress('props', 0);
await loadProps((f) => progress('props', f));
await progress('ground', 0);
buildGroundGrid();
await progress('ground', 0.6);
buildKelp();
// 魚のファイル（glb と頭の写真）は three.js の読み込み管理を通るので、読み終えた数で進める
await progress('fish', 0);
{
  const mgr = THREE.DefaultLoadingManager;
  let base = null;
  // 魚 1 種で 8 件（glb 2 つ・その中の画像 4 枚・頭の写真 2 枚。写真のない種類もある）。
  // 種類ごとに順に読むので途中の総数は増えていく。最初から全体の見込みで割り、進みが戻らないようにする
  const expected = FISH.length * 8 - 2;
  mgr.onProgress = (url, loaded, total) => {
    if (base === null) base = loaded - 1;
    progress('fish', (loaded - base) / Math.max(expected, total - base));
  };
  // 読み込んだあとの形の組み立てが重く、その間は画面が止まる。4 種ずつ読み、合間に表示を書き換える
  const ids = FISH.map((f) => f.id);
  for (let i = 0; i < ids.length; i += 4) {
    await loadFish('./fish/', ids.slice(i, i + 4));
    await yieldFrame();
  }
  mgr.onProgress = undefined;
}
await progress('spawn', 0);
await populate((f) => progress('spawn', f));
// 群れを少し泳がせてから見せる
for (let i = 0; i < 90; i++) {
  for (const s of schools) s.update(1 / 30);
  for (const a of agents) a.update(1 / 30);
  if (i % 10 === 9) await progress('swim', (i + 1) / 90);
}
// 最初の 1 枚で材質をまとめて組み立てると止まるので、先に済ませておく
await progress('compile', 0);
updateCamera(0, 1);
try { await renderer.compileAsync(scene, camera); } catch (e) { /* 古いブラウザでは最初の描画で組み立てる */ }
await progress('compile', 1);
loading.classList.add('done');

const clock = new THREE.Timer();
const rayEye = new THREE.Vector3();
let time = 0;
renderer.setAnimationLoop(() => {
  clock.update(); const dt = Math.min(clock.getDelta(), 1 / 20);
  time += dt;
  const inVR = renderer.xr.isPresenting;
  causticMat.uniforms.uTime.value = time;
  {
    // VR 中は XR を一時的に切って、コースティクスの画像に描く
    const prevRT = renderer.getRenderTarget(); const xrOn = renderer.xr.enabled;
    renderer.xr.enabled = false;
    renderer.setRenderTarget(causticRT); renderer.render(causticScene, causticCam);
    renderer.xr.enabled = xrOn;
    renderer.setRenderTarget(prevRT);
  }
  kelpU.uTime.value = time; surfU.uTime.value = time;
  snow.material.uniforms.uTime.value = time; bubbles.material.uniforms.uTime.value = time;
  finish.uniforms.uTime.value = time;
  const eye = (inVR ? renderer.xr.getCamera() : camera).getWorldPosition(rayEye);
  for (const r of rays) {
    r.material.uniforms.uTime.value = time;
    r.lookAt(eye.x, r.position.y, eye.z);
    r.rotateZ(r.userData.tilt);
  }
  for (const s of schools) s.update(dt);
  for (const a of agents) a.update(dt);
  if (inVR) {
    // 後処理（にじみ・周辺減光）は VR では使えないので、そのまま描く
    vrMove(dt);
    updateTags(dt);
    renderer.render(scene, camera);
  } else {
    updateCamera(time, dt);
    pickFish(performance.now());
    composer.render();
  }
});
</script>
