<title>SKY HARBOR フライトシミュレーター</title>
<style>
  :root { --bg: rgba(12,18,28,0.82); --line: rgba(255,255,255,0.14); --acc: #4fb3ff; --acc2: #ffcf4a; --txt: #e9eef4; --sub: #9fb0c2; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1018; color: var(--txt); font-family: "Segoe UI", "Yu Gothic UI", "Hiragino Sans", sans-serif; }
  #gl, #hud { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #hud { pointer-events: none; }
  .overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; }
  .overlay.show { display: flex; }
  #loading { background: #0b1018 url(textures/title.png) center/cover; z-index: 30; flex-direction: column; justify-content: flex-end; padding-bottom: 8vh; }
  #loading .bar { width: min(520px, 80vw); height: 6px; background: rgba(255,255,255,0.2); border-radius: 3px; overflow: hidden; }
  #loading .bar i { display: block; height: 100%; width: 0; background: var(--acc2); transition: width .3s; }
  #loading .t { margin-top: 12px; font-size: 15px; text-shadow: 0 1px 4px #000; }
  #loading h1 { position: absolute; top: 8vh; left: 0; right: 0; text-align: center; font-size: clamp(30px, 5vw, 64px); letter-spacing: .08em; margin: 0; text-shadow: 0 3px 16px rgba(0,0,0,.7); }
  #menu { z-index: 20; align-items: stretch; justify-content: flex-start; background: linear-gradient(90deg, rgba(8,12,20,0.88) 0%, rgba(8,12,20,0.7) 46%, rgba(8,12,20,0) 75%); }
  #menu .panel { width: min(620px, 100vw); padding: 28px 32px; overflow-y: auto; }
  #menu h1 { margin: 0 0 2px; font-size: 34px; letter-spacing: .06em; }
  #menu h1 span { color: var(--acc2); }
  #menu .lead { color: var(--sub); margin: 0 0 18px; font-size: 14px; }
  .sec { margin: 16px 0 6px; font-size: 13px; color: var(--sub); letter-spacing: .1em; }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .card { border: 1px solid var(--line); background: rgba(255,255,255,0.04); border-radius: 10px; padding: 12px; cursor: pointer; transition: .15s; }
  .card:hover { background: rgba(255,255,255,0.09); }
  .card.sel { border-color: var(--acc); background: rgba(79,179,255,0.16); box-shadow: 0 0 0 1px var(--acc) inset; }
  .card b { display: block; font-size: 17px; }
  .card small { color: var(--sub); font-size: 11.5px; display: block; margin-top: 2px; }
  .card p { font-size: 12px; color: #c8d2dd; margin: 8px 0 0; line-height: 1.45; }
  .seg { display: flex; flex-wrap: wrap; gap: 6px; }
  .seg button { flex: 1 1 auto; min-width: 90px; padding: 9px 10px; background: rgba(255,255,255,0.05); color: var(--txt); border: 1px solid var(--line); border-radius: 8px; cursor: pointer; font: inherit; font-size: 13.5px; }
  .seg button:hover { background: rgba(255,255,255,0.1); }
  .seg button.sel { background: rgba(79,179,255,0.2); border-color: var(--acc); }
  .opts { display: flex; gap: 18px; flex-wrap: wrap; font-size: 14px; }
  .opts label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
  .go { margin-top: 22px; width: 100%; padding: 15px; font-size: 19px; font-weight: 700; letter-spacing: .1em; background: linear-gradient(180deg, #ffd864, #f2b52a); color: #1a1406; border: none; border-radius: 10px; cursor: pointer; }
  .go:disabled { opacity: .5; cursor: wait; }
  .keys { margin-top: 18px; display: grid; grid-template-columns: auto 1fr auto 1fr; gap: 4px 10px; font-size: 12.5px; color: #c8d2dd; }
  kbd { background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.2); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; font-family: inherit; font-size: 12px; white-space: nowrap; }
  .modal { background: var(--bg); border: 1px solid var(--line); border-radius: 14px; padding: 26px 30px; min-width: min(440px, 92vw); max-width: 92vw; text-align: center; backdrop-filter: blur(6px); }
  .modal h2 { margin: 0 0 8px; font-size: 26px; }
  .modal .row { display: flex; justify-content: space-between; gap: 20px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
  .modal .row span:first-child { color: var(--sub); }
  .modal .grade { font-size: 64px; font-weight: 800; color: var(--acc2); line-height: 1; margin: 6px 0 2px; }
  .btns { display: flex; gap: 10px; justify-content: center; margin-top: 18px; flex-wrap: wrap; }
  .btns button { padding: 10px 18px; font: inherit; font-size: 15px; border-radius: 8px; border: 1px solid var(--line); background: rgba(255,255,255,0.08); color: var(--txt); cursor: pointer; }
  .btns button.pri { background: var(--acc); border-color: var(--acc); color: #04121f; font-weight: 700; }
  #pause, #result, #crash { z-index: 25; background: rgba(0,0,0,0.35); }
  #help { z-index: 15; justify-content: flex-start; align-items: flex-start; pointer-events: none; }
  #help .modal { margin: 70px 0 0 16px; text-align: left; pointer-events: auto; min-width: 0; padding: 16px 18px; }
  #help .keys { margin-top: 6px; }
  #camlabel { position: fixed; left: 16px; top: 14px; font-size: 13px; color: #dfe7ef; text-shadow: 0 1px 3px #000; z-index: 5; pointer-events: none; }
  @media (max-width: 720px) { .cards { grid-template-columns: 1fr; } #menu .panel { padding: 18px 16px; } }
</style>
<script type="importmap">
{ "imports": { "three": "./js/lib/three.module.js", "three/addons/": "./js/lib/" } }
</script>
<script src="js/fm-worklet.js"></script>
<script src="js/fm-audio.js"></script>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="hud"></canvas>
<div id="camlabel"></div>

<div id="loading" class="overlay show">
  <h1>SKY HARBOR</h1>
  <div class="bar"><i id="loadbar"></i></div>
  <div class="t" id="loadtxt">読み込み中…</div>
</div>

<div id="menu" class="overlay">
  <div class="panel">
    <h1>SKY <span>HARBOR</span></h1>
    <p class="lead">川と橋の街に囲まれた空港で、離陸と着陸を楽しむフライトシミュレーター</p>
    <div class="sec">機体</div>
    <div class="cards" id="cards"></div>
    <div class="sec">開始位置</div>
    <div class="seg" data-key="start">
      <button data-v="runway">滑走路から離陸</button>
      <button data-v="final">最終進入（着陸）</button>
      <button data-v="long">遠方から進入</button>
      <button data-v="air">上空で自由飛行</button>
    </div>
    <div class="sec">時間帯</div>
    <div class="seg" data-key="time">
      <button data-v="morning">朝</button><button data-v="noon">昼</button><button data-v="evening">夕方</button><button data-v="night">夜</button>
    </div>
    <div class="sec">風</div>
    <div class="seg" data-key="wind">
      <button data-v="calm">無風</button><button data-v="light">弱い向かい風</button><button data-v="cross">横風 10kt</button><button data-v="gusty">突風・乱気流</button>
    </div>
    <div class="sec">オプション</div>
    <div class="opts">
      <label><input type="checkbox" id="optTrim" checked> オートトリム（小型機）</label>
      <label><input type="checkbox" id="optCall" checked> 高度コールアウト（音声）</label>
      <label><input type="checkbox" id="optMap" checked> ミニマップ</label>
    </div>
    <button class="go" id="go" disabled>ワールド生成中…</button>
    <div class="keys" id="keys1"></div>
  </div>
</div>

<div id="pause" class="overlay"><div class="modal">
  <h2>一時停止</h2>
  <div class="btns"><button class="pri" data-act="resume">再開</button><button data-act="restart">やり直し</button><button data-act="menu">メニューへ</button></div>
</div></div>

<div id="result" class="overlay"><div class="modal">
  <h2 id="resTitle">着陸成功</h2>
  <div class="grade" id="resGrade">A</div>
  <div id="resRows"></div>
  <div class="btns"><button class="pri" data-act="restart">もう一度</button><button data-act="continue">このまま続ける</button><button data-act="menu">メニューへ</button></div>
</div></div>

<div id="crash" class="overlay"><div class="modal">
  <h2 style="color:#ff6a5a">墜落</h2>
  <p id="crashReason" style="font-size:16px"></p>
  <div class="btns"><button class="pri" data-act="restart">やり直し</button><button data-act="menu">メニューへ</button></div>
</div></div>

<div id="help" class="overlay"><div class="modal">
  <b>操作方法</b> <span style="color:#9fb0c2;font-size:12px">（H で閉じる）</span>
  <div class="keys" id="keys2"></div>
</div></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
